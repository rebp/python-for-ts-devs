[project]
name = "python-for-ts-devs-exercises"
version = "0.1.0"
description = "Self-checking exercises for the course Python for TypeScript developers"
readme = "README.md"
requires-python = ">=3.15"
# Libraries used in the lessons; development tools are listed below.
dependencies = [
    "fastapi>=0.163.1",
    "httpx2>=2.16.0",
    "lxml>=6.2.0",
    "numpy>=2.5.5",
    "openai>=3.60.0",
    "pandas>=3.1.1",
    "polars>=2.2.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "typer>=0.29.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.22",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-lxml>=2026.2.16",
]

[tool.pytest.ini_options]
# Tests live next to the exercises. Pass --solutions to run them against solutions/.
testpaths = ["exercises"]

[tool.ruff]
extend-exclude = ["index.html", "*.md"]
