[project]
name = "python-for-ts-devs-exercises"
version = "0.1.0"
description = "Self-checking exercises for the course Python for TypeScript developers"
readme = "README.md"
requires-python = ">=3.12"
# Libraries that the lessons use: Pydantic (13), FastAPI + httpx (28, 30-32), SQLAlchemy (29),
# pydantic-settings (32), Typer (33), pandas (34).
dependencies = [
    "fastapi>=0.163.1",
    "httpx2>=2.16.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# Tests live next to the exercises. Pass --solutions to run them against solutions/.
testpaths = ["exercises"]

[tool.ruff]
extend-exclude = ["index.html", "*.md"]
