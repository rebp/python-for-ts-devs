<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python for TypeScript developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F6EF; --surface:#FFFEFA; --ink:#202B26; --muted:#546159; --line:#DADDD2;
  --accent:#245946; --accent-soft:#E3EFE6; --on-accent:#FFFFFF;
  --ts:#285C9F; --ts-soft:#E6EFF9; --py:#C99A06; --py-ink:#735600; --py-soft:#FAEFCB;
  --ok:#2E7D4F; --ok-soft:#E2F1E7; --warn:#B4472B; --warn-soft:#FAE8E2;
  --code-bg:#F0F1EA; --kw:#7A3DB0; --str:#2E7D4F; --num:#B4472B; --fn:#285C9F;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B17; --surface:#1C2620; --ink:#EDF1E9; --muted:#ACBCB1; --line:#34473D;
    --accent:#A0DCBC; --accent-soft:#213D30; --on-accent:#14271D;
    --ts:#78A9EA; --ts-soft:#18263A; --py:#F2C94C; --py-ink:#F2C94C; --py-soft:#2A2513;
    --ok:#62C58E; --ok-soft:#15291E; --warn:#F08C6E; --warn-soft:#2E1B15;
    --code-bg:#141F19; --kw:#C9A0F2; --str:#8AD3A8; --num:#F4A584; --fn:#8DB8F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B17; --surface:#1C2620; --ink:#EDF1E9; --muted:#ACBCB1; --line:#34473D;
  --accent:#A0DCBC; --accent-soft:#213D30; --on-accent:#14271D;
  --ts:#78A9EA; --ts-soft:#18263A; --py:#F2C94C; --py-ink:#F2C94C; --py-soft:#2A2513;
  --ok:#62C58E; --ok-soft:#15291E; --warn:#F08C6E; --warn-soft:#2E1B15;
  --code-bg:#141F19; --kw:#C9A0F2; --str:#8AD3A8; --num:#F4A584; --fn:#8DB8F0;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.68;-webkit-text-size-adjust:100%}
a{color:var(--ts)}
:focus-visible{outline:2px solid var(--ts);outline-offset:2px;border-radius:4px}
a,button,summary,.done{touch-action:manipulation;-webkit-tap-highlight-color:var(--ts-soft)}
.skip-link{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));padding:8px 12px;border-radius:6px;background:var(--surface)}
.skip-link:not(:focus){clip-path:inset(50%)}
code,pre{font-family:var(--mono)}
p code,li code,td code,.task-text code,figcaption code,summary code{font-size:.86em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}

/* layout */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.sidebar-content{display:flex;flex-direction:column;min-height:0;font:14px/1.45 var(--ui)}
.drawer-head,.drawer-backdrop{display:none}
.outline-tools{flex:none;padding:20px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;line-height:1.3}
.brand:hover,.topbar .t:hover{color:var(--accent)}
.brand-mark{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:600 13px var(--mono)}
.brand small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.outline-tools p{margin:0;color:var(--muted);font-size:13px}
.progress{margin:16px 0}
.progress-bar{display:block;appearance:none;width:100%;height:6px;margin-top:6px;accent-color:var(--accent);border:0;border-radius:6px;background:var(--code-bg);overflow:hidden}
.progress-bar::-webkit-progress-bar{background:var(--code-bg)}
.progress-bar::-webkit-progress-value{background:var(--accent);border-radius:6px}
.progress-bar::-moz-progress-bar{background:var(--accent);border-radius:6px}
.lesson-search label{display:block;margin-bottom:4px;font-weight:600}
.search-field{display:flex;gap:6px}
.search-field input{min-width:0;width:100%;min-height:40px;padding:7px 10px;border:1px solid var(--muted);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.search-field input::placeholder{color:var(--muted)}
.storage-note{max-width:900px;margin:0 auto 16px;color:var(--warn);font:14px/1.5 var(--ui)}
.outline{overflow-y:auto;overscroll-behavior:contain;padding:8px 12px 24px}
.outline-note{margin:6px 4px;color:var(--muted);font-size:13px}
.nav-section + .nav-section{border-top:1px solid var(--line)}
.nav-section summary{padding:9px 5px;color:var(--muted);font-weight:650;cursor:pointer}
.nav-section summary:hover,.nav-section[open] summary{color:var(--ink)}
.nav-section summary .num{margin-inline:4px 5px}
.nav-list{list-style:none;margin:0;padding:0}
.nav-list a{display:grid;grid-template-columns:40px minmax(0,1fr) 14px;gap:6px;align-items:baseline;padding:7px 8px;border-radius:6px;text-decoration:none;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
.nav-list a:hover{background:var(--code-bg)}
.nav-list a[aria-current="page"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:650}
.num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav-list .check{color:var(--ok);font-size:13px}
.side-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.btn-quiet{font:600 14px/1.4 var(--ui);background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:7px;cursor:pointer}
.btn-quiet:hover{background:var(--code-bg)}

.topbar{display:none}
main{padding:44px 40px 90px;min-width:0}
.wrap{max-width:900px;margin:0 auto;container-type:inline-size;overflow-wrap:anywhere}
.wrap [tabindex="0"]:focus-visible{outline-offset:-3px}
.prose{max-width:68ch}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .topbar .t{display:grid;align-items:center;min-height:44px;font:700 14px/1.2 var(--ui);text-align:center;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
  .topbar .icon-btn{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border-color:transparent;border-radius:10px}
  .topbar .icon-btn:active{background:var(--accent-soft)}
  .topbar .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .topbar .theme-sun,.topbar [data-dark] .theme-moon{display:none}
  .topbar [data-dark] .theme-sun{display:block}
  .sidebar{display:none;position:fixed;z-index:30;inset:0 auto 0 0;width:min(88%,320px);height:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
  .sidebar-content{overscroll-behavior:contain}
  .outline-tools{padding-top:10px}
  .outline-tools .brand{min-height:44px}
  .drawer-head{display:flex;flex:none;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line);font:600 15px var(--ui)}
  .drawer-backdrop:not([hidden]){display:block;position:fixed;z-index:25;inset:0;background:rgba(0,0,0,.35);touch-action:none}
  body.nav-open{overflow:hidden}
  body.nav-open .sidebar{display:flex}
  .btn-quiet,.search-field input,.nav-list a,.map li a,.done,.task summary{min-height:44px}
  .nav-section summary{min-height:44px;padding-block:12px}
  .nav-list a,.map li a{align-items:center}
  .done{padding-block:6px}
  .task summary{padding-block:10px}
  main{padding:26px 18px 70px;padding-inline:max(clamp(12px,4vw,18px),env(safe-area-inset-left,0px)) max(clamp(12px,4vw,18px),env(safe-area-inset-right,0px))}
}
@media (max-width:880px) and (max-height:460px){
  .sidebar-content{overflow-y:auto}
  .outline{overflow:visible}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* headings */
h1,h2,h3{text-wrap:balance}
h1{font-size:clamp(32px,5vw,52px);line-height:1.12;margin:8px 0 18px;font-weight:700;letter-spacing:-.035em}
h2{font-size:clamp(23px,3vw,30px);line-height:1.25;margin:44px 0 12px;font-weight:700;letter-spacing:-.02em}
.kicker{font:600 12px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.lead{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin:0 0 26px}
.lesson-head{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.breadcrumb{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-bottom:20px;font:14px/1.45 var(--ui);color:var(--muted)}
.breadcrumb a,.jump-link{color:var(--accent);text-underline-offset:3px}
.lesson-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font:14px/1.5 var(--ui);color:var(--muted)}
.lesson-head .lead{margin-bottom:14px}
.lesson-head a,.hero-actions a{min-height:44px;display:inline-flex;align-items:center}

/* compare panes */
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:8px 0 10px}
.pane{min-width:0;display:flex;flex-direction:column}
.pane + .pane{border-left:1px solid var(--line)}
.pane-head{font:650 13px/1.5 var(--ui);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pane-head::before{content:"";width:10px;height:10px;border-radius:2px}
.pane.ts .pane-head::before{background:var(--ts)}
.pane.py .pane-head::before{background:var(--py)}
.pane.ts .pane-head{background:var(--ts-soft);color:var(--ts)}
.pane.py .pane-head{background:var(--py-soft);color:var(--py-ink)}
.pane pre{flex:1}
pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;background:var(--code-bg);color:var(--ink);tab-size:4}
.pane pre{background:transparent}
.run{font-size:14px;color:var(--muted);margin:0 0 6px}

/* points */
.points{padding-left:1.2em;max-width:68ch}
.points li{margin:0 0 9px}

/* figure */
.figure{margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:18px}
.figure-scroll{overflow-x:auto}
.figure svg{display:block;width:100%;min-width:480px;height:auto}
.figure figcaption{font-size:15px;color:var(--muted);margin-top:12px;max-width:68ch}
.svg text{fill:var(--ink);font-family:var(--serif);font-size:15px}
.svg .mono{font-family:var(--mono);font-size:14px}
.svg .mono-s{font-family:var(--mono);font-size:12.5px}
.svg .mono-l{font-family:var(--mono);font-size:18px}
.svg .muted{fill:var(--muted)}
.svg .small{font-size:13px}
.svg .bold{font-weight:700}
.svg .ts-ink{fill:var(--ts);font-weight:700}
.svg .py-ink{fill:var(--py-ink);font-weight:700}
.svg .ok-ink{fill:var(--ok)}
.svg .warn-ink{fill:var(--warn)}
.svg .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.svg .box-ts{fill:var(--ts-soft);stroke:var(--ts);stroke-width:1.5}
.svg .box-py{fill:var(--py-soft);stroke:var(--py);stroke-width:1.5}
.svg .box-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
.svg .box-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.svg .dash{fill:none;stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.svg .rule{stroke:var(--line);stroke-width:1.5;fill:none}
.svg .arrow{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#ah)}
.svg .arrow-warn{stroke:var(--warn);stroke-width:1.6;fill:none;marker-end:url(#ahw)}
.svg .ah{fill:var(--muted)}
.svg .ahw{fill:var(--warn)}
.svg .bar-ts{stroke:var(--ts);stroke-width:4}
.svg .bar-py{stroke:var(--py);stroke-width:4}
.svg .bar-ok{stroke:var(--ok);stroke-width:4}
.svg .venn-a{fill:var(--ts-soft);stroke:var(--ts);stroke-width:1.5;fill-opacity:.8}
.svg .venn-b{fill:var(--py-soft);stroke:var(--py);stroke-width:1.5;fill-opacity:.8}

/* dictionary table */
.dict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-family:var(--mono);font-size:14px}
.dict > span{padding:8px 14px;border-top:1px solid var(--line)}
.dict > span:nth-child(odd){border-right:1px solid var(--line)}
.dict > .h{font-family:var(--serif);font-weight:600;font-size:14px;border-top:0}
.dict > .h.t{box-shadow:inset 0 3px 0 var(--ts)}
.dict > .h.p{box-shadow:inset 0 3px 0 var(--py)}

/* truth table */
.truth{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface)}
.truth th,.truth td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.truth th{font-weight:600}
.truth td:first-child{font-family:var(--mono);font-size:14px}
.truth .f{color:var(--warn)} .truth .t{color:var(--ok)}
.truth tr.diff{background:var(--py-soft)}
.truth.plain td:first-child{font-family:inherit;font-size:15px}

/* anatomy */
.anatomy{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;font-size:15px}
.anatomy > div{padding:7px 10px;border-bottom:1px solid var(--line)}
.anatomy .c{font-family:var(--mono);font-size:13.5px;white-space:pre;overflow-x:auto;background:var(--code-bg)}
.anatomy .l{color:var(--muted)}

.tree{background:var(--code-bg);border-radius:8px;font-size:13.5px}
.tree .cm{color:var(--muted)}

/* trap */
.trap{margin:28px 0 0;padding:14px 18px;border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;max-width:72ch}
.trap strong{display:block;color:var(--warn);font-size:15px;margin-bottom:4px}
.trap p{margin:0}

/* tasks */
.tasks{list-style:none;counter-reset:task;padding:0;margin:0;max-width:760px}
.task{counter-increment:task;position:relative;padding:16px 18px 14px 56px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
.task::before{content:counter(task);position:absolute;left:16px;top:15px;width:26px;height:26px;border-radius:50%;background:var(--py-soft);color:var(--py-ink);font-weight:700;font-size:14px;display:grid;place-items:center;border:1px solid var(--py)}
.task.is-done{border-color:var(--ok)}
.task.is-done::before{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);content:"✓"}
.task-text{margin:0 0 8px}
.task details{margin:6px 0}
.task summary{cursor:pointer;font:600 14px/1.5 var(--ui);color:var(--accent);width:fit-content}
.task summary:hover,.jump-link:hover,.breadcrumb a:hover{text-decoration-thickness:2px}
.task details[open] summary{margin-bottom:6px}
.task details p{margin:0;font-size:15px}
.task pre{border-radius:6px;font-size:13px}
.done{display:inline-flex;align-items:center;gap:8px;font:14px/1.5 var(--ui);margin-top:6px;cursor:pointer}
.done input{width:18px;height:18px;accent-color:var(--ok)}

/* lesson footer */
.lesson-foot{margin-top:48px;border-top:1px solid var(--line)}
.lesson-finish{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:18px}
.lesson-finish p{margin:0;font:14px/1.5 var(--ui);color:var(--muted)}
.lesson-finish strong{display:block;margin-bottom:2px;color:var(--ink);font-size:16px}
.btn{font:650 15px/1.4 var(--ui);min-height:44px;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{box-shadow:0 0 0 3px var(--line)}
.btn-complete{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.btn-complete:hover,.btn-complete[aria-pressed="true"]{background:var(--accent-soft)}
.btn-complete[aria-pressed="true"]::before{content:"✓";margin-right:7px}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pager a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--ink);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager .next{border-color:var(--accent);background:var(--accent-soft)}
.pager small{display:block;font:600 11px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}

/* home */
.hero{padding-block:clamp(12px,4cqw,38px) 28px;border-top:2px solid var(--accent);border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,8cqw,72px);max-width:17ch;margin-bottom:18px}
.hero h1 em{color:var(--accent);font-weight:600}
.hero-actions{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.hero-note{margin:9px 0 0;color:var(--muted);font:14px/1.5 var(--ui)}
.hero-preview{margin:26px 0 0}
.hero-preview figcaption{font:600 12px/1.5 var(--mono);letter-spacing:.07em;color:var(--accent);text-transform:uppercase}
.section-intro{margin:0 0 18px;color:var(--muted);max-width:65ch}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.map section{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px}
.map section:target{border-color:var(--accent)}
.map h3{font-size:20px;line-height:1.25;margin:4px 0 8px}
.map p{margin:0 0 10px;font-size:15px;color:var(--muted)}
.map .module-meta{font:600 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.map ol{list-style:none;margin:0;padding:0}
.map li a{display:flex;gap:8px;align-items:center;min-height:44px;padding:6px 0;text-decoration:none;color:var(--ink);font:14px/1.4 var(--ui);border-top:1px solid var(--line)}
.map li a:hover{color:var(--accent);text-decoration:underline}
.map .num{min-width:22px}
.map .check{margin-left:auto;color:var(--ok)}
.map .next-up{margin-left:auto;color:var(--accent);font:600 11px/1.25 var(--ui);text-align:right}
.home-guide{border-top:1px solid var(--line);margin-top:32px}
.home-guide h2{margin-top:24px}

@container (max-width:720px){
  .compare,.map{grid-template-columns:minmax(0,1fr)}
  .pane + .pane{border-left:0;border-top:1px solid var(--line)}
}
@container (max-width:560px){
  .anatomy{grid-template-columns:minmax(0,1fr)}
  .anatomy .l{padding-bottom:12px}
  .anatomy .c{border-bottom:0}
}
@container (max-width:440px){
  .figure,.trap{padding:12px}
  pre{padding:10px 12px}
  .dict > span,.truth th,.truth td{padding:6px 8px}
  .task{padding:12px 12px 12px 44px}
  .task::before{left:10px;top:12px}
  .lesson-finish,.pager{display:grid;grid-template-columns:minmax(0,1fr)}
}

/* prism tokens */
.token.comment,.token.prolog{color:var(--muted);font-style:italic}
.token.keyword,.token.important{color:var(--kw)}
.token.string,.token.template-string,.token.char{color:var(--str)}

<template class="lesson" data-n="01" data-section="1" data-title="Hello, Python" data-summary="Run your first script and see how Python’s syntax differs from TypeScript at a glance.">
  <p class="lead">Python runs a file from top to bottom, like a Node script. There’s no build step, no semicolons and no braces: indentation defines blocks.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">// hello.ts  (run: npx tsx hello.ts)
const name = "Ada";
console.log(`Hello, ${name}!`);

if (name.length &gt; 2) {
  console.log("long name");
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python"># hello.py  (run: uv run hello.py)
name = "Ada"
print(f"Hello, {name}!")

if len(name) &gt; 2:
    print("long name")</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>print()</code> is your <code>console.log()</code>, and comments start with <code>#</code>.</li>
    <li>A colon opens a block and the indented lines below it are the block. The standard is 4 spaces.</li>
    <li>Strings with an <code>f</code> prefix are template literals: <code>f"Hello, {name}"</code>.</li>
    <li>Type <code>python3</code> in a terminal for an interactive prompt (the REPL), just like typing <code>node</code>. Exit with <code>exit()</code>.</li>
    <li>For real projects, install <a href="https://docs.astral.sh/uv/">uv</a>: <code>uv init my-app</code> is your <code>npm init</code>, and <code>uv run hello.py</code> runs a file.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 560 200" role="img" aria-label="Braces mark a block in TypeScript; a colon and indentation mark it in Python">
      <rect class="box-ts" x="8" y="20" width="262" height="130" rx="8"/>
      <text class="mono" x="24" y="52">if (count &gt; 0) <tspan class="ts-ink">{</tspan></text>
      <text class="mono" x="44" y="80">console.log(count);</text>
      <text class="mono" x="44" y="108">count--;</text>
      <text class="mono" x="24" y="136"><tspan class="ts-ink">}</tspan></text>
      <rect class="box" x="290" y="20" width="262" height="130" rx="8"/>
      <rect class="box-py" x="302" y="62" width="26" height="54" rx="4"/>
      <text class="mono" x="306" y="52">if count &gt; 0<tspan class="py-ink">:</tspan></text>
      <text class="mono" x="338" y="80">print(count)</text>
      <text class="mono" x="338" y="108">count -= 1</text>
      <text class="mono" x="306" y="136">print("done")</text>
      <text x="139" y="182" text-anchor="middle" class="muted small">Braces mark the block</text>
      <text x="421" y="182" text-anchor="middle" class="muted small">Colon + indentation mark the block</text>
    </svg></div>
    <figcaption>The yellow strip is the block. <code>print("done")</code> sits outside it because it’s back at the left edge.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Wrong indentation isn’t a style warning, it’s an <code>IndentationError</code> or a silent logic change. Let your editor insert 4 spaces and never mix tabs and spaces.</p></aside>
  <h2>Read the indentation</h2>
  <p>In TypeScript, braces tell you where a block ends. In Python, look for the next line that moves back to the left. Here, only the first <code>print()</code> belongs to the <code>if</code>:</p>
  <pre><code class="language-python">name = "Ada"
if name == "Ada":
    print(f"Hello, {name}!")
print("Ready.")</code></pre>
  <p>Save this as <code>hello.py</code> and run <code>uv run hello.py</code>. Change the name to <code>"Grace"</code> and rerun it: you’ll still see <code>Ready.</code> To try one expression at a time, run <code>uv run python</code> and type it at the <code>&gt;&gt;&gt;</code> prompt. The REPL shows expression results; in a file, use <code>print()</code> to show them.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="01-1"><p class="task-text">Create <code>me.py</code> that prints your name on one line and your favorite language on the next. Run it with <code>uv run me.py</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">print("Ada")
print("TypeScript")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="01-2"><p class="task-text">Store a city and a year in variables and print “I’ve lived in Lisbon since 2019” using an f-string.</p>
      <details><summary>Hint</summary><p>Put the variable names inside <code>{}</code> in a string that starts with <code>f</code>.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">city = "Lisbon"
year = 2019
print(f"I've lived in {city} since {year}")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="01-3" data-manual><p class="task-text">Open the REPL and evaluate <code>2 ** 10</code>, <code>7 / 2</code> and <code>7 // 2</code>. Write down what each one does.</p>
      <details><summary>Solution</summary><pre><code class="language-python">&gt;&gt;&gt; 2 ** 10   # 1024: power, like Math.pow or **
&gt;&gt;&gt; 7 / 2     # 3.5: division always returns a float
&gt;&gt;&gt; 7 // 2    # 3: floor division, like Math.floor(7 / 2)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="02" data-section="1" data-title="Variables and types" data-summary="Names, numeric types, explicit conversion, and what type hints do.">
  <p class="lead">You assign with <code>=</code> and that’s it. Type hints look almost like TypeScript annotations, but Python doesn’t check them when it runs.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">let count: number = 3;
const price = 9.99;
const title: string = "Report";
let done = false;
const nothing = null;
const total = count * price;</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">count: int = 3
price = 9.99
title: str = "Report"
done = False
nothing = None
total = count * price</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>No <code>let</code> or <code>const</code>. Constants are a naming convention, <code>MAX_SIZE = 10</code>, and nothing stops you reassigning them.</li>
    <li><code>number</code> splits into <code>int</code> (whole numbers of any size, no overflow) and <code>float</code>. Write big numbers as <code>1_000_000</code>.</li>
    <li>Floats behave like JavaScript numbers: <code>0.1 + 0.2</code> is <code>0.30000000000000004</code>. For money, use <code>decimal.Decimal("0.10")</code>. And <code>round()</code> rounds halves to the nearest even number: <code>round(2.5)</code> is <code>2</code>, while <code>Math.round(2.5)</code> is 3.</li>
    <li>Booleans are <code>True</code> and <code>False</code>, capitalized. Logic uses words: <code>and</code>, <code>or</code>, <code>not</code>.</li>
    <li>Python won’t mix strings and numbers in arithmetic. Convert explicitly with <code>int("3")</code>, <code>str(3)</code> or <code>float("2.5")</code>. Compatible numeric types can still mix: <code>3 + 0.5</code> produces the float <code>3.5</code>.</li>
    <li>Type hints are optional and ignored at runtime. A type checker (lesson 5.3) reads them, like <code>tsc</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure">
    <div class="dict" role="table" aria-label="TypeScript types and their Python equivalents">
      <span class="h t">TypeScript</span><span class="h p">Python</span>
      <span>number</span><span>int, float</span>
      <span>string</span><span>str</span>
      <span>boolean (true / false)</span><span>bool (True / False)</span>
      <span>null, undefined</span><span>None</span>
      <span>string[]</span><span>list[str]</span>
      <span>[string, number]</span><span>tuple[str, int]</span>
      <span>Record&lt;string, number&gt;</span><span>dict[str, int]</span>
      <span>Set&lt;number&gt;</span><span>set[int]</span>
      <span>string | null</span><span>str | None</span>
      <span>any</span><span>Any (from typing)</span>
    </div>
    <figcaption>Keep this table open for the first few weeks. Generic types use square brackets instead of angle brackets.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>In JavaScript <code>"3" + 3</code> gives <code>"33"</code>. In Python it raises <code>TypeError</code>. That error is your friend: it catches bugs that JavaScript hides.</p></aside>
  <h2>Convert input explicitly</h2>
  <p>Text from an input field or environment variable starts out as a string. An annotation tells the checker what to expect; it doesn’t parse the text. Use <code>int()</code> when you expect whole numbers.</p>
  <pre><code class="language-python">raw = "7"
minutes: int = int(raw)
print(minutes / 2)   # 3.5 (division returns a float)
print(minutes // 2)  # 3 (floor division rounds down)
print(minutes % 2)   # 1 (remainder)
print(-minutes // 2) # -4 (down, not toward zero)</code></pre>
  <p>Unlike JavaScript’s <code>parseInt("7min", 10)</code>, <code>int("7min")</code> doesn’t accept a numeric prefix; it raises <code>ValueError</code>. If such input is expected, handle it where you parse it (see <a href="#lesson-18">Lesson 4.5 on exceptions</a>).</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="02-1"><p class="task-text">Create variables for a product name, a price and a quantity. Print the total with exactly two decimals.</p>
      <details><summary>Hint</summary><p>Inside an f-string, <code>{value:.2f}</code> formats a float with two decimals.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">name = "Desk lamp"
price = 24.5
quantity = 3
total = price * quantity
print(f"{name}: {total:.2f}")  # Desk lamp: 73.50</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="02-2"><p class="task-text">Convert the string <code>"42"</code> to an int, add 8 and print the result. Then try <code>"42" + 8</code> and read the error message.</p>
      <details><summary>Solution</summary><pre><code class="language-python">print(int("42") + 8)  # 50
print("42" + 8)       # TypeError: can only concatenate str (not "int") to str</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="02-3"><p class="task-text">Convert 135 minutes into the text “2 h 15 min” using <code>//</code> and <code>%</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">minutes = 135
print(f"{minutes // 60} h {minutes % 60} min")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="03" data-section="1" data-title="Functions" data-summary="def, keyword arguments, *args and **kwargs: Python’s answer to options objects and rest parameters.">
  <p class="lead">Functions use <code>def</code>, a colon and an indented body. The big upgrade over TypeScript is that every parameter can be passed by name.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">function greet(name: string, greeting = "Hello"): string {
  return `${greeting}, ${name}`;
}

const total = (...nums: number[]) =&gt;
  nums.reduce((a, b) =&gt; a + b, 0);

greet("Ada");
greet("Ada", "Hi");
total(1, 2, 3);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">def greet(name: str, greeting: str = "Hello") -&gt; str:
    return f"{greeting}, {name}"


def total(*nums: float) -&gt; float:
    return sum(nums)


greet("Ada")
greet("Ada", greeting="Hi")
total(1, 2, 3)</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>The return type goes after <code>-&gt;</code>. A function with no <code>return</code> returns <code>None</code>.</li>
    <li>Keyword arguments, <code>greet(name="Ada")</code>, replace the “options object” pattern you use in TS.</li>
    <li><code>*args</code> collects extra positional arguments into a tuple (rest parameters). <code>**kwargs</code> collects extra keyword arguments into a dict.</li>
    <li>Spread works too: <code>total(*[1, 2, 3])</code> and <code>greet(**{"name": "Ada"})</code>.</li>
    <li>A <code>lambda</code> is a one-expression function, useful inline as a callback (see <a href="#lesson-25">Lesson 7.1</a>). Use <code>def</code> for a named function.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 220" role="img" aria-label="How call arguments bind to name, age, *args and **kwargs">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <text class="mono" x="14" y="34">describe("Ada", 36, "x", "y", city="Paris", role="dev")</text>
      <path class="arrow" d="M100,44 L75,116"/>
      <path class="arrow" d="M150,44 L200,116"/>
      <path class="arrow" d="M215,44 L330,116"/>
      <path class="arrow" d="M370,44 L500,116"/>
      <rect class="box" x="15" y="120" width="120" height="80" rx="8"/>
      <text class="mono-s muted" x="27" y="144">name</text><text class="mono" x="27" y="174">"Ada"</text>
      <rect class="box" x="145" y="120" width="110" height="80" rx="8"/>
      <text class="mono-s muted" x="157" y="144">age</text><text class="mono" x="157" y="174">36</text>
      <rect class="box-py" x="265" y="120" width="145" height="80" rx="8"/>
      <text class="mono-s muted" x="277" y="144">*args (tuple)</text><text class="mono" x="277" y="174">("x", "y")</text>
      <rect class="box-py" x="420" y="120" width="170" height="80" rx="8"/>
      <text class="mono-s muted" x="432" y="144">**kwargs (dict)</text><text class="mono-s" x="432" y="168">{"city": "Paris",</text><text class="mono-s" x="440" y="186">"role": "dev"}</text>
    </svg></div>
    <figcaption>For <code>def describe(name, age, *args, **kwargs)</code>: positional values fill named parameters first, leftovers go to <code>args</code>, and named extras go to <code>kwargs</code>.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Function declarations aren’t hoisted. Calling a function on a line above its <code>def</code> at module level raises <code>NameError</code>, because the <code>def</code> hasn’t run yet.</p></aside>
  <h2>Make options keyword-only</h2>
  <p>Use a bare <code>*</code> to require names for the parameters that follow it. This gives you the readability of a TypeScript options object without creating a separate object at every call site.</p>
  <pre><code class="language-python">def greet(name: str, *, punctuation: str = "!") -&gt; str:
    return f"Hello, {name}{punctuation}"


print(greet("Ada"))                   # Hello, Ada!
print(greet("Ada", punctuation="?"))  # Hello, Ada?
print(greet("Ada", **{"punctuation": "."}))  # Hello, Ada.</code></pre>
  <p><code>greet("Ada", "?")</code> raises <code>TypeError</code> because the second argument must be named. In a definition, <code>**kwargs</code> <em>collects</em> keyword arguments. In a call, <code>**options</code> <em>unpacks</em> a mapping; its keys must be strings and can’t duplicate arguments you already supplied.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="03-1"><p class="task-text">Write <code>area(width, height=1)</code> and call it once positionally and once with keyword arguments in reverse order.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def area(width: float, height: float = 1) -&gt; float:
    return width * height

print(area(3, 4))                # 12
print(area(height=4, width=3))   # 12</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="03-2"><p class="task-text">Write <code>average(*nums)</code> that returns the average, or 0 when called with no arguments.</p>
      <details><summary>Hint</summary><p><code>nums</code> is a tuple. An empty tuple is falsy, and <code>len()</code> gives its length.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">def average(*nums: float) -&gt; float:
    if not nums:
        return 0
    return sum(nums) / len(nums)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="03-3"><p class="task-text">Write <code>make_tag(tag, text, **attrs)</code> so that <code>make_tag("a", "Home", href="/")</code> returns <code>&lt;a href="/"&gt;Home&lt;/a&gt;</code>.</p>
      <details><summary>Hint</summary><p>Loop over <code>attrs.items()</code> to build each <code>key="value"</code> pair, then join them with spaces.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">def make_tag(tag: str, text: str, **attrs: str) -&gt; str:
    attr_text = "".join(f' {key}="{value}"' for key, value in attrs.items())
    return f"&lt;{tag}{attr_text}&gt;{text}&lt;/{tag}&gt;"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="04" data-section="1" data-title="Control flow" data-summary="if/elif/else, for over anything iterable, range() instead of C-style loops.">
  <p class="lead">Conditions and loops read almost like English. There’s no C-style <code>for (let i = 0; …)</code>: you loop over things, and <code>range()</code> gives you numbers when you need them.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">for (const item of items) {
  if (item.price &gt; 100) {
    console.log("expensive");
  } else if (item.price &gt; 10) {
    console.log("normal");
  } else {
    console.log("cheap");
  }
}

for (let i = 0; i &lt; 3; i++) console.log(i);
const label = n &gt; 10 ? "big" : "small";</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">for item in items:
    if item["price"] &gt; 100:
        print("expensive")
    elif item["price"] &gt; 10:
        print("normal")
    else:
        print("cheap")


for i in range(3):
    print(i)
label = "big" if n &gt; 10 else "small"</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>for x in something</code> is <code>for…of</code>, and it works on lists, strings, dicts, files and more.</li>
    <li><code>range(stop)</code>, <code>range(start, stop)</code> and <code>range(start, stop, step)</code> produce numbers. The stop value is never included.</li>
    <li>Need the index too? <code>for i, item in enumerate(items):</code>.</li>
    <li>Walk two lists in step with <code>zip</code>, which JavaScript doesn’t have: <code>for name, score in zip(names, scores):</code>. It stops at the shorter list, unless you pass <code>strict=True</code> to get an error when the lengths differ.</li>
    <li>The ternary reads in a different order: <code>value_if_true if condition else value_if_false</code>.</li>
    <li>Comparisons chain: <code>0 &lt; x &lt; 10</code> works as you’d read it. <code>while</code>, <code>break</code> and <code>continue</code> behave like in TS.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 150" role="img" aria-label="range(2, 10, 3) produces 2, 5 and 8; 10 is not included">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>

        <text x="30" y="118" text-anchor="middle">0</text><text x="75" y="118" text-anchor="middle">1</text><text x="165" y="118" text-anchor="middle">3</text><text x="210" y="118" text-anchor="middle">4</text><text x="300" y="118" text-anchor="middle">6</text><text x="345" y="118" text-anchor="middle">7</text><text x="435" y="118" text-anchor="middle">9</text><text x="525" y="118" text-anchor="middle">11</text>
      </g>
      <circle class="box-py" cx="120" cy="80" r="15"/><text class="mono bold" x="120" y="85" text-anchor="middle">2</text>
      <circle class="box-py" cx="255" cy="80" r="15"/><text class="mono bold" x="255" y="85" text-anchor="middle">5</text>

    </svg></div>
    <figcaption><code>list(range(2, 10, 3))</code> is <code>[2, 5, 8]</code>. The next step would be 11, and 10 itself is never produced.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>There’s no <code>++</code> or <code>--</code>. Write <code>i += 1</code>. And <code>&amp;&amp;</code>, <code>||</code>, <code>!</code> are a syntax error: use <code>and</code>, <code>or</code>, <code>not</code>.</p></aside>
  <h2>Choose what to loop over</h2>
  <p>Loop directly over values when you only need the values. Use <code>enumerate()</code> when you need a position too, or <code>zip()</code> when pairing two inputs. Reach for <code>range()</code> when the numbers themselves matter, not just to index a list.</p>
  <pre><code class="language-python">names = ["Ada", "Grace"]
scores = [8, 10]

for rank, (name, score) in enumerate(zip(names, scores, strict=True), start=1):
    print(f"{rank}. {name}: {score}")

print(list(range(3, 0, -1)))  # [3, 2, 1]</code></pre>
  <p><code>zip()</code> supplies a pair; <code>enumerate()</code> adds the rank. The parentheses in the loop unpack that pair. Try deleting the last score: the first pair still prints, then iteration raises <code>ValueError</code>. Use <code>strict=True</code> when dropping an unpaired value would hide a bug.</p>
  <h2>Practice</h2>

<template class="lesson" data-n="05" data-section="2" data-title="Names and objects" data-summary="Variables are labels on objects. Assignment never copies anything.">
  <p class="lead">In Python every value is an object, and a variable is just a name that points to one. You already know this model from JavaScript objects and arrays; Python applies it to everything.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const a = { tags: ["x"] };
const b = a;              // same object
b.tags.push("y");
console.log(a.tags);      // ["x", "y"]
console.log(a === b);     // true</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">a = {"tags": ["x"]}
b = a                     # same object
b["tags"].append("y")
print(a["tags"])          # ['x', 'y']
print(a is b)             # True</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Assignment adds another name to the same object. Nothing is copied, ever, unless you ask for a copy.</li>
    <li><code>a is b</code> asks “same object?”, like <code>===</code> on objects. <code>id(a)</code> shows an object’s identity number.</li>
    <li>Function arguments are passed the same way: the function receives a name for your object. It can change the object, but reassigning its parameter doesn’t affect your variable.</li>
    <li>Numbers and strings are objects too, but they can’t be changed (lesson 2.2), so sharing them is always safe.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 560 190" role="img" aria-label="Names a and b both point to the same dict object, which points to a list">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-ts" x="20" y="40" width="64" height="40" rx="6"/><text class="mono bold" x="52" y="65" text-anchor="middle">a</text>
      <rect class="box-ts" x="20" y="110" width="64" height="40" rx="6"/><text class="mono bold" x="52" y="135" text-anchor="middle">b</text>
      <path class="arrow" d="M84,60 L206,82"/>
      <path class="arrow" d="M84,130 L206,108"/>
      <rect class="box-py" x="210" y="50" width="150" height="90" rx="8"/>
      <text class="mono-s muted" x="224" y="72">dict object</text>
      <text class="mono" x="224" y="104">"tags":</text>
      <path class="arrow" d="M290,99 L396,99"/>
      <rect class="box-py" x="400" y="72" width="140" height="54" rx="8"/>
      <text class="mono-s muted" x="412" y="92">list object</text>
      <text class="mono" x="412" y="114">["x", "y"]</text>
      <text class="small muted" x="20" y="180">Names</text><text class="small muted" x="210" y="180">Objects</text>
    </svg></div>
    <figcaption>Two names, one dict. Changing the list through <code>b</code> changes what <code>a</code> sees, because there’s only one list.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>For lists, <code>x += [1]</code> changes the existing list in place, but <code>x = x + [1]</code> builds a new list and rebinds <code>x</code>. Other names pointing to the old list see the first change, not the second.</p></aside>
  <h2>Follow an object through a call</h2>
  <p>A parameter is a local name for the object passed by the caller. That’s why a method can change the caller’s list, but an assignment to the parameter can’t replace it.</p>
  <pre><code class="language-python">def add_and_rebind(tags: list[str]) -&gt; list[str]:
    tags.append("python")
    tags = ["typescript"]
    return tags


original = ["web"]
result = add_and_rebind(original)
print(original)  # ['web', 'python']
print(result)    # ['typescript']</code></pre>
  <p>Use a return value when callers should decide whether to replace their data. If a function promises not to mutate its inputs, build a new result rather than appending to the input.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="05-1" data-manual><p class="task-text">Predict the output, then run it:</p><pre><code class="language-python">def add_item(cart, item):
    cart.append(item)

cart = []
add_item(cart, "apple")
print(cart)</code></pre>
      <details><summary>Solution</summary><p><code>['apple']</code>. The function received a name for the same list and changed it.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="05-2" data-manual><p class="task-text">Predict the output, then run it:</p><pre><code class="language-python">def reset(cart):
    cart = []

cart = ["apple"]
reset(cart)
print(cart)</code></pre>
      <details><summary>Solution</summary><p><code>['apple']</code>. Inside <code>reset</code>, the local name <code>cart</code> is pointed at a new empty list; the caller’s list is untouched. To empty it in place, use <code>cart.clear()</code>.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="05-3"><p class="task-text">Create <code>x = [1, 2]</code> and <code>y = [1, 2]</code>. Compare them with <code>==</code> and <code>is</code> and explain the results.</p>
      <details><summary>Solution</summary><pre><code class="language-python">x = [1, 2]
y = [1, 2]
print(x == y)  # True: same contents
print(x is y)  # False: two different list objects</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="06" data-section="2" data-title="Mutable and immutable" data-summary="Which values can change, and how shallow and deep copies work.">
  <p class="lead">Some objects can be changed after creation (lists, dicts, sets) and some can’t (numbers, strings, tuples). Knowing which is which explains most surprising Python behavior.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const original = { title: "Draft", tags: ["a"] };
const shallow = { ...original };
const deep = structuredClone(original);

const items = [1, 2, 3];
const copy = [...items];</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">import copy

original = {"title": "Draft", "tags": ["a"]}
shallow = original.copy()       # or {**original}
deep = copy.deepcopy(original)

items = [1, 2, 3]
items_copy = items[:]           # or list(items)</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Mutable: <code>list</code>, <code>dict</code>, <code>set</code> and most objects you create. Immutable: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, <code>tuple</code>, <code>None</code>.</li>
    <li>“Changing” an immutable value creates a new one: <code>name.upper()</code> returns a new string and leaves <code>name</code> alone.</li>
    <li>A shallow copy duplicates only the outer container; nested lists and dicts are still shared. <code>copy.deepcopy()</code> recursively copies nested containers.</li>
    <li>A tuple has fixed slots, like <code>readonly [string, number]</code>, but an object inside it can still be mutable. A tuple can be a dict key only if every element is hashable; a tuple containing a list can’t.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 620 250" role="img" aria-label="A shallow copy shares the nested list with the original; a deep copy has its own">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <text class="small muted" x="20" y="22">original</text>
      <text class="small muted" x="220" y="22">shallow copy</text>
      <text class="small muted" x="420" y="22">deep copy</text>
      <rect class="box" x="20" y="32" width="180" height="70" rx="8"/><text class="mono-s" x="32" y="60">"title": "Draft"</text><text class="mono-s" x="32" y="86">"tags": ●</text>
      <rect class="box" x="220" y="32" width="180" height="70" rx="8"/><text class="mono-s" x="232" y="60">"title": "Draft"</text><text class="mono-s" x="232" y="86">"tags": ●</text>
      <rect class="box" x="420" y="32" width="180" height="70" rx="8"/><text class="mono-s" x="432" y="60">"title": "Draft"</text><text class="mono-s" x="432" y="86">"tags": ●</text>
      <path class="arrow" d="M100,90 L190,168"/>
      <path class="arrow" d="M300,90 L250,168"/>
      <path class="arrow" d="M500,90 L505,168"/>
      <rect class="box-warn" x="140" y="172" width="170" height="50" rx="8"/><text class="mono" x="155" y="202">["a"]</text><text class="small warn-ink" x="210" y="202">shared</text>
      <rect class="box-ok" x="430" y="172" width="170" height="50" rx="8"/><text class="mono" x="445" y="202">["a"]</text><text class="small ok-ink" x="500" y="202">its own</text>
    </svg></div>
    <figcaption>Appending to <code>shallow["tags"]</code> also changes <code>original["tags"]</code>. The deep copy is fully independent.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Strings look like arrays but are immutable: <code>name[0] = "X"</code> raises <code>TypeError</code>. Build a new string instead: <code>"X" + name[1:]</code>.</p></aside>
  <h2>Choose what to copy</h2>
  <p><code>dict.copy()</code> is like TypeScript’s <code>{...obj}</code>: changing a top-level entry affects only the copy, but mutating a nested list affects both. Compare it with a deep copy:</p>
  <pre><code class="language-python">from copy import deepcopy

original = {"tags": ["web"]}
shallow = original.copy()
deep = deepcopy(original)

shallow["tags"].append("python")
print(original["tags"])  # ['web', 'python']
print(deep["tags"])      # ['web']</code></pre>
  <p>If you only plan to edit one nested list, copy that list and keep the rest. Use a deep copy when you need independent nested data and copying the entire structure is appropriate.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="06-1"><p class="task-text">Make a shallow copy of <code>{"title": "Draft", "tags": ["a"]}</code>, append <code>"b"</code> to the copy’s tags, and print the original. Explain what you see.</p>
      <details><summary>Solution</summary><pre><code class="language-python">original = {"title": "Draft", "tags": ["a"]}
shallow = original.copy()
shallow["tags"].append("b")
print(original)  # {'title': 'Draft', 'tags': ['a', 'b']}  the list is shared</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="06-2"><p class="task-text">Repeat the task with <code>copy.deepcopy</code> and confirm the original no longer changes.</p>
      <details><summary>Solution</summary><pre><code class="language-python">import copy

original = {"title": "Draft", "tags": ["a"]}
deep = copy.deepcopy(original)
deep["tags"].append("b")
print(original)  # {'title': 'Draft', 'tags': ['a']}</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="06-3"><p class="task-text">Try to use <code>(1, 2)</code> and then <code>[1, 2]</code> as a key in a dict. Which one fails, and why?</p>
      <details><summary>Solution</summary><pre><code class="language-python">grid = {}
grid[(1, 2)] = "tree"   # works: tuples are immutable, so they're hashable
grid[[1, 2]] = "rock"   # TypeError: unhashable type: 'list'</code></pre></details>

  </ol>
</template>

<template class="lesson" data-n="07" data-section="2" data-title="Truthiness, None and equality" data-summary="Empty containers are falsy, there’s no undefined, and == never coerces.">
  <p class="lead">Python’s rules for “truthy”, “nothing” and “equal” are simpler than JavaScript’s, but a couple of them are the opposite of what your TS instincts expect.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">if (items.length &gt; 0) { /* ... */ }
if (user == null) { /* ... */ }
const port = config.port ?? 8080;
a === b;</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">if items:                       # non-empty
    ...
if user is None:
    ...
port = config.get("port", 8080)
a == b</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Falsy values: <code>False</code>, <code>None</code>, <code>0</code>, <code>0.0</code>, <code>""</code>, and every empty container: <code>[]</code>, <code>{}</code>, <code>set()</code>, <code>()</code>. Everything else is truthy.</li>
    <li><code>None</code> is the only “nothing”. There’s no <code>undefined</code>: a missing variable raises <code>NameError</code>, a missing dict key <code>KeyError</code>, a missing attribute <code>AttributeError</code>.</li>
    <li><code>==</code> compares values and never coerces: <code>1 == "1"</code> is <code>False</code>. There’s no <code>===</code>.</li>
    <li><code>is</code> compares identity. Use it for <code>None</code>: <code>if x is None</code>.</li>
    <li><code>x or default</code> works like <code>x || default</code>. There’s no <code>??</code>; write <code>x if x is not None else default</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Value</th><th>JavaScript</th><th>Python</th></tr></thead>
      <tbody>
        <tr><td>0</td><td class="f">falsy</td><td class="f">falsy</td></tr>
        <tr><td>""</td><td class="f">falsy</td><td class="f">falsy</td></tr>
        <tr><td>null / None</td><td class="f">falsy</td><td class="f">falsy</td></tr>
        <tr class="diff"><td>[]</td><td class="t">truthy</td><td class="f">falsy</td></tr>
        <tr class="diff"><td>{}</td><td class="t">truthy</td><td class="f">falsy</td></tr>
        <tr class="diff"><td>NaN / float("nan")</td><td class="f">falsy</td><td class="t">truthy</td></tr>
        <tr><td>"0"</td><td class="t">truthy</td><td class="t">truthy</td></tr>
        <tr><td>[0]</td><td class="t">truthy</td><td class="t">truthy</td></tr>
      </tbody>
    </table></div>
    <figcaption>Highlighted rows behave differently in the two languages.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>if items:</code> is false for an empty list. In JavaScript <code>if ([])</code> is true. Python’s version is usually what you meant, so lean on it.</p></aside>
  <h2>Distinguish missing from falsy</h2>
  <p>Both Python’s <code>or</code> and JavaScript’s <code>||</code> return an operand rather than a boolean. Use <code>or</code> if all falsy values should trigger the fallback. Use an identity check if only <code>None</code> should trigger it, as with TypeScript’s <code>??</code>.</p>
  <pre><code class="language-python">retries = 0
print(retries or 3)                          # 3
print(retries if retries is not None else 3) # 0

first = ["Ada"]
second = ["Ada"]
print(first == second)  # True: equal contents
print(first is second)  # False: separate objects</code></pre>
  <p>For a retry setting, <code>0</code> can mean “don’t retry” while <code>None</code> means “use the default.” Use <code>==</code> to compare contents, and save <code>is</code> for identity checks such as <code>value is None</code>.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="07-1"><p class="task-text">Write <code>describe(value)</code> that returns “empty” for falsy values and “has value” otherwise. Try it with <code>0</code>, <code>""</code>, <code>[]</code>, <code>[0]</code> and <code>None</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def describe(value) -&gt; str:
    return "has value" if value else "empty"

for v in [0, "", [], [0], None]:
    print(repr(v), describe(v))</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="07-2"><p class="task-text">Write <code>get_port(config)</code> that returns <code>config["port"]</code> when it exists and isn’t <code>None</code>, otherwise 8080. A port of 0 must be returned as 0.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def get_port(config: dict) -&gt; int:
    port = config.get("port")
    return port if port is not None else 8080

print(get_port({}), get_port({"port": None}), get_port({"port": 0}))  # 8080 8080 0</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="07-3" data-manual><p class="task-text">Explain why <code>0 or 8080</code> returns 8080, and when using <code>or</code> for defaults becomes a bug.</p>
      <details><summary>Solution</summary><p><code>or</code> returns the first truthy operand, and 0 is falsy. It’s a bug whenever a falsy value is valid: a count of 0, an empty string the user typed on purpose, an empty list. Compare with <code>None</code> instead.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="08" data-section="2" data-title="Scope and the mutable default trap" data-summary="Function scope instead of block scope, and the classic bug every Python developer hits once.">
  <p class="lead">Python has function scope, not block scope, and default argument values are created once. Those two facts explain a whole family of bugs.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">function addTag(tag: string, tags: string[] = []) {
  tags.push(tag);
  return tags;
}

addTag("a"); // ["a"]
addTag("b"); // ["b"]</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">def add_tag(tag, tags=[]):        # bug!
    tags.append(tag)
    return tags

add_tag("a")  # ['a']
add_tag("b")  # ['a', 'b']  same list


def add_tag(tag, tags=None):      # fix
    if tags is None:
        tags = []
    tags.append(tag)
    return tags</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Default values are evaluated once, when the <code>def</code> line runs, not on every call. A mutable default is shared by every call. Use <code>None</code> and create the list inside.</li>
    <li><code>if</code> and <code>for</code> do not create scopes. A name assigned inside remains visible afterward, but only if that assignment actually ran.</li>
    <li>Names are looked up in order: Local, Enclosing function, Global (module), Built-in. That’s the LEGB rule.</li>
    <li>Reading an outer variable needs no declaration. Rebinding an outer name from inside a function needs <code>nonlocal</code> (enclosing function) or <code>global</code> (module). Mutating the object through that name doesn’t.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 540 250" role="img" aria-label="Nested scopes: Local inside Enclosing inside Global inside Built-in">
      <rect class="box" x="10" y="10" width="520" height="230" rx="10"/>
      <text class="small muted" x="24" y="32">Built-in: print, len, range, …</text>
      <rect class="box-ts" x="30" y="44" width="480" height="186" rx="10"/>
      <text class="small" x="44" y="66">Global: names defined at the top of the module</text>
      <rect class="box" x="50" y="78" width="440" height="142" rx="10"/>
      <text class="small" x="64" y="100">Enclosing: the outer function, for nested functions</text>
      <rect class="box-py" x="70" y="112" width="400" height="98" rx="10"/>
      <text class="small bold" x="84" y="136">Local: the current function</text>
      <text class="small" x="84" y="164">Python looks here first, then moves outward</text>
      <text class="small" x="84" y="188">one box at a time until it finds the name.</text>
    </svg></div>
    <figcaption>If a name isn’t found in any box, you get a <code>NameError</code>.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Loop variables survive the loop: after <code>for i in range(3):</code>, <code>i</code> is still 2. Don’t reuse the name by accident later in the function.</p></aside>
  <h2>Give each call its own default</h2>
  <p>A Python default is stored when Python defines the function. A JavaScript default parameter expression runs at call time instead. If you want a new list for each call that omits the argument, create it inside the function:</p>
  <pre><code class="language-python">def add_tag(tag: str, tags: list[str] | None = None) -&gt; list[str]:
    if tags is None:
        tags = []
    tags.append(tag)
    return tags


print(add_tag("python"))  # ['python']
print(add_tag("web"))     # ['web']

existing: list[str] = []
add_tag("typescript", existing)
print(existing)  # ['typescript']</code></pre>
  <p><code>is None</code> preserves a caller’s empty list; <code>tags or []</code> would discard it. And if the name should refer to the same list but its contents should change, <code>append()</code> is enough: you aren’t rebinding the name.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="08-1"><p class="task-text">Reproduce the <code>add_tag</code> bug from the example, then fix it with a <code>None</code> default.</p>
      <details><summary>Solution</summary><p>Use the fixed version from the Python pane. Calling it twice without <code>tags</code> now returns <code>['a']</code> and <code>['b']</code>.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="08-2"><p class="task-text">Write <code>make_counter()</code> that returns a function. Each call of that function returns the next number: 1, 2, 3…</p>
      <details><summary>Hint</summary><p>The inner function needs <code>nonlocal</code> to update the outer variable.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">def make_counter():
    count = 0

    def next_number() -&gt; int:
        nonlocal count
        count += 1
        return count

    return next_number

counter = make_counter()
print(counter(), counter(), counter())  # 1 2 3</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="08-3" data-manual><p class="task-text">Predict what happens, then run it:</p><pre><code class="language-python">x = 10

def show():
    print(x)
    x = 5

show()</code></pre>
      <details><summary>Solution</summary><p><code>UnboundLocalError</code>. Because <code>x</code> is assigned somewhere in <code>show</code>, Python treats it as local for the whole function, so the <code>print</code> reads a local that has no value yet.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>
