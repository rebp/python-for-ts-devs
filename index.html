<template class="lesson" data-n="17" data-section="4" data-title="Dicts and sets" data-summary="Key-value maps and unique collections, plus the helpers that save you boilerplate.">
  <p class="lead">A dict is your <code>Record</code> and <code>Map</code> in one, and sets work like <code>Set</code> with real set operators. Dicts keep insertion order, just like JS objects.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const ages: Record&lt;string, number&gt; = { ada: 36 };
ages["linus"] = 54;
const age = ages["grace"] ?? 0;
for (const [name, a] of Object.entries(ages)) {
  console.log(name, a);
}
const merged = { ...defaults, ...overrides };
const unique = new Set([1, 2, 2, 3]);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">ages: dict[str, int] = {"ada": 36}
ages["linus"] = 54
age = ages.get("grace", 0)
for name, a in ages.items():
    print(name, a)

merged = defaults | overrides   # or {**defaults, **overrides}
unique = {1, 2, 2, 3}           # {1, 2, 3}</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>d[key]</code> raises <code>KeyError</code> when the key is missing; <code>d.get(key, default)</code> doesn’t.</li>
    <li>Loop with <code>.keys()</code>, <code>.values()</code> or <code>.items()</code>. Remove with <code>del d[key]</code> or <code>d.pop(key, None)</code>.</li>
    <li><code>collections.Counter</code> counts things and <code>collections.defaultdict(list)</code> groups things, without “if key not in” checks.</li>
    <li>Sets have operators: <code>a | b</code> union, <code>a &amp; b</code> intersection, <code>a - b</code> difference.</li>
    <li>Keys must be immutable (hashable): strings, numbers, tuples. Not lists or dicts.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 220" role="img" aria-label="Venn diagram of a = {1, 2, 3} and b = {3, 4} with the results of set operators">
      <circle class="venn-a" cx="170" cy="110" r="88"/>
      <circle class="venn-b" cx="270" cy="110" r="88"/>
      <text class="mono-l" x="125" y="116" text-anchor="middle">1  2</text>
      <text class="mono-l bold" x="220" y="116" text-anchor="middle">3</text>
      <text class="mono-l" x="305" y="116" text-anchor="middle">4</text>
      <text class="mono-s ts-ink" x="110" y="16">a = {1, 2, 3}</text>
      <text class="mono-s py-ink" x="250" y="16">b = {3, 4}</text>
      <g class="mono">
        <text x="400" y="62">a | b  →  {1, 2, 3, 4}</text>
        <text x="400" y="98">a &amp; b  →  {3}</text>
        <text x="400" y="134">a - b  →  {1, 2}</text>
        <text x="400" y="170">b - a  →  {4}</text>
      </g>
    </svg></div>
    <figcaption>Checking <code>x in some_set</code> is very fast even for millions of items, much faster than <code>x in some_list</code>.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>{}</code> is an empty dict, not an empty set. Write <code>set()</code> for an empty set.</p></aside>
  <h2>Distinguish reading from inserting</h2>
  <p>Unlike a TypeScript <code>Map.get()</code>, Python’s <code>d[key]</code> normally raises if a key is missing. A <code>defaultdict</code> changes that operation: indexing a missing key calls a factory and inserts the result. <code>get()</code> still only reads.</p>
  <pre><code class="language-python">from collections import defaultdict

by_team: defaultdict[str, list[str]] = defaultdict(list)
by_team["web"].append("Ada")
print(by_team.get("data"))  # None
print("data" in by_team)    # False
print(by_team["data"])      # []
print("data" in by_team)    # True</code></pre>
  <p>Index when you intend to create a bucket, as in the first append. Use <code>get()</code> or <code>in</code> if you don’t want a read to change the mapping.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="17-1"><p class="task-text">Count how often each word appears in a sentence, first with a plain dict, then with <code>Counter</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from collections import Counter

sentence = "the cat and the hat and the bat"
counts: dict[str, int] = {}
for word in sentence.split():
    counts[word] = counts.get(word, 0) + 1
print(counts)

print(Counter(sentence.split()).most_common(2))  # [('the', 3), ('and', 2)]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="17-2"><p class="task-text">Group <code>["apple", "avocado", "banana", "blueberry", "cherry"]</code> by first letter.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from collections import defaultdict

groups: defaultdict[str, list[str]] = defaultdict(list)
for word in ["apple", "avocado", "banana", "blueberry", "cherry"]:
    groups[word[0]].append(word)
print(dict(groups))</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="17-3"><p class="task-text">Given two lists of user IDs, find the users in both, only in the first, and in either.</p>
      <details><summary>Solution</summary><pre><code class="language-python">week1 = [1, 2, 3, 5, 8]
week2 = [2, 3, 4, 8, 9]
a, b = set(week1), set(week2)
print(a &amp; b)  # {8, 2, 3}  in both (sets have no fixed order)
print(a - b)  # {1, 5}     only in week 1
print(a | b)  # all of them</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="smallfeatures" data-section="4" data-title="Small features TS devs trip on" data-summary="Walrus expressions, record types, unpacking, comparison chains, loop else and one-item tuples.">
  <p class="lead">Some small Python features have no exact TypeScript spelling. They are useful in real code, but a familiar-looking comma or <code>else</code> can mean something surprising.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const values = [1, 2, 3, 4];
const first = values[0];
const middle = values.slice(1, -1);
const last = values[values.length - 1];
console.log(first, middle, last);  // 1 [2, 3] 4</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">values = [1, 2, 3, 4]
first, *middle, last = values
print(first, middle, last)  # 1 [2, 3] 4</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>name := expression</code> assigns and returns a value inside an expression. Use it when it avoids repeating a meaningful calculation, not to pack several steps onto one line.</li>
    <li><code>NamedTuple</code> is an immutable tuple with named fields, a dataclass is a class with generated methods, and <code>TypedDict</code> describes a plain dictionary to a type checker. None validates untrusted input by itself.</li>
    <li>Star-unpacking can collect the middle as well as the end: <code>first, *middle, last = values</code>. There must be enough values for the unstarred targets.</li>
    <li><code>0 &lt;= n &lt; 10</code> is a chained comparison; the middle expression is evaluated once. A loop’s <code>else</code> runs when the loop finishes without <code>break</code>, including an empty loop.</li>
    <li><code>(1)</code> is an integer; <code>(1,)</code> is a one-element tuple. The comma makes the tuple, not the parentheses.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Expression</th><th>Result or meaning</th></tr></thead>
      <tbody>
        <tr><td><code>(1)</code> / <code>(1,)</code></td><td><code>int</code> / one-item <code>tuple</code></td></tr>
        <tr><td><code>a, *mid, z = [1, 2, 3, 4]</code></td><td><code>1</code>, <code>[2, 3]</code>, <code>4</code></td></tr>
        <tr><td><code>for ... else</code></td><td>The <code>else</code> runs only if no <code>break</code> occurred</td></tr>
      </tbody>
    </table></div>
    <figcaption>Read the punctuation and control flow, not just the familiar words.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>A trailing comma changes the value: <code>result = compute(),</code> stores a tuple containing the result, not the result itself. Parentheses are optional for a tuple in many contexts.</p></aside>
  <h2>Keep a search result without repeating work</h2>
  <p>Here the walrus keeps the stripped value for the condition and later use. The loop’s <code>else</code> handles the no-match case; it is skipped when <code>break</code> finds a name. The chained comparison reads like a mathematical range.</p>
  <pre><code class="language-python">names = ["  ", " Ada ", "Lin"]
for raw in names:
    if (name := raw.strip()) and 1 &lt;= len(name) &lt;= 10:
        break
else:
    name = "(missing)"
print(name)  # Ada</code></pre>
  <p>Pick a record type by behavior, not by appearance. A <code>NamedTuple</code> supports tuple unpacking and cannot reassign fields; a normal dataclass can be mutated; a <code>TypedDict</code> is still an ordinary dict at runtime. Use Pydantic when incoming data must be checked.</p>
  <pre><code class="language-python">from dataclasses import dataclass
from typing import NamedTuple, TypedDict

class Point(NamedTuple):
    x: int
    y: int

@dataclass
class Counter:
    value: int

class User(TypedDict):
    name: str

point = Point(2, 3)
counter = Counter(1)
counter.value += 1
user: User = {"name": "Ada"}
print(point.x, counter.value, user["name"])  # 2 2 Ada</code></pre>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="smallfeatures-1"><p class="task-text">Strip an iterable of lines once each and return the nonempty results, using an assignment expression.</p>
      <details><summary>Hint</summary><p>A comprehension can bind the stripped value in its <code>if</code> clause.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Iterable

def clean_lines(lines: Iterable[str]) -&gt; list[str]:
    return [cleaned for line in lines if (cleaned := line.strip())]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="smallfeatures-2"><p class="task-text">Find the first matching index in an iterable, or return <code>None</code>, using <code>for...else</code>.</p>
      <details><summary>Hint</summary><p>Break on a match; the <code>else</code> handles exhaustion.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Iterable

def find_index(values: Iterable[str], target: str) -&gt; int | None:
    for index, value in enumerate(values):
        if value == target:
            break
    else:
        return None
    return index</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="smallfeatures-3" data-manual><p class="task-text">Predict the types of <code>(1)</code> and <code>(1,)</code>, unpack a first, middle and last value, and choose a record type for an immutable point, a mutable record and a JSON-shaped dict.</p>
      <details><summary>Hint</summary><p>The comma makes the tuple; <code>*middle</code> collects a list.</p></details>
      <details><summary>Solution</summary><p>The first is an integer and the second a tuple. Use <code>first, *middle, last = values</code>; choose <code>NamedTuple</code>, a dataclass and <code>TypedDict</code>, respectively.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="18" data-section="4" data-title="Exceptions" data-summary="try/except/else/finally, custom errors and when to ask forgiveness instead of permission.">
  <p class="lead">Exceptions work like <code>throw</code> and <code>catch</code>, but you catch by type instead of checking <code>instanceof</code>, and Python code uses them more freely than TS code does.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">class NotFoundError extends Error {}

try {
  const data = JSON.parse(text);
  console.log("parsed fine");
} catch (err) {
  if (err instanceof SyntaxError) {
    console.error("bad JSON");
  } else {
    throw err;
  }
} finally {
  cleanup();
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">import json

class NotFoundError(Exception):
    pass

try:
    data = json.loads(text)
except json.JSONDecodeError as err:
    print(f"bad JSON: {err}")
else:
    print("parsed fine")
finally:
    cleanup()</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>except SomeError as err:</code> catches only that type (and its subclasses). Errors you don’t name keep propagating, so no manual re-throw is needed.</li>
    <li><code>else</code> runs only when no exception happened; <code>finally</code> always runs.</li>
    <li><code>raise ValueError("message")</code> throws. A bare <code>raise</code> inside <code>except</code> re-raises; <code>raise NewError(...) from err</code> keeps the original as the cause.</li>
    <li>Python style is “easier to ask forgiveness than permission”: try the operation and catch the error, instead of checking every condition first.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 620 230" role="img" aria-label="try leads to else when there is no error, or except when one is raised; both continue to finally">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-ts" x="20" y="92" width="120" height="44" rx="8"/><text class="mono" x="80" y="119" text-anchor="middle">try:</text>
      <path class="arrow" d="M140,104 L216,58"/><text class="small" x="150" y="68">no error</text>
      <path class="arrow-warn" d="M140,124 L216,170"/><text class="small warn-ink" x="140" y="172">error raised</text>
      <rect class="box-ok" x="220" y="32" width="180" height="44" rx="8"/><text class="mono-s" x="234" y="59">else: success path</text>
      <rect class="box-warn" x="220" y="150" width="180" height="44" rx="8"/><text class="mono-s" x="234" y="177">except: handle it</text>
      <path class="arrow" d="M400,58 L466,102"/>
      <path class="arrow" d="M400,170 L466,126"/>
      <rect class="box-py" x="470" y="92" width="140" height="44" rx="8"/><text class="mono-s" x="484" y="119">finally: always</text>
    </svg></div>
    <figcaption>Keep the <code>try</code> block small: only the line that can fail. Put the follow-up work in <code>else</code>.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>A bare <code>except:</code> catches everything, including Ctrl+C. Always name the exception, and use <code>except Exception:</code> only at the very top of a program.</p></aside>
  <h2>Keep the try block narrow</h2>
  <p>Catch the error from the operation you expect to fail, not every line that follows. The <code>else</code> clause can use the result without routing later exceptions through the same handler.</p>
  <pre><code class="language-python">def parse_port(raw: str) -&gt; int:
    try:
        port = int(raw)
    except ValueError as exc:
        raise ValueError("Port must be a whole number") from exc
    else:
        if not 1 &lt;= port &lt;= 65535:
            raise ValueError("Port must be between 1 and 65535")
        return port


print(parse_port("8080"))  # 8080</code></pre>
  <p>Try <code>"web"</code> and <code>"0"</code>: the first error keeps the failed conversion as its cause; the second reports a range problem without mislabeling it as a parse failure.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="18-1"><p class="task-text">Write <code>safe_divide(a, b)</code> that returns <code>None</code> instead of crashing when <code>b</code> is 0.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def safe_divide(a: float, b: float) -&gt; float | None:
    try:
        return a / b
    except ZeroDivisionError:
        return None</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="18-2"><p class="task-text">Create an <code>InsufficientFunds</code> exception that stores the missing amount, and raise it from <code>Account.withdraw</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">class InsufficientFunds(Exception):
    def __init__(self, missing: float) -&gt; None:
        super().__init__(f"missing {missing:.2f}")
        self.missing = missing

# in Account:
    def withdraw(self, amount: float) -&gt; None:
        if amount &gt; self._balance:
            raise InsufficientFunds(amount - self._balance)
        self._balance -= amount</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="18-3"><p class="task-text">Sum <code>["1", "x", "3", ""]</code>, skipping values that aren’t numbers and printing a warning for each one.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def sum_valid(values: list[str]) -&gt; int:
    total = 0
    for value in values:
        try:
            total += int(value)
        except ValueError:
            print(f"skipping {value!r}")
    return total

print(sum_valid(["1", "x", "3", ""]))  # 4</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>

<template class="lesson" data-n="19" data-section="5" data-title="Modules and imports" data-summary="Every file is a module, folders become packages, and the __main__ check.">
  <p class="lead">Every <code>.py</code> file is a module, and everything at its top level can be imported. There’s no <code>export</code> keyword: privacy is a naming convention.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">// utils/math.ts
export function double(n: number) {
  return n * 2;
}

// main.ts
import { double } from "./utils/math";
import * as math from "./utils/math";

console.log(double(4));</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python"># utils/math_tools.py
def double(n: int) -&gt; int:
    return n * 2

# main.py
from utils.math_tools import double
import utils.math_tools as mt

if __name__ == "__main__":
    print(double(4))</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>A folder with an <code>__init__.py</code> file is a package, like a folder with an <code>index.ts</code>. Re-export names there to shorten imports.</li>
    <li>Imports without a leading dot are absolute and use Python’s module search path. Inside a package you can use relative imports: <code>from .math_tools import double</code>.</li>
    <li>Names starting with <code>_</code> are internal by convention. Nothing stops an import, but tools and readers treat them as private.</li>
    <li>Importing a module runs it from top to bottom. Two modules that import each other at the top, which happens easily with TypeScript-style barrel files, fail with <em>cannot import name … (most likely due to a circular import)</em>. Move the shared code into a third module, or import inside the function that needs it.</li>
    <li><code>if __name__ == "__main__":</code> runs code only when the file is executed directly, not when it’s imported. Use it for demos and scripts.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure">
<pre class="tree"><code>my_app/
├── main.py          <span class="cm"># from shop import apply_discount</span>
└── shop/
    ├── __init__.py  <span class="cm"># makes "shop" a package; can re-export names</span>
    ├── pricing.py   <span class="cm"># def apply_discount(...)</span>
    └── _helpers.py  <span class="cm"># underscore: internal to the package</span></code></pre>
    <figcaption>The import path follows the folder path: <code>shop/pricing.py</code> is <code>shop.pricing</code>.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Don’t name your own file after a standard module, like <code>json.py</code>, <code>math.py</code> or <code>random.py</code>. Your file shadows the real one and imports break in confusing ways.</p></aside>
  <h2>Run a package module by name</h2>
  <p>From the directory containing a package, run <code>uv run python -m tools.report</code> to execute <code>tools/report.py</code> with package context. Inside the module, <code>from .formatting import title</code> then resolves to <code>tools/formatting.py</code>. Running the file by path instead can leave Python without that package context, and the relative import fails.</p>
  <p>Put executable work in a <code>main()</code> function and call it under the <code>__main__</code> check. Then importing <code>tools.report</code> in a test defines the function without printing anything or starting a job. Absolute imports resolve on Python’s module search path, not against a TypeScript-style project alias.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="19-1"><p class="task-text">Create the <code>shop</code> package from the diagram with an <code>apply_discount(price, percent)</code> function, and call it from <code>main.py</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python"># shop/pricing.py
def apply_discount(price: float, percent: float) -&gt; float:
    return round(price * (1 - percent / 100), 2)

# main.py
from shop.pricing import apply_discount
print(apply_discount(80, 25))  # 60.0</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="19-2"><p class="task-text">Add an <code>if __name__ == "__main__":</code> demo to <code>pricing.py</code>. Run the file directly, then run <code>main.py</code>, and check when the demo prints.</p>
      <details><summary>Solution</summary><pre><code class="language-python"># at the bottom of shop/pricing.py
if __name__ == "__main__":
    print("demo:", apply_discount(100, 10))

# uv run python -m shop.pricing  prints the demo
# uv run main.py                 doesn't</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="19-3"><p class="task-text">Re-export <code>apply_discount</code> in <code>shop/__init__.py</code> so that <code>from shop import apply_discount</code> works.</p>
      <details><summary>Solution</summary><pre><code class="language-python"># shop/__init__.py
from .pricing import apply_discount

__all__ = ["apply_discount"]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="20" data-section="5" data-title="Dependencies and environments" data-summary="uv, pyproject.toml and virtual environments, mapped onto npm.">
  <p class="lead">Python’s packaging world maps almost one to one onto npm. With uv, the commands even feel the same.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">Terminal (npm)</div><pre><code class="language-bash">npm init -y
npm install zod
npm install -D vitest
npm run dev
npx some-tool</code></pre></div>
    <div class="pane py"><div class="pane-head">Terminal (uv)</div><pre><code class="language-bash">uv init my-app
uv add pydantic
uv add --dev pytest
uv run main.py
uvx some-tool</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>pyproject.toml</code> is your <code>package.json</code>, and <code>uv.lock</code> is your lockfile. Commit both.</li>
    <li>A virtual environment, <code>.venv</code>, is the project’s own folder of installed packages, like <code>node_modules</code>. uv creates and uses it automatically. Don’t commit it.</li>
    <li>Without uv, the classic route is <code>python -m venv .venv</code>, activating it (<code>source .venv/bin/activate</code> on macOS and Linux, <code>.venv\Scripts\activate</code> on Windows), then <code>pip install …</code>.</li>
    <li>Packages are found on <a href="https://pypi.org">PyPI</a>, Python’s npm registry.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure">
    <div class="dict" role="table" aria-label="npm concepts and their Python equivalents">
      <span class="h t">npm world</span><span class="h p">Python world</span>
      <span>package.json</span><span>pyproject.toml</span>
      <span>package-lock.json</span><span>uv.lock</span>
      <span>node_modules/</span><span>.venv/</span>
      <span>npm install x</span><span>uv add x</span>
      <span>npm install -D x</span><span>uv add --dev x</span>
      <span>npm run script</span><span>uv run file.py</span>
      <span>npx tool</span><span>uvx tool</span>
      <span>npmjs.com</span><span>pypi.org</span>
      <span>.nvmrc</span><span>.python-version</span>
    </div>
    <figcaption>uv also installs Python itself: <code>uv python install 3.13</code>, much like nvm.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Running <code>pip install</code> outside an environment installs into the system Python, and many systems block it. Always work inside a project with its own environment.</p></aside>
  <h2>Change dependencies or reproduce them</h2>
  <p>Use <code>uv add</code> when changing what the project needs, and <code>uv sync</code> when installing what’s already declared. <code>uv add --dev pytest</code> records pytest as a development dependency; importing it in your app would make the app depend on a tool that production may not install.</p>
  <p>In CI, use <code>uv sync --locked</code> to fail if <code>uv.lock</code> is out of date rather than silently resolving a new environment. Keep <code>pyproject.toml</code> and <code>uv.lock</code> in the same change when you add or update a dependency.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="20-1" data-manual><p class="task-text">Install uv, run <code>uv init hello-uv</code>, and run the generated <code>main.py</code> with <code>uv run main.py</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-bash">uv init hello-uv
cd hello-uv
uv run main.py   # prints "Hello from hello-uv!"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="20-2" data-manual><p class="task-text">Add the <code>httpx</code> package, open <code>pyproject.toml</code>, and find where it was recorded. Then write a script that prints the status code of a request to <code>https://example.com</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python"># after: uv add httpx  (it appears under [project] dependencies)
import httpx

response = httpx.get("https://example.com")
print(response.status_code)  # 200</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="20-3" data-manual><p class="task-text">Add pytest as a development dependency and run it. With no tests yet, read what it reports.</p>
      <details><summary>Solution</summary><pre><code class="language-bash">uv add --dev pytest
uv run pytest     # "no tests ran", which is expected for now</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="21" data-section="5" data-title="Linting, formatting and type checking" data-summary="ruff replaces ESLint and Prettier; mypy or pyright replace tsc.">
  <p class="lead">Python doesn’t check types when it runs, so the tooling does that job. Set it up once and you get the same safety net you’re used to from TypeScript.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">Terminal (TypeScript)</div><pre><code class="language-bash">npx eslint .
npx prettier --write .
npx tsc --noEmit</code></pre></div>
    <div class="pane py"><div class="pane-head">Terminal (Python)</div><pre><code class="language-bash">uv add --dev ruff mypy
uv run ruff check .
uv run ruff format .
uv run mypy --strict .</code></pre></div>
  </div>
  <p class="run">What the type checker catches:</p>
  <pre><code class="language-python">def total(prices: list[float]) -&gt; float:
    return sum(prices)

total(["1.5", "2"])
# mypy: Argument 1 to "total" has incompatible type "list[str]"; expected "list[float]"</code></pre>
  <h2>What’s different</h2>
  <ul class="points">
    <li>ruff is a linter and formatter in one tool, and it’s extremely fast. <code>ruff check --fix</code> fixes what it can automatically.</li>
    <li>mypy and pyright both check type hints. The Pylance extension in VS Code uses pyright, so you see errors as you type, just like TS.</li>
    <li><code>--strict</code> turns missing annotations into errors, like <code>"strict": true</code> in <code>tsconfig.json</code>.</li>
    <li>All settings live in <code>pyproject.toml</code> under <code>[tool.ruff]</code> and <code>[tool.mypy]</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 120" role="img" aria-label="Check pipeline: ruff format, ruff check, mypy, pytest, then ready to commit">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box" x="10" y="26" width="108" height="48" rx="8"/><text class="mono-s" x="64" y="55" text-anchor="middle">ruff format</text>
      <path class="arrow" d="M118,50 L132,50"/>
      <rect class="box" x="136" y="26" width="108" height="48" rx="8"/><text class="mono-s" x="190" y="55" text-anchor="middle">ruff check</text>
      <path class="arrow" d="M244,50 L258,50"/>
      <rect class="box" x="262" y="26" width="108" height="48" rx="8"/><text class="mono-s" x="316" y="55" text-anchor="middle">mypy</text>
      <path class="arrow" d="M370,50 L384,50"/>
      <rect class="box" x="388" y="26" width="108" height="48" rx="8"/><text class="mono-s" x="442" y="55" text-anchor="middle">pytest</text>
      <path class="arrow" d="M496,50 L510,50"/>
      <rect class="box-ok" x="514" y="26" width="116" height="48" rx="8"/><text class="small" x="572" y="55" text-anchor="middle">ready to commit</text>
      <g class="small muted"><text x="64" y="100" text-anchor="middle">style</text><text x="190" y="100" text-anchor="middle">likely bugs</text><text x="316" y="100" text-anchor="middle">types</text><text x="442" y="100" text-anchor="middle">behavior</text></g>
    </svg></div>
    <figcaption>Run these in this order before every commit, or wire them into a pre-commit hook or your CI.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>A Python program with type errors still runs. Unlike <code>tsc</code>, nothing stops you unless you run the checker, so make it part of your routine.</p></aside>
  <h2>Know which check failed</h2>
  <p>Run these from your project directory. The checks are separate for the same reason Prettier, ESLint and <code>tsc</code> are separate: they answer different questions.</p>
  <pre><code>uv run ruff format --check app.py
uv run ruff check app.py
uv run mypy app.py</code></pre>
  <p>The first checks layout without rewriting the file. The second catches lint issues such as unused imports. The third catches type mismatches such as passing a string to an argument annotated <code>int</code>. If formatting is the only failure, run <code>uv run ruff format app.py</code> to apply it.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="21-1" data-manual><p class="task-text">Write a function with a deliberate type error, run <code>uv run mypy --strict .</code>, read the message, and fix the code.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def greet(name: str) -&gt; str:
    return "Hi " + name

greet(42)  # mypy: incompatible type "int"; expected "str"
greet("42")  # fixed</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="21-2" data-manual><p class="task-text">Create a file with an unused import and an unused variable. Run <code>ruff check .</code>, then <code>ruff check --fix .</code>, and compare.</p>
      <details><summary>Solution</summary><pre><code class="language-python">import os        # F401: imported but unused, removed by --fix

def f() -&gt; None:
    x = 1        # F841: assigned but never used, reported for you to fix</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="21-3" data-manual><p class="task-text">Configure ruff in <code>pyproject.toml</code> to allow lines up to 100 characters and to also check import sorting.</p>
      <details><summary>Solution</summary><pre><code class="language-toml">[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]   # "I" = isort rules for import order</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="22" data-section="6" data-title="Testing with pytest" data-summary="Plain asserts, parametrized tests and fixtures instead of beforeEach.">
  <p class="lead">pytest feels lighter than Vitest or Jest: tests are plain functions and checks are plain <code>assert</code> statements.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (Vitest)</div><pre><code class="language-typescript">import { it, expect } from "vitest";
import { slugify } from "./slugify";

it("lowercases and joins words", () =&gt; {
  expect(slugify("Hello World")).toBe("hello-world");
});

it.each([["A B", "a-b"], ["x", "x"]])(
  "slugify(%s)",
  (input, out) =&gt; expect(slugify(input)).toBe(out),
);

it("rejects empty text", () =&gt; {
  expect(() =&gt; slugify("")).toThrow();
});</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (pytest)</div><pre><code class="language-python">import pytest
from slugify import slugify

def test_lowercases_and_joins_words():
    assert slugify("Hello World") == "hello-world"


@pytest.mark.parametrize("text, expected", [
    ("A B", "a-b"),
    ("x", "x"),
])
def test_slugify(text, expected):
    assert slugify(text) == expected


def test_rejects_empty_text():
    with pytest.raises(ValueError):
        slugify("")</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Files named <code>test_*.py</code> and functions named <code>test_*</code> are found automatically. Run them with <code>uv run pytest</code>.</li>
    <li>A plain <code>assert</code> is enough: when it fails, pytest shows both sides and a diff.</li>
    <li>Fixtures replace <code>beforeEach</code>: write a function marked <code>@pytest.fixture</code>, then add its name as a test parameter, and pytest passes in a fresh value.</li>
    <li>Built-in fixtures help a lot: <code>tmp_path</code> gives you a temporary folder, <code>monkeypatch</code> changes environment variables or attributes for one test.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 200" role="img" aria-label="A fixture creates a fresh Account for each test that asks for it by name">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-py" x="20" y="70" width="180" height="60" rx="8"/><text class="mono-s" x="34" y="94">@pytest.fixture</text><text class="mono-s" x="34" y="116">def account():</text>
      <path class="arrow" d="M200,90 L326,56"/><path class="arrow" d="M200,110 L326,144"/>
      <text class="small muted" x="222" y="62">fresh Account</text><text class="small muted" x="222" y="152">fresh Account</text>
      <rect class="box" x="330" y="30" width="250" height="50" rx="8"/><text class="mono-s" x="344" y="60">def test_deposit(account):</text>
      <rect class="box" x="330" y="120" width="250" height="50" rx="8"/><text class="mono-s" x="344" y="150">def test_withdraw(account):</text>
    </svg></div>
    <figcaption>pytest matches the parameter name <code>account</code> to the fixture with the same name and calls it before each test.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>A test function without the <code>test_</code> prefix never runs, and pytest won’t warn you. If your test count looks low, check the names.</p></aside>
  <h2>Combine a fixture with a table of cases</h2>
  <p>Use a fixture to provide setup and <code>parametrize</code> to vary inputs, like <code>it.each</code> in Vitest. Here <code>tmp_path</code> gives each test case its own directory, so the cases can reuse the same filename.</p>
  <pre><code class="language-python">import pytest


@pytest.mark.parametrize("text", ["hello", "café"])
def test_text_round_trip(tmp_path, text):
    path = tmp_path / "message.txt"
    path.write_text(text, encoding="utf-8")
    assert path.read_text(encoding="utf-8") == text</code></pre>
  <p>Save this as <code>test_text.py</code> and run <code>uv run pytest test_text.py -v</code>. You’ll see two separate test cases, so a failure tells you which input to investigate.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="22-1"><p class="task-text">Write tests for your <code>slugify</code> from lesson 4.2, including one parametrized test with at least three cases.</p>
      <details><summary>Solution</summary><pre><code class="language-python">import pytest
from slugify import slugify

@pytest.mark.parametrize("text, expected", [
    ("Hello World", "hello-world"),
    ("  Spaces   everywhere ", "spaces-everywhere"),
    ("Python 3!", "python-3"),
])
def test_slugify(text, expected):
    assert slugify(text) == expected</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="22-2"><p class="task-text">Write an <code>account</code> fixture that returns an <code>Account</code> with 100 deposited, and two tests that use it.</p>
      <details><summary>Solution</summary><pre><code class="language-python">import pytest
from bank import Account

@pytest.fixture
def account() -&gt; Account:
    acct = Account("Ada")
    acct.deposit(100)
    return acct

def test_deposit(account):
    account.deposit(50)
    assert account.total == 150

def test_withdraw(account):
    account.withdraw(30)
    assert account.total == 70</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="22-3"><p class="task-text">Test that withdrawing more than the balance raises an error, and check the error message too.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def test_withdraw_too_much(account):
    with pytest.raises(ValueError, match="insufficient"):
        account.withdraw(1000)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="23" data-section="6" data-title="Mocking and test doubles" data-summary="unittest.mock, patch and monkeypatch for jest.fn() and vi.mock users, and when a fake is better.">
  <p class="lead">Python’s answer to <code>jest.fn()</code> and <code>vi.mock</code> is <code>unittest.mock</code>, in the standard library. A <code>Mock</code> records every call, <code>patch</code> swaps a name for the length of one test, and pytest’s <code>monkeypatch</code> fixture covers attributes and environment variables. The one big difference from Jest is where you patch.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (Vitest)</div><pre><code class="language-typescript">import { vi, test, expect } from "vitest";
import { checkout } from "./checkout";
import { describe } from "./report";

vi.mock("./weatherApi", () =&gt; ({
  fetchTemperature: vi.fn(() =&gt; 24),
}));

test("charges in cents", () =&gt; {
  const gateway = { charge: vi.fn() };
  gateway.charge.mockReturnValue("tx_123");

  expect(checkout(19.99, gateway))
    .toBe("paid tx_123");
  expect(gateway.charge).toHaveBeenCalledTimes(1);
  expect(gateway.charge).toHaveBeenCalledWith(1999);
});

test("report", () =&gt; {
  expect(describe("Lisbon"))
    .toBe("Lisbon: 24°C, warm");
});</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (pytest + unittest.mock)</div><pre><code class="language-python">from unittest.mock import Mock, patch

from checkout import checkout
from report import describe


def test_charges_in_cents():
    gateway = Mock()
    gateway.charge.return_value = "tx_123"

    assert checkout(19.99, gateway) == "paid tx_123"
    gateway.charge.assert_called_once_with(1999)


@patch("report.fetch_temperature",
       return_value=24)
def test_report(fake_fetch):
    assert describe("Lisbon") == "Lisbon: 24°C, warm"
    fake_fetch.assert_called_once_with("Lisbon")</code></pre></div>
  </div>
  <p class="run"><code>unittest.mock</code> is in the standard library and <code>monkeypatch</code> is a built-in pytest fixture, so there’s nothing to install. Run the tests with <code>uv run pytest</code>.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li>A <code>Mock()</code> accepts any attribute and any call, and records them. <code>gateway.charge</code> springs into existence the first time you touch it, so one <code>Mock</code> stands in for a whole object. <code>MagicMock</code> also supports <code>len()</code>, iteration and <code>with</code>, and <code>AsyncMock</code> is for functions you <code>await</code>.</li>
    <li><code>return_value</code> is <code>mockReturnValue</code>. <code>side_effect</code> covers the rest: an exception to raise (like <code>mockRejectedValue</code>), a function to call instead (<code>mockImplementation</code>), or a list of values for successive calls.</li>
    <li>Assertions are methods on the mock itself: <code>assert_called_once_with(1999)</code>, <code>assert_not_called()</code>, plus <code>call_count</code> and <code>call_args</code> to inspect.</li>
    <li><code>patch("module.name")</code> replaces a name for the length of a <code>with</code> block or a decorated test, then puts the original back. Nothing is hoisted, and there’s nothing to reset between tests.</li>
    <li>A plain <code>Mock</code> happily accepts methods that don’t exist. <code>create_autospec(PaymentGateway)</code>, or <code>patch(..., autospec=True)</code>, copies the real class’s methods and signatures, so a renamed method or wrong arguments fail the test.</li>
    <li>pytest’s <code>monkeypatch</code> fixture does the same for simple cases: <code>monkeypatch.setattr(obj, "name", value)</code> and <code>monkeypatch.setenv("API_KEY", "test")</code>, all undone after the test.</li>
    <li>Often the best mock is none at all. Pass dependencies in as parameters and give tests a small working fake. It’s the same idea as <code>Depends</code> and <code>dependency_overrides</code> in lesson 36.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 230" role="img" aria-label="weather_api.py defines fetch_temperature and report.py imports it with from-import, so each module has its own name pointing at the same function. Patching weather_api.fetch_temperature leaves report's name pointing at the real function; patching report.fetch_temperature replaces the one describe uses.">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box" x="20" y="30" width="250" height="84" rx="8"/>
      <text class="mono-s muted" x="145" y="54" text-anchor="middle">weather_api.py</text>
      <text class="mono-s" x="145" y="80" text-anchor="middle">def fetch_temperature(city):</text>
      <text class="mono-s muted" x="145" y="100" text-anchor="middle">...calls the web API</text>
      <rect class="box" x="370" y="30" width="250" height="84" rx="8"/>
      <text class="mono-s muted" x="495" y="54" text-anchor="middle">report.py</text>
      <text class="mono-s" x="495" y="80" text-anchor="middle">from weather_api import</text>
      <text class="mono-s" x="495" y="100" text-anchor="middle">    fetch_temperature</text>
      <path class="arrow" d="M145,114 L282,150"/>
      <path class="arrow" d="M495,114 L358,150"/>
      <rect class="box-py" x="230" y="152" width="180" height="46" rx="8"/>
      <text class="small" x="320" y="180" text-anchor="middle">the real function</text>
      <text class="small warn-ink" x="20" y="172">✗ patching weather_api</text>
      <text class="small warn-ink" x="20" y="190">misses report’s own name</text>
      <text class="small ok-ink" x="620" y="172" text-anchor="end">✓ patching report</text>
      <text class="small ok-ink" x="620" y="190" text-anchor="end">replaces what describe() uses</text>
    </svg></div>
    <figcaption><code>from weather_api import fetch_temperature</code> gives <code>report.py</code> its own name for the function. Patch the name that the code under test looks up.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>vi.mock("./weatherApi")</code> replaces the module for every file that imports it. <code>patch("weather_api.fetch_temperature")</code> only rebinds the name inside <code>weather_api</code>. If <code>report.py</code> did <code>from weather_api import fetch_temperature</code>, it still holds the real function, and your test quietly calls the network. Patch where the name is looked up: <code>patch("report.fetch_temperature")</code>.</p></aside>
  <h2>Use a mock with a real signature</h2>
  <p>If you just need a predictable answer, a small fake is often easiest to read. If the interaction itself matters, an autospecced mock lets you inspect the call and catches arguments the real function wouldn’t accept.</p>
  <pre><code class="language-python">from unittest.mock import create_autospec


def lookup(code: str, *, locale: str) -&gt; str:
    return f"{code}: {locale}"


fake_lookup = create_autospec(lookup, return_value="Ready")
print(fake_lookup("status", locale="en"))  # Ready
fake_lookup.assert_called_once_with("status", locale="en")</code></pre>
  <p>Try calling <code>fake_lookup("status", "en")</code>. It raises <code>TypeError</code> because <code>locale</code> is keyword-only. Autospec checks the calling convention, not the annotated argument types.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="23-1"><p class="task-text">Test a <code>checkout(total, gateway)</code> function by passing a <code>Mock</code> as the gateway: check the result, check that <code>charge</code> got the amount in cents, and simulate a declined card with <code>side_effect</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def test_successful_payment():
    gateway = Mock()
    gateway.charge.return_value = "tx_123"
    assert checkout(19.99, gateway) == "paid tx_123"
    gateway.charge.assert_called_once_with(1999)

def test_declined_card():
    gateway = Mock()
    gateway.charge.side_effect = PaymentDeclined()
    assert checkout(19.99, gateway) == "declined"</code></pre></details>

      <details><summary>Solution</summary><pre><code class="language-python">TARGET = "ex23_weather_report.fetch_temperature"

def test_warm_day():
    with patch(TARGET, return_value=23.6) as fake_fetch:
        assert describe("Lisbon") == "Lisbon: 24°C, warm"
    fake_fetch.assert_called_once_with("Lisbon")

@patch(TARGET, return_value=8.0)
def test_cold_day(fake_fetch):
    assert describe("Oslo") == "Oslo: 8°C, cold"

def test_twenty_degrees_is_warm(monkeypatch):
    monkeypatch.setattr(TARGET, lambda city: 20.0)
    assert describe("Rome") == "Rome: 20°C, warm"</code></pre></details>

    <li class="task" data-task="23-3"><p class="task-text">Write a <code>FakeMailer</code> that records what it sends in a <code>sent</code> list and raises <code>MailError</code> for chosen addresses, so tests can check results instead of calls.</p>
      <details><summary>Solution</summary><pre><code class="language-python">class FakeMailer:
    def __init__(self, fail_for: Iterable[str] = ()) -&gt; None:
        self.sent: list[tuple[str, str]] = []
        self.fail_for = set(fail_for)

    def send(self, to: str, subject: str) -&gt; None:

<template class="lesson" data-n="coverage" data-section="6" data-title="Coverage and property-based tests" data-summary="Measure branches with pytest-cov and find unexpected inputs with Hypothesis.">
  <p class="lead">Coverage tells you which code your tests executed, not whether their assertions are good. Hypothesis explores generated inputs and shrinks failures, much like <code>fast-check</code> in TypeScript.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">import fc from "fast-check";

const clamp = (n: number) =&gt; Math.min(Math.max(n, 0), 10);
fc.assert(fc.property(fc.integer(), n =&gt; {
  const result = clamp(n);
  return 0 &lt;= result &amp;&amp; result &lt;= 10;
}));</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from hypothesis import given, settings
from hypothesis import strategies as st

def clamp(n: int) -&gt; int:
    return min(max(n, 0), 10)

@settings(derandomize=True, database=None, deadline=None)
@given(st.integers())
def test_bounds(n: int) -&gt; None:
    assert 0 &lt;= clamp(n) &lt;= 10

test_bounds()  # pytest can run it too</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Install <code>pytest-cov</code> and run pytest with <code>--cov</code>. Add <code>--cov-branch</code> to measure which paths through conditions ran, not just which lines executed.</li>
    <li><code>--cov-report=term-missing</code> points to missing lines and branches. A number is a guide to investigation, not a guarantee of correct behavior.</li>
    <li><code>@given</code> supplies values from strategies such as <code>st.integers()</code>, <code>st.text()</code> and <code>st.lists()</code>. Describe a property that must hold for all valid inputs.</li>
    <li>When a property fails, Hypothesis searches for a smaller counterexample. Build inputs that satisfy your preconditions rather than discarding most generated values.</li>
    <li>Keep tests deterministic and isolated from real services. The course examples disable the example database and deadlines so exercises do not depend on network, saved state or machine speed.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Test</th><th>Input</th><th>What it reveals</th></tr></thead>
      <tbody>
        <tr><td>Example</td><td><code>5</code>, <code>-1</code></td><td>Middle and lower-bound behavior</td></tr>
        <tr><td>Missing branch</td><td><code>11</code></td><td>The value above the upper bound</td></tr>
        <tr><td>Property</td><td>Many generated values</td><td>A small input that breaks the range invariant</td></tr>
      </tbody>
    </table></div>
    <figcaption>With bounds 0 and 10, returning 11 for an input above 10 violates the property even when the first two examples pass.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>A coverage percentage can be green while the tested branch returns the wrong value. Treat coverage as a map of what you did not exercise, then write assertions about the behavior that matters.</p></aside>
  <h2>Turn a requirement into an invariant</h2>
  <p>For a clamp, every result must stay between its bounds; a value already in range must not change. Generate the lower bound and a nonnegative width so every pair of bounds is valid. The property is about the contract, not one hand-picked example.</p>
  <pre><code class="language-python">from hypothesis import given, settings
from hypothesis import strategies as st

def clamp(value: int, lower: int, upper: int) -&gt; int:
    return min(max(value, lower), upper)

@settings(derandomize=True, database=None, deadline=None)
@given(value=st.integers(), lower=st.integers(), width=st.integers(0, 100))
def test_clamp(value: int, lower: int, width: int) -&gt; None:
    upper = lower + width
    result = clamp(value, lower, upper)
    assert lower &lt;= result &lt;= upper
    if lower &lt;= value &lt;= upper:
        assert result == value

test_clamp()</code></pre>
  <p>In your own project add the tools with <code>uv add --dev hypothesis pytest-cov</code>. Run <code>uv run pytest --cov=your_package --cov-branch --cov-report=term-missing</code>; then inspect the missing paths instead of chasing a percentage alone.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="coverage-1"><p class="task-text">The example tests for <code>clamp</code> pass, but its property test fails. Read the shrunk counterexample and fix the bug.</p>
      <details><summary>Hint</summary><p>What should be returned when the value is above the upper bound?</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">def clamp(value: int, lower: int, upper: int) -&gt; int:
    if lower &gt; upper:
        raise ValueError("lower must not exceed upper")
    if value &lt; lower:
        return lower
    if value &gt; upper:
        return upper
    return value</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="coverage-2"><p class="task-text">Write a Hypothesis property showing that whitespace normalization preserves a list of words in order. The runner checks it against both working and broken code.</p>
      <details><summary>Hint</summary><p>Join generated words with mixed whitespace, then compare the result to the same words joined by one space.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from hypothesis import given, settings
from hypothesis import strategies as st

def normalize(text: str) -&gt; str:
    return " ".join(text.split())

@settings(derandomize=True, database=None, deadline=None)
@given(st.lists(st.text(alphabet="abc", min_size=1, max_size=5), max_size=5))
def test_words(words: list[str]) -&gt; None:
    assert normalize(" \t".join(words)) == " ".join(words)

test_words()</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="coverage-3" data-manual><p class="task-text">Run only the two example cases with branch coverage. Explain a missing path and add a case that takes it.</p>
      <details><summary>Hint</summary><p>Select <code>examples_that_miss_the_bug</code> with <code>-k</code> and add <code>--cov-branch --cov-report=term-missing</code>.</p></details>
      <details><summary>Solution</summary><p>The above-upper-bound branch is missing. Test <code>clamp(11, 0, 10) == 10</code>, then rerun the full tests.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="24" data-section="6" data-title="Debugging" data-summary="Tracebacks read bottom-up, breakpoint() instead of debugger, and the VS Code debugger.">
  <p class="lead">Debugging Python feels familiar: there’s a statement that pauses the program, a debugger in VS Code, and stack traces when things go wrong. The one real surprise is the stack trace. Python prints it upside down compared with JavaScript, so you need to read it from the bottom.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">function toCents(price: string) {
  debugger; // pauses only if DevTools is open
  return Number(price) * 100;
}

// node --inspect-brk app.js, then open
// chrome://inspect, or press F5 in VS Code</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">def to_cents(price: str) -&gt; int:
    breakpoint()  # always pauses, at a (Pdb) prompt
    return int(price) * 100

# uv run app.py, then at the (Pdb) prompt:
#   p price      print a value (pp: pretty-print)
#   n / s / c    next line, step into, continue
#   l            list the code around you
#   w / u / d    where am I, up, down the stack
#   q            quit</code></pre></div>
  </div>
  <p class="run">In VS Code, install the Python Debugger extension, click in the gutter to set a breakpoint and press F5. It works the same way as debugging TypeScript.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>breakpoint()</code> is Python’s <code>debugger</code> statement, but it always stops, even with no debugger attached: you land in pdb, a debugger in the terminal. Set <code>PYTHONBREAKPOINT=0</code> to turn every <code>breakpoint()</code> off, and let ruff’s <code>T10</code> rules catch the ones you forgot to delete.</li>
    <li>At the <code>(Pdb)</code> prompt you can type any Python expression, not just commands: <code>p len(rows)</code>, <code>pp order</code>, even <code>price = "0"</code> to try a fix without restarting.</li>
    <li>A traceback says <em>most recent call last</em>: the oldest call is at the top and the line that failed is at the bottom, right above the error message. A JavaScript stack trace is the other way round.</li>
    <li>A chained error prints two tracebacks. <em>The above exception was the direct cause of the following exception</em> means someone wrapped it with <code>raise ... from err</code> (lesson 4.5). <em>During handling of the above exception, another exception occurred</em> usually means a bug inside an <code>except</code> block. The root cause is in the first one.</li>
    <li>In tests, <code>uv run pytest -x --pdb</code> stops at the first failure and opens pdb right where it failed (lesson 6.1). <code>--lf</code> reruns only the tests that failed last time.</li>
    <li>To debug a FastAPI app in VS Code, add a <code>launch.json</code> entry with <code>"type": "debugpy"</code>, <code>"module": "uvicorn"</code> and <code>"args": ["main:app", "--reload"]</code>, then set breakpoints in your routes.</li>
    <li>In production you get logs, not a debugger. <code>logger.exception("...")</code> inside an <code>except</code> block logs the whole traceback (lesson 11.1), and <code>traceback.format_exc()</code> gives it to you as a string. <code>python -X dev</code> turns on extra warnings, such as files you never closed.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 250" role="img" aria-label="A JavaScript stack trace starts with the error and lists the newest call first. A Python traceback lists the oldest call first and ends with the error.">
      <text class="ts-ink" x="10" y="24">JavaScript stack trace</text>
      <rect class="box-warn" x="10" y="40" width="290" height="32" rx="6"/><text class="mono-s" x="22" y="61">Error: bad price</text>
      <rect class="box" x="10" y="80" width="290" height="30" rx="6"/><text class="mono-s" x="22" y="100">at toCents (prices.ts:9)</text>
      <rect class="box" x="10" y="116" width="290" height="30" rx="6"/><text class="mono-s" x="22" y="136">at parseLine (prices.ts:15)</text>
      <rect class="box" x="10" y="152" width="290" height="30" rx="6"/><text class="mono-s" x="22" y="172">at orderTotal (prices.ts:49)</text>
      <text class="small muted" x="10" y="212">The error comes first,</text>
      <text class="small muted" x="10" y="230">then the newest call.</text>
      <path class="rule" d="M320,30 L320,236"/>
      <text class="py-ink" x="340" y="24">Python traceback</text>
      <text class="mono-s muted" x="340" y="58">most recent call last:</text>
      <rect class="box" x="340" y="70" width="290" height="30" rx="6"/><text class="mono-s" x="352" y="90">line 49, in order_total</text>
      <rect class="box" x="340" y="106" width="290" height="30" rx="6"/><text class="mono-s" x="352" y="126">line 15, in parse_line</text>
      <rect class="box" x="340" y="142" width="290" height="30" rx="6"/><text class="mono-s" x="352" y="162">line 9, in to_cents</text>
      <rect class="box-warn" x="340" y="178" width="290" height="32" rx="6"/><text class="mono-s" x="352" y="199">ValueError: bad price</text>
      <text class="small muted" x="340" y="230">The oldest call comes first, the error last.</text>
    </svg></div>
    <figcaption>The same failure in both languages. In Python, start reading at the bottom: the error, and just above it the line that raised it.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Years of JavaScript train you to look at the top of a stack trace. In Python the top is the oldest call, usually your script’s entry point or a framework you didn’t write. Scroll to the bottom first: the last line is the error, and the frame right above it is where it happened.</p></aside>
  <h2>Inspect the failing frame and its caller</h2>
  <p>Start a failing test with <code>uv run pytest -x --pdb</code>. At <code>(Pdb)</code>, run <code>where</code> for the stack, <code>list</code> for nearby source, and <code>p value</code> for a suspect local variable. Use <code>up</code> to inspect the caller and <code>down</code> to return to the failing frame. These are the terminal equivalents of the call-stack and variables panes in VS Code.</p>
  <p>If the bad value came from the caller, fix the code that produced it rather than masking it at the crash site. Restart the test to verify the fix; editing a variable in the debugger only changes that running process.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="24-1"><p class="task-text">The exercise file includes the traceback that <code>order_total</code> produces. Read it from the bottom up, find the line that fails, and fix it so prices with decimals work.</p>
      <details><summary>Solution</summary><pre><code class="language-python"># The last frame is to_cents: int() only parses whole numbers.
def to_cents(price: str) -&gt; int:
    return round(float(price) * 100)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="24-2"><p class="task-text">Use the <code>traceback</code> module to return the file, line and function where an exception was raised, and follow <code>__cause__</code> and <code>__context__</code> to find its root cause.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def where_it_failed(exc):
    if exc.__traceback__ is None:
        return None
    frame = traceback.extract_tb(exc.__traceback__)[-1]
    return Path(frame.filename).name, frame.lineno, frame.name

def root_cause(exc):
    while True:
        previous = exc.__cause__ or exc.__context__
        if previous is None:
            return exc
        exc = previous</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="24-3"><p class="task-text">Write <code>run_job(name, job)</code> that returns <code>False</code> when the job raises, and logs the failure with <code>logger.exception</code> so the log keeps the whole traceback.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def run_job(name: str, job: Callable[[], object]) -&gt; bool:
    try:
        job()
    except Exception:  # not BaseException: Ctrl+C must still work
        logger.exception("job %s failed", name)
        return False
    return True</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="25" data-section="7" data-title="Comprehensions and lambdas" data-summary="The Python way to map, filter and build collections in one readable line.">
  <p class="lead">Where TypeScript chains <code>.filter().map()</code>, Python writes a comprehension: one expression that loops, filters and builds a list, dict or set.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const prices = [5, 20, 50];
const withTax = prices.map(p =&gt; p * 1.2);
const cheap = prices.filter(p =&gt; p &lt; 30);
const byId = Object.fromEntries(
  users.map(u =&gt; [u.id, u]),
);
const total = prices.reduce((a, b) =&gt; a + b, 0);
const oldest = [...users].sort((a, b) =&gt; b.age - a.age)[0];</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">prices = [5, 20, 50]
with_tax = [p * 1.2 for p in prices]
cheap = [p for p in prices if p &lt; 30]
by_id = {u.id: u for u in users}


total = sum(prices)
oldest = max(users, key=lambda u: u.age)</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>List: <code>[expr for x in items if cond]</code>. Dict: <code>{key: value for …}</code>. Set: <code>{expr for …}</code>.</li>
    <li><code>map()</code> and <code>filter()</code> exist, but comprehensions are the idiomatic choice.</li>
    <li>Built-ins replace most uses of <code>reduce</code>: <code>sum</code>, <code>min</code>, <code>max</code>, <code>any</code>, <code>all</code>, <code>sorted</code>. Most of them accept <code>key=</code>.</li>
    <li>A lambda holds one expression only: <code>lambda u: u.age</code>. Anything bigger should be a named function.</li>
    <li>If a comprehension needs nested loops and conditions, a normal <code>for</code> loop is easier to read.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 170" role="img" aria-label="Anatomy of a list comprehension: output expression, loop, filter">
      <text class="mono-l" x="20" y="56">[</text>
      <text class="mono-l" x="45" y="56">p * 1.2</text>
      <text class="mono-l" x="165" y="56">for p in prices</text>
      <text class="mono-l" x="345" y="56">if p &lt; 30</text>
      <text class="mono-l" x="455" y="56">]</text>
      <line class="bar-py" x1="45" y1="68" x2="121" y2="68"/>
      <line class="bar-ts" x1="165" y1="68" x2="327" y2="68"/>
      <line class="bar-ok" x1="345" y1="68" x2="442" y2="68"/>
      <text class="small" x="83" y="92" text-anchor="middle">1. what to produce</text>
      <text class="small" x="246" y="92" text-anchor="middle">2. what to loop over</text>
      <text class="small" x="393" y="92" text-anchor="middle">3. what to keep</text>
      <text class="mono-s muted" x="20" y="140">TS: prices.filter(p =&gt; p &lt; 30).map(p =&gt; p * 1.2)</text>
    </svg></div>
    <figcaption>Read it as “give me <code>p * 1.2</code> for each <code>p</code> in <code>prices</code>, if <code>p &lt; 30</code>”. The filter runs before the expression, even though it’s written last.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>The order is the reverse of a TS chain: the output comes first and the filter comes last. When a comprehension reads awkwardly, say it out loud in that order.</p></aside>
  <h2>Separate filtering from transforming</h2>
  <p>The <code>if</code> after <code>for</code> drops items, like <code>.filter()</code>. A conditional expression <em>before</em> <code>for</code> keeps every item and decides what value to return, like a ternary inside <code>.map()</code>.</p>
  <pre><code class="language-python">scores = [3, 8, 10]
print([score for score in scores if score &gt;= 8])  # [8, 10]
print(["pass" if score &gt;= 8 else "retry" for score in scores])
# ['retry', 'pass', 'pass']</code></pre>
  <p>Pick the form by asking whether the result should have fewer elements. If you need to skip and transform items with several rules, a loop gives each rule a place to read and debug.</p>
  <h2>Practice</h2>

      <details><summary>Solution</summary><pre><code class="language-python">squares = [n * n for n in range(1, 21) if n % 2 == 0]
print(squares)  # [4, 16, 36, ..., 400]</code></pre></details>

print(lengths)  # {'quick': 5, 'brown': 5, 'jumps': 5, 'over': 4, 'lazy': 4}</code></pre></details>
