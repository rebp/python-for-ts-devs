<template class="lesson" data-n="35" data-section="10" data-title="Choosing a web framework" data-summary="FastAPI, Django and Flask next to Express and NestJS, and how to pick one.">
  <p class="lead">Python has three big web frameworks, and each one matches something you know from Node. FastAPI is the typed, API-first one, Django brings everything from the ORM to an admin site, and Flask is as small as Express.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (Express)</div><pre><code class="language-typescript">import express from "express";

const app = express();

app.get("/items/:id", (req, res) =&gt; {
  const id = Number(req.params.id);
  res.json({ id, name: "Lamp" });
});

app.listen(3000);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (Flask, then Django)</div><pre><code class="language-python"># Flask: a small core, like Express
from flask import Flask

app = Flask(__name__)

@app.get("/items/&lt;int:item_id&gt;")
def get_item(item_id):
    return {"id": item_id, "name": "Lamp"}

# Django: a view function plus a URL entry
from django.http import JsonResponse
from django.urls import path

def get_item(request, item_id):
    data = {"id": item_id, "name": "Lamp"}
    return JsonResponse(data)

urlpatterns = [path("items/&lt;int:item_id&gt;", get_item)]</code></pre></div>
  </div>
  <p class="run">The FastAPI version is in lesson 33. To try the other two, run <code>uv add flask</code> or <code>uv add django</code> in a scratch project.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li><strong>FastAPI</strong> is the closest to NestJS with Zod: type hints drive validation, and the OpenAPI docs come for free. It’s the usual pick for a new JSON API.</li>
    <li><strong>Django</strong> includes an ORM, migrations, logins, forms, templates and an admin site where non-developers can edit data. For JSON APIs you add Django REST Framework, or Django Ninja, which feels like FastAPI.</li>
    <li><strong>Flask</strong> gives you routing and leaves the rest to extensions, like Express. Many existing services use it, and FastAPI borrowed its decorator style.</li>
    <li>In FastAPI, a function parameter that isn’t in the path is a query parameter: <code>limit: int = 10</code> replaces <code>Number(req.query.limit ?? 10)</code>, with validation included.</li>
    <li>None of them has <code>app.listen()</code>. A separate server process runs your app: uvicorn for FastAPI, gunicorn for Django and Flask. Lesson 11.1 shows how.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth plain">
      <thead><tr><th>You need</th><th>In Node</th><th>In Python</th></tr></thead>
      <tbody>
        <tr class="diff"><td>A JSON API for a front end</td><td>Express or NestJS, plus Zod</td><td>FastAPI</td></tr>
        <tr><td>A database, logins and admin screens</td><td>AdonisJS, or Next.js with Prisma and an auth library</td><td>Django</td></tr>
        <tr><td>A small service, or one that already exists</td><td>Express</td><td>Flask</td></tr>
        <tr><td>Validation</td><td>Zod</td><td>Pydantic (built into FastAPI)</td></tr>
        <tr><td>An ORM</td><td>Prisma, TypeORM</td><td>SQLAlchemy, or Django’s own ORM</td></tr>
        <tr><td>The server process</td><td>node</td><td>uvicorn, gunicorn</td></tr>
      </tbody>
    </table></div>
    <figcaption>When nothing else decides it, FastAPI is the default for a new JSON API.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>In Express the request is a parameter: <code>(req, res) =&gt;</code>. In Flask it’s an import: <code>from flask import request</code>, then <code>request.args["q"]</code> inside the view. It looks like one global shared by every request, but Flask gives each request its own. FastAPI avoids the surprise: you declare what you need as parameters.</p></aside>
  <h2>Pick for the part you don’t want to build</h2>
  <p>If a TypeScript front end needs a typed JSON contract, start by testing one FastAPI endpoint and inspecting its OpenAPI schema. If staff also need to edit relational records, try registering a model in Django’s admin before building a separate admin UI. If you’re extending a small Flask service with conventions your team already knows, a migration may cost more than it saves.</p>
  <p>When the choice isn’t obvious, prototype the hardest requirement first. A hello-world route won’t tell you how much of authentication, migrations or validation you’ll need to maintain yourself.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="35-1" data-manual><p class="task-text">Pick FastAPI, Django or Flask for three projects, and say why: a JSON API for a React app, an internal tool with logins and admin screens, and two new endpoints in an existing Flask service.</p>
      <details><summary>Solution</summary><p>FastAPI for the React API (typed models and generated docs), Django for the internal tool (its admin site gives you the editing screens almost for free), and Flask for the existing service: add the endpoints where the code already lives.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="35-2"><p class="task-text">Translate an Express search handler to FastAPI: <code>GET /items/search?q=lamp&amp;limit=2&amp;max_price=50</code>, with <code>q</code> required, <code>limit</code> between 1 and 50, and <code>max_price</code> optional.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from typing import Annotated
from fastapi import Query

@app.get("/items/search")
def search_items(
    q: str,
    limit: Annotated[int, Query(ge=1, le=50)] = 10,
    max_price: float | None = None,
) -&gt; list[Item]:
    matches = [item for item in ITEMS if q.lower() in item.name.lower()]
    if max_price is not None:
        matches = [item for item in matches if item.price &lt;= max_price]
    return matches[:limit]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="35-3" data-manual><p class="task-text">Run your search API with <code>uv run fastapi dev</code>, open <code>/openapi.json</code>, and find the <code>Item</code> schema, the limits on <code>limit</code> and the 422 response FastAPI documented for you.</p>
      <details><summary>Solution</summary><p>The <code>Item</code> schema is under <code>components.schemas</code>. The <code>limit</code> parameter has <code>"minimum": 1</code>, <code>"maximum": 50</code> and <code>"default": 10</code>, and the 422 response is listed under <code>responses</code>. All of it comes from your type hints, so it can’t drift out of date.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="36" data-section="10" data-title="A real FastAPI service" data-summary="Routers, dependency injection with Depends, API keys and error handlers: NestJS structure in FastAPI.">
  <p class="lead">Lesson 10.1 put every route in one file. A real service splits routes into routers, injects what each route needs, and turns domain errors into HTTP responses in one place. If you know NestJS, you know the ideas. FastAPI just uses plain functions for them.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (NestJS)</div><pre><code class="language-typescript">@Injectable()
export class ApiKeyGuard implements CanActivate {
  canActivate(ctx: ExecutionContext) {
    const req = ctx.switchToHttp().getRequest();
    return req.headers["x-api-key"] === API_KEY;
  }
}

@Controller("notes")
@UseGuards(ApiKeyGuard)
export class NotesController {
  constructor(private readonly notes: NotesService) {}

  @Get(":id")
  findOne(@Param("id", ParseIntPipe) id: number) {
    return this.notes.findOne(id);
  }
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (FastAPI)</div><pre><code class="language-python">from typing import Annotated
from fastapi import (
    APIRouter, Depends, FastAPI, Header, HTTPException,
)

def require_api_key(
    x_api_key: Annotated[str | None, Header()] = None,
) -&gt; None:
    if x_api_key != API_KEY:
        raise HTTPException(status_code=401)

def get_notes() -&gt; NotesService:
    return notes_service

router = APIRouter(
    prefix="/notes",
    dependencies=[Depends(require_api_key)],
)

@router.get("/{note_id}")
def find_one(
    note_id: int,
    notes: Annotated[NotesService, Depends(get_notes)],
) -&gt; Note:
    return notes.find_one(note_id)

app = FastAPI()
app.include_router(router)</code></pre></div>
  </div>
  <p class="run">In a real project the router lives in its own file, such as <code>routers/notes.py</code>, and <code>main.py</code> imports it and calls <code>include_router</code>.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>APIRouter</code> is an Express <code>Router</code> or a Nest module: it groups routes under a prefix, and <code>app.include_router()</code> mounts it. Including copies the routes at that moment, so register them first.</li>
    <li><code>Depends(fn)</code> is dependency injection with plain functions. FastAPI calls <code>fn</code> for each request, and <code>fn</code> can ask for headers, query parameters or other dependencies itself. There’s no container and no <code>@Injectable</code>.</li>
    <li>A guard is just a dependency that raises. Put it on one route, on a router (<code>dependencies=[...]</code>) or on the whole app.</li>
    <li>A dependency that uses <code>yield</code> runs setup before the route and cleanup after it, like the context managers in lesson 28. It’s the usual way to open and close a database session per request.</li>
    <li>Tests swap dependencies with <code>app.dependency_overrides[get_notes] = lambda: FakeNotes()</code>, the equivalent of <code>overrideProvider</code> in Nest’s testing module.</li>
    <li><code>@app.exception_handler(NoteNotFound)</code> turns a domain error into a response for every route, like a Nest exception filter or Express error middleware.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 210" role="img" aria-label="A request goes through the router, then its dependencies, then your function, and comes back as JSON. A failing dependency returns 401 before your function runs. In tests, dependency_overrides replaces a dependency.">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-ts" x="10" y="40" width="96" height="54" rx="8"/><text class="small" x="58" y="72" text-anchor="middle">request</text>
      <path class="arrow" d="M106,67 L122,67"/>
      <rect class="box" x="126" y="40" width="112" height="54" rx="8"/><text class="small" x="182" y="62" text-anchor="middle">APIRouter</text><text class="mono-s" x="182" y="80" text-anchor="middle">/notes</text>
      <path class="arrow" d="M238,67 L254,67"/>
      <rect class="box-py" x="258" y="40" width="150" height="54" rx="8"/><text class="mono-s" x="333" y="62" text-anchor="middle">require_api_key</text><text class="mono-s" x="333" y="80" text-anchor="middle">get_notes</text>
      <path class="arrow" d="M408,67 L424,67"/>
      <rect class="box" x="428" y="40" width="112" height="54" rx="8"/><text class="small" x="484" y="72" text-anchor="middle">your function</text>
      <path class="arrow" d="M540,67 L556,67"/>
      <rect class="box-ok" x="560" y="40" width="72" height="54" rx="8"/><text class="small" x="596" y="72" text-anchor="middle">JSON</text>
      <text class="small muted" x="333" y="28" text-anchor="middle">Depends(...)</text>
      <path class="arrow-warn" d="M300,94 L300,140"/>
      <rect class="box-warn" x="214" y="144" width="172" height="48" rx="8"/><text class="small" x="300" y="173" text-anchor="middle">401, function never runs</text>
      <path class="rule" d="M440,144 L380,94"/>
      <rect class="box-ts" x="410" y="144" width="222" height="48" rx="8"/><text class="mono-s" x="521" y="164" text-anchor="middle">dependency_overrides</text><text class="small" x="521" y="182" text-anchor="middle">tests swap get_notes</text>
    </svg></div>
    <figcaption>Dependencies run before your function. A guard that raises stops the request, and tests can replace any dependency without touching the routes.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Write <code>Depends(get_notes)</code>, not <code>Depends(get_notes())</code>. You pass the function, and FastAPI calls it for every request. Calling it yourself runs it once at import time and hands FastAPI the result instead of a function, which fails with an error that doesn’t point at the real mistake.</p></aside>
  <h2>Inject a value or enforce a rule</h2>
  <p>Use a parameter such as <code>notes: Annotated[NotesRepository, Depends(get_notes)]</code> when the handler needs the returned object. To run a check without passing its return value into the handler, use <code>dependencies=[Depends(require_access)]</code> on the route or router. Both forms run the dependency before the handler and can stop the request by raising <code>HTTPException</code>.</p>
  <p>In tests, override the dependency using the original function as the key. Remove that override afterward so it can’t affect later tests. Pair a <code>yield</code> dependency’s setup with <code>try</code>/<code>finally</code> when it owns a resource that must be closed.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="36-1"><p class="task-text">Write a <code>require_api_key</code> dependency that reads the <code>X-API-Key</code> header and answers 401 unless it matches, and use it to protect <code>GET /private</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def require_api_key(
    x_api_key: Annotated[str | None, Header()] = None,
) -&gt; None:
    if x_api_key != API_KEY:
        raise HTTPException(status_code=401, detail="invalid or missing API key")

@app.get("/private", dependencies=[Depends(require_api_key)])
def private() -&gt; dict[str, str]:
    return {"message": "you have the key"}</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="36-2"><p class="task-text">Build a notes <code>APIRouter</code> with list, get and create routes that reach the store through <code>Depends(get_store)</code>, so a test can swap in its own store.</p>
      <details><summary>Solution</summary><pre><code class="language-python">Store = Annotated[NotesStore, Depends(get_store)]
router = APIRouter(prefix="/notes")

@router.get("")
def list_notes(store: Store) -&gt; list[Note]:
    return store.all()

@router.get("/{note_id}")
def get_note(note_id: int, store: Store) -&gt; Note:
    note = store.get(note_id)
    if note is None:
        raise HTTPException(status_code=404, detail="note not found")
    return note

@router.post("", status_code=201)
def create_note(data: NoteIn, store: Store) -&gt; Note:
    return store.add(data.text)

app.include_router(router)

# in a test
app.dependency_overrides[get_store] = lambda: NotesStore()</code></pre></details>

<template class="lesson" data-n="37" data-section="11" data-title="Shipping a web service" data-summary="Settings from the environment, logging, uvicorn in Docker, and a typed TypeScript client from OpenAPI.">
  <p class="lead">Getting a service into production looks almost the same as in Node: read the configuration from the environment, log every request, add a health check and put it in a container. The one new step is that you don’t start the server yourself. A server process like uvicorn runs your app.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (Node)</div><pre><code class="language-typescript">// config.ts: parse process.env once, fail fast
import { z } from "zod";

export const config = z.object({
  DATABASE_URL: z.string(),
  PORT: z.coerce.number().default(8000),
}).parse(process.env);

// server.ts
import pino from "pino";
const log = pino();

app.use((req, res, next) =&gt; {
  res.on("finish", () =&gt;
    log.info(`${req.method} ${req.path} ${res.statusCode}`)
  );
  next();
});

app.listen(config.PORT, "0.0.0.0");</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (FastAPI)</div><pre><code class="language-python"># settings.py: parse the environment once, fail fast
from pydantic_settings import (
    BaseSettings, SettingsConfigDict,
)

class Settings(BaseSettings):
    model_config = SettingsConfigDict(
        env_prefix="NOTES_",
    )
    database_url: str
    port: int = 8000

settings = Settings()

# main.py
import logging
logger = logging.getLogger("notes.access")

@app.middleware("http")
async def log_requests(request, call_next):
    response = await call_next(request)
    logger.info("%s %s %d", request.method,
                request.url.path,
                response.status_code)
    return response

# no app.listen(): the server command runs the app
# uvicorn main:app --host 0.0.0.0 --port 8000</code></pre></div>
  </div>
  <p class="run">In development, <code>uv run fastapi dev main.py</code> reloads on every change. In a container, start it with <code>uvicorn main:app --host 0.0.0.0 --port 8000</code>.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>BaseSettings</code> is a Pydantic model filled from environment variables, with the same types and validation as lesson 13. It validates when instantiated. Wrap it in an <code>@lru_cache</code> function and inject that function with <code>Depends</code> so tests can override it.</li>
    <li>Logging is in the standard library. Each module gets <code>logging.getLogger(__name__)</code>, and the app configures it once at startup. Pass values as arguments (<code>logger.info("%s", path)</code>) rather than as an f-string. For JSON logs like pino, add structlog.</li>
    <li><code>@app.middleware("http")</code> wraps every request like Express middleware. Code before <code>await call_next(request)</code> runs before the route, and code after it sees the response.</li>
    <li>There’s no <code>app.listen()</code>. uvicorn imports your <code>app</code> object and serves it. <code>--workers 4</code> runs several processes like pm2 or <code>cluster</code>, but in containers you usually run one process each and scale the containers.</li>
    <li>The Docker image is <code>python:3.15-slim</code> plus <code>uv sync --frozen</code>, the <code>npm ci</code> of uv. Copy <code>pyproject.toml</code> and <code>uv.lock</code> before your code so Docker caches the install.</li>
    <li>FastAPI’s <code>/openapi.json</code> is a contract your front end can compile against. <code>openapi-typescript</code> generates TypeScript types from it, so a renamed field becomes a <code>tsc</code> error instead of a bug in production.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 640 200" role="img" aria-label="Pydantic models become the OpenAPI schema, openapi-typescript turns it into api.d.ts, and the front end calls the API with typed fetch. When the API changes, tsc reports an error.">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-py" x="10" y="40" width="108" height="54" rx="8"/><text class="small" x="64" y="62" text-anchor="middle">Pydantic</text><text class="small" x="64" y="80" text-anchor="middle">models</text>
      <path class="arrow" d="M118,67 L134,67"/>
      <rect class="box" x="138" y="40" width="108" height="54" rx="8"/><text class="mono-s" x="192" y="72" text-anchor="middle">openapi.json</text>
      <path class="arrow" d="M246,67 L262,67"/>
      <rect class="box" x="266" y="40" width="108" height="54" rx="8"/><text class="mono-s" x="320" y="62" text-anchor="middle">openapi-</text><text class="mono-s" x="320" y="80" text-anchor="middle">typescript</text>
      <path class="arrow" d="M374,67 L390,67"/>
      <rect class="box-ts" x="394" y="40" width="108" height="54" rx="8"/><text class="mono-s" x="448" y="72" text-anchor="middle">api.d.ts</text>
      <path class="arrow" d="M502,67 L518,67"/>
      <rect class="box-ts" x="522" y="40" width="110" height="54" rx="8"/><text class="small" x="577" y="62" text-anchor="middle">typed fetch</text><text class="small" x="577" y="80" text-anchor="middle">in React</text>
      <text class="small muted" x="64" y="28" text-anchor="middle">back end</text><text class="small muted" x="577" y="28" text-anchor="middle">front end</text>
      <path class="arrow-warn" d="M448,94 L448,136"/>
      <rect class="box-warn" x="338" y="140" width="220" height="46" rx="8"/><text class="small" x="448" y="168" text-anchor="middle">tsc error when the API changes</text>
    </svg></div>
    <figcaption>The front end’s types come from the same Pydantic models that validate requests, so the two sides can’t silently drift apart.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Inside a container, a server bound to <code>127.0.0.1</code> only accepts connections from inside that same container, so <code>docker run -p 8000:8000</code> seems to do nothing. Bind to <code>0.0.0.0</code>, as you would with <code>app.listen(port, "0.0.0.0")</code>. <code>fastapi run</code> does this by default. <code>uvicorn</code> doesn’t, so pass <code>--host 0.0.0.0</code>.</p></aside>
  <h2>Validate configuration before serving traffic</h2>
  <p><code>BaseSettings</code> validates when you instantiate it. Caching <code>get_settings()</code> avoids parsing on every request, but it doesn’t make that function run at startup. If it’s only used as a lazy dependency, the first request that needs it discovers any missing setting.</p>
  <p>Call the settings factory during app startup (for example, in FastAPI’s lifespan setup) when invalid configuration should prevent the service from starting. Supply deployment values through the environment instead of baking them into the image, and report which setting needs attention without logging secret values.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="37-1"><p class="task-text">Write a <code>Settings</code> class that reads <code>NOTES_DATABASE_URL</code> (required), <code>NOTES_DEBUG</code>, <code>NOTES_PORT</code> and <code>NOTES_ALLOWED_ORIGINS</code> from the environment, with types and defaults.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    model_config = SettingsConfigDict(env_prefix="NOTES_")

    database_url: str
    debug: bool = False
    port: int = 8000
    allowed_origins: list[str] = []   # NOTES_ALLOWED_ORIGINS='["http://localhost:5173"]'</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="37-2"><p class="task-text">Add a middleware that logs one line per request, like <code>GET /health 200 1.3ms</code>, and a <code>GET /health</code> endpoint that returns the status and version.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@app.middleware("http")
async def log_requests(request: Request, call_next) -&gt; Response:
    start = time.perf_counter()
    response = await call_next(request)
    elapsed_ms = (time.perf_counter() - start) * 1000
    logger.info("%s %s %d %.1fms", request.method, request.url.path,
                response.status_code, elapsed_ms)
    return response

@app.get("/health")
def health() -&gt; dict[str, str]:
    return {"status": "ok", "version": VERSION}</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="37-3" data-manual><p class="task-text">Put the notes service in a Docker image, run it, and generate a typed TypeScript client from its <code>/openapi.json</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-bash"># Dockerfile
FROM python:3.15-slim
COPY --from=ghcr.io/astral-sh/uv:0.13.5 /uv /uvx /bin/
WORKDIR /app
COPY pyproject.toml uv.lock ./
RUN uv sync --frozen --no-dev --no-install-project
COPY . .
CMD ["uv", "run", "--no-sync", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

# then, in the front-end project
npx openapi-typescript http://localhost:8000/openapi.json -o src/api.d.ts</code></pre></details>

  </ol>
</template>

<template class="lesson" data-n="38" data-section="11" data-title="Command-line tools with Typer" data-summary="Type hints become arguments, options and --help, with none of the parsing code.">
  <p class="lead">Python is a great language for the small tools every team needs: scripts, migrations, admin commands. Typer reads a function’s signature and builds the command line from it, so the type hints you already write become arguments, options and help text.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (Node’s util.parseArgs)</div><pre><code class="language-typescript">import { parseArgs } from "node:util";

const { values, positionals } = parseArgs({
  allowPositionals: true,
  options: {
    shout: { type: "boolean", default: false },
    times: { type: "string", default: "1" },
  },
});

const name = positionals[0];
if (!name) throw new Error("name is required");

let msg = `Hello, ${name}!`;
if (values.shout) msg = msg.toUpperCase();
const times = Number(values.times);
for (let i = 0; i &lt; times; i++) console.log(msg);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (Typer)</div><pre><code class="language-python">import typer

app = typer.Typer()

@app.command()
def greet(
    name: str, shout: bool = False, times: int = 1
) -&gt; None:
    """Greet someone."""
    message = f"Hello, {name}!"
    if shout:
        message = message.upper()
    for _ in range(times):
        typer.echo(message)

if __name__ == "__main__":
    app()</code></pre></div>
  </div>
  <p class="run">Run <code>uv add typer</code>, then <code>uv run greet.py Ada --shout --times 2</code> and <code>uv run greet.py --help</code>.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Node’s built-in <code>util.parseArgs</code> only splits the command line: options arrive as strings, and checking required arguments and writing <code>--help</code> is up to you. The npm package commander does more, but you still describe every option by hand.</li>
    <li>In Typer the signature is the spec. A parameter without a default is an argument, one with a default is an <code>--option</code>, and a <code>bool</code> becomes a <code>--shout</code>/<code>--no-shout</code> flag. Values are converted and checked: <code>--times abc</code> exits with an error before your code runs.</li>
    <li>The docstring becomes the <code>--help</code> text. You never write the usage message yourself.</li>
    <li>Several <code>@app.command()</code> functions become subcommands, like <code>git commit</code> and <code>git push</code>. Underscores in function names become hyphens: <code>count_rows</code> is <code>count-rows</code>.</li>
    <li><code>raise typer.Exit(code=1)</code> sets the exit code, and <code>typer.echo(msg, err=True)</code> writes to stderr. Wrong usage exits with code 2, like most Unix tools.</li>
    <li><code>[project.scripts]</code> in <code>pyproject.toml</code> is the <code>"bin"</code> field of <code>package.json</code>: <code>greet = "mytool.cli:app"</code> installs a <code>greet</code> command. <code>uvx</code> runs published tools the way <code>npx</code> does.</li>
    <li><code>typer.testing.CliRunner</code> runs a command inside the test process and gives you the exit code and output, with no subprocess.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Node (util.parseArgs)</th><th>Typer</th></tr></thead>
      <tbody>
        <tr><td>positionals[0], checked by hand</td><td><code>name: str</code> (required automatically)</td></tr>
        <tr><td>times: { type: "string", default: "1" }, then Number()</td><td><code>times: int = 1</code> (converted and validated)</td></tr>
        <tr><td>shout: { type: "boolean" }</td><td><code>shout: bool = False</code></td></tr>
        <tr><td>a hand-written usage message</td><td><code>--help</code> from the docstring</td></tr>
        <tr><td>if (positionals[0] === "add")</td><td><code>@app.command()</code> on <code>def add(...)</code></td></tr>
        <tr><td>console.error(msg)</td><td><code>typer.echo(msg, err=True)</code></td></tr>
        <tr><td>process.exit(1)</td><td><code>raise typer.Exit(code=1)</code></td></tr>
        <tr><td>"bin" in package.json</td><td><code>[project.scripts]</code> in pyproject.toml</td></tr>
        <tr><td>npx some-tool</td><td><code>uvx some-tool</code></td></tr>
      </tbody>
    </table></div>
    <figcaption>Everything you’d parse, convert and check by hand in Node, Typer reads from the function signature.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>With a single <code>@app.command()</code>, Typer runs it directly: <code>greet.py Ada</code>. Add a second command and the first one suddenly needs its name: <code>greet.py greet Ada</code>. Scripts and docs that used the old form break. If a tool might grow, give it subcommands from the start.</p></aside>
  <h2>Make output usable by scripts</h2>
  <p>Write successful results to stdout so callers can pipe them into another program. Send diagnostics to stderr with <code>typer.echo(message, err=True)</code>. If a command can’t complete, <code>raise typer.Exit(code=1)</code> signals failure without mixing the error into the data stream.</p>
  <p>Test both sides with <code>CliRunner</code>: assert on the result’s exit code and stdout for a valid invocation, and on the nonzero code and stderr for an invalid one. That checks the contract a shell script depends on, not just the words a human sees.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="38-1"><p class="task-text">Turn <code>greet(name, shout=False, times=1)</code> into a command that prints <code>Hello, Ada!</code>, in capitals with <code>--shout</code> and repeated with <code>--times</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@app.command()
def greet(name: str, shout: bool = False, times: int = 1) -&gt; None:
    message = f"Hello, {name}!"
    if shout:
        message = message.upper()
    for _ in range(times):
        typer.echo(message)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="38-2"><p class="task-text">Build a calculator with <code>add</code> and <code>divide</code> subcommands. Dividing by zero prints an error to stderr and exits with code 1.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@app.command()
def add(a: float, b: float) -&gt; None:
    typer.echo(f"{a + b:g}")

@app.command()
def divide(a: float, b: float) -&gt; None:
    if b == 0:
        typer.echo("Error: can't divide by zero", err=True)
        raise typer.Exit(code=1)
    typer.echo(f"{a / b:g}")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="38-3"><p class="task-text">Write a command that counts the rows of a CSV file, or the distinct values of one column with <code>--column</code>. Let Typer reject paths that don’t exist.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@app.command()
def count_rows(
    path: Annotated[Path, typer.Argument(exists=True, dir_okay=False)],
    column: str | None = None,
) -&gt; None:
    with path.open(newline="", encoding="utf-8") as file:
        reader = csv.DictReader(file)
        rows = list(reader)
        headers = reader.fieldnames or []
    if column is None:
        typer.echo(f"{len(rows)} row" + ("" if len(rows) == 1 else "s"))
        return
    if column not in headers:
        typer.echo(f"Error: no column named {column}", err=True)
        raise typer.Exit(code=1)
    typer.echo(f"{len({row[column] for row in rows})} distinct values in {column}")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="39" data-section="12" data-title="Data work with pandas" data-summary="DataFrames, column arithmetic and groupby: the part of Python with no real TypeScript equivalent.">
  <p class="lead">Sooner or later someone hands you a CSV export and asks for numbers. In TypeScript that means arrays of objects and a chain of <code>reduce</code> calls. In Python it means pandas: you work with whole columns at once, and grouping and totals take one line each.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const orders = parse(csvText, {
  columns: true,
  cast: true,
});

const byRegion = Object.groupBy(orders, (o) =&gt; o.region);

const totals = Object.entries(byRegion)
  .map(([region, rows]) =&gt; ({
    region,
    revenue: rows!.reduce(
      (sum, o) =&gt; sum + o.price * o.qty, 0),
  }))
  .sort((a, b) =&gt; b.revenue - a.revenue);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (pandas)</div><pre><code class="language-python">import pandas as pd

orders = pd.read_csv("orders.csv")
orders["revenue"] = orders["price"] * orders["qty"]

totals = (
    orders.groupby("region")["revenue"]
    .sum()
    .sort_values(ascending=False)
)
print(totals)</code></pre></div>
  </div>
  <p class="run">Run <code>uv add pandas</code>. To explore data, open a notebook with <code>uv run --with jupyter jupyter lab</code>: every cell shows its result as a table.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li>A DataFrame is a table stored column by column, not an array of objects. <code>orders["price"]</code> is a whole column, called a Series.</li>
    <li>Operations are vectorized: <code>orders["price"] * orders["qty"]</code> multiplies every row at once, in fast compiled code. Loops over rows (<code>for</code>, <code>iterrows</code>, <code>apply</code>) are slow and almost never needed.</li>
    <li>Filtering uses a boolean mask: <code>orders[orders["qty"] &gt;= 3]</code> instead of <code>.filter(...)</code>.</li>
    <li>Most methods return a new DataFrame: <code>assign</code>, <code>sort_values</code>, <code>groupby(...).sum()</code>. Assigning to a column, as in <code>orders["revenue"] = ...</code>, changes the DataFrame in place.</li>
    <li>Jupyter notebooks mix code, tables and charts in one document, and they’re where most data work in Python happens. Observable is the nearest thing in the JavaScript world.</li>
    <li>Polars is a newer and faster DataFrame library with a stricter API, worth a look for large files. Both build on the same idea of whole-column operations.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Array of objects</th><th>pandas DataFrame</th></tr></thead>
      <tbody>
        <tr><td>rows.length</td><td><code>len(df)</code></td></tr>
        <tr><td>rows.filter(o =&gt; o.qty &gt;= 3)</td><td><code>df[df["qty"] &gt;= 3]</code></td></tr>
        <tr><td>rows.map(o =&gt; ({...o, total: o.price * o.qty}))</td><td><code>df.assign(total=df["price"] * df["qty"])</code></td></tr>
        <tr><td>rows.reduce((s, o) =&gt; s + o.qty, 0)</td><td><code>df["qty"].sum()</code></td></tr>
        <tr><td>Object.groupBy(rows, o =&gt; o.region)</td><td><code>df.groupby("region")</code></td></tr>
        <tr><td>rows.sort((a, b) =&gt; b.qty - a.qty)</td><td><code>df.sort_values("qty", ascending=False)</code></td></tr>
        <tr><td>rows.slice(0, 5)</td><td><code>df.head(5)</code></td></tr>
        <tr><td>JSON.stringify(rows)</td><td><code>df.to_json(orient="records")</code></td></tr>
      </tbody>
    </table></div>
    <figcaption>Each array method has a column-wise equivalent that works on the whole table at once.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>In TypeScript you’d write <code>o.qty &gt;= 3 &amp;&amp; o.region === "EU"</code>. In pandas, <code>(df["qty"] &gt;= 3) and (df["region"] == "EU")</code> raises <em>The truth value of a Series is ambiguous</em>, because <code>and</code> wants a single True or False, not a column of them. Use <code>&amp;</code>, <code>|</code> and <code>~</code>, and keep the parentheses, since <code>&amp;</code> binds tighter than <code>==</code>.</p></aside>
  <h2>Group rows and name the result</h2>
  <p>Think of <code>groupby()</code> as building buckets with a TypeScript <code>Map</code>, then running an aggregation on each bucket. Name the aggregated column so downstream code doesn’t have to guess what it means.</p>
  <pre><code class="language-python">import pandas as pd

orders = pd.DataFrame({"region": ["EU", "US", "EU"], "qty": [2, 1, 3]})
summary = orders.groupby("region", as_index=False).agg(
    units=("qty", "sum"),
)
print(summary.to_dict("records"))
# [{'region': 'EU', 'units': 5}, {'region': 'US', 'units': 1}]</code></pre>
  <p><code>as_index=False</code> keeps the group key as a column. By default, pandas drops rows whose group key is missing. Use <code>dropna=False</code> when totals must include an “unknown region” group.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="39-1"><p class="task-text">Return a copy of an orders DataFrame with a new <code>revenue</code> column (<code>price * qty</code>), without changing the original and without a loop.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def add_revenue(orders: pd.DataFrame) -&gt; pd.DataFrame:
    return orders.assign(revenue=orders["price"] * orders["qty"])</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="39-2"><p class="task-text">Return the orders in one region with a quantity of at least <code>min_qty</code>, combining two masks.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def big_orders(orders: pd.DataFrame, region: str, min_qty: int) -&gt; pd.DataFrame:
    return orders[(orders["region"] == region) &amp; (orders["qty"] &gt;= min_qty)]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="39-3"><p class="task-text">Read an orders CSV and return the total revenue per region as a dict, highest first.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def revenue_by_region(csv_path: str) -&gt; dict[str, float]:
    orders = pd.read_csv(csv_path).assign(revenue=lambda df: df["price"] * df["qty"])
    totals = orders.groupby("region")["revenue"].sum().sort_values(ascending=False)
    return totals.to_dict()</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="40" data-section="13" data-title="Where to go next" data-summary="An npm-to-Python phrasebook, habits to unlearn, and how to keep learning.">
  <p class="lead">You can now read and write Python, test it, and ship a web service. This last lesson is a map: which Python package replaces each npm package you reach for, which habits to watch for, and what to read next.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript (package.json)</div><pre><code class="language-typescript">{
  "dependencies": {
    "express": "^5.0.0",
    "zod": "^3.23.0",
    "@prisma/client": "^6.0.0",
    "axios": "^1.7.0",
    "pino": "^9.0.0",
    "commander": "^12.0.0",
    "dotenv": "^16.4.0"
  },
  "devDependencies": {
    "vitest": "^2.0.0",
    "eslint": "^9.0.0",
    "prettier": "^3.3.0",
    "typescript": "^5.6.0"
  }
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python (pyproject.toml)</div><pre><code class="language-toml">[project]
dependencies = [
    "fastapi",            # express
    "pydantic",           # zod
    "sqlalchemy",         # prisma
    "httpx",              # axios
    "structlog",          # pino
    "typer",              # commander
    "pydantic-settings",  # dotenv
]

[dependency-groups]
dev = [
    "pytest",  # vitest
    "ruff",    # eslint + prettier
    "mypy",    # typescript (tsc)
]</code></pre></div>
  </div>
  <p class="run">Version numbers are left out on the Python side: <code>uv add</code> fills them in, and <code>uv.lock</code> pins the exact versions.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Check the standard library before PyPI. Dates, paths, JSON, CSV, SQLite, logging, HTTP and command-line parsing are all built in, and much of what you’d install lodash for lives in <code>itertools</code>, <code>collections</code> and <code>functools</code>.</li>
    <li>Each job usually has one standard tool. pytest, ruff and uv are close to universal, so there’s less to choose than on npm.</li>
    <li>Type hints are only checked when you run a checker. Keep mypy (or pyright, the checker inside VS Code’s Pylance) in CI, or the hints quietly go out of date.</li>
    <li>The official docs are the best source. The tutorial and library reference on <code>docs.python.org</code> are reliable and well written, and PEP 8 is the style guide that ruff enforces.</li>
    <li>A new Python version comes out every October. Stay on a supported one: <code>uv python install 3.13</code> is all it takes to try the next.</li>
    <li>Some libraries have separate sync and async APIs (httpx’s <code>Client</code> and <code>AsyncClient</code>, SQLAlchemy’s sessions). Pick one style per project and stick to it.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>npm</th><th>Python</th></tr></thead>
      <tbody>
        <tr><td>express, nestjs</td><td><code>fastapi</code>, <code>django</code>, <code>flask</code> (lesson 10.4)</td></tr>
        <tr><td>zod</td><td><code>pydantic</code> (lesson 3.5)</td></tr>
        <tr><td>prisma, typeorm</td><td><code>sqlalchemy</code> + <code>alembic</code> for migrations (lesson 10.2)</td></tr>
        <tr><td>axios, fetch</td><td><code>httpx</code></td></tr>
        <tr><td>jest, vitest</td><td><code>pytest</code> (lesson 6.1)</td></tr>
        <tr><td>eslint, prettier</td><td><code>ruff</code> (lesson 5.3)</td></tr>
        <tr><td>tsc</td><td><code>mypy</code>, <code>pyright</code> (lesson 5.3)</td></tr>
        <tr><td>nodemon</td><td><code>fastapi dev</code>, <code>uvicorn --reload</code></td></tr>
        <tr><td>dotenv</td><td><code>pydantic-settings</code> (lesson 11.1)</td></tr>
        <tr><td>pino, winston</td><td><code>logging</code>, <code>structlog</code></td></tr>
        <tr><td>commander, yargs</td><td><code>typer</code>, <code>argparse</code> (lesson 11.4)</td></tr>
        <tr><td>lodash</td><td><code>itertools</code>, <code>collections</code>, <code>functools</code></td></tr>
        <tr><td>date-fns, dayjs</td><td><code>datetime</code>, <code>zoneinfo</code></td></tr>
        <tr><td>bullmq</td><td><code>celery</code>, <code>rq</code>, <code>arq</code></td></tr>
        <tr><td>playwright</td><td><code>playwright</code> (the same tool, with a Python API)</td></tr>
        <tr><td>npx, nvm</td><td><code>uvx</code>, <code>uv python</code> (lesson 5.2)</td></tr>
      </tbody>
    </table></div>
    <figcaption>A phrasebook for your first real projects. Where a lesson covers the tool, it’s listed.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>The most common habit to unlearn is writing TypeScript in Python syntax: index loops, getters and setters, a class around a single function, <code>== None</code>. The code works, but it reads like a translation. Ruff catches some of it. Re-read lessons 2.1 to 2.4 and 7.1 to 7.4 after your first real project: they make more sense the second time.</p></aside>
  <h2>Put the pieces together in one project</h2>
  <p>Pick a task you already do manually. For example, build a <a href="#lesson-38">Typer command</a> that reads a CSV, validates each row, and writes a summary. Start with functions that take data and return data. Keep file I/O and command-line parsing at the edges, then <a href="#lesson-22">test</a> a valid row, a rejected row, and an empty file without running the whole CLI each time.</p>
  <p>Once that works, add an API only if another program needs the same functionality. Keep the existing parsing and summarizing functions and let <a href="#lesson-33">FastAPI</a> handle HTTP. This gives you practice deciding what belongs in plain Python and what belongs in the framework.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="40-1" data-manual><p class="task-text">Build one small service end to end: a notes API with SQLAlchemy, settings from the environment, an API key, tests that swap the database, clean ruff and mypy runs, and a Dockerfile.</p>
      <details><summary>Solution</summary><p>The reference answer in <code>solutions/40-where-to-go-next/ex40_1_capstone.md</code> walks through one layout: <code>settings.py</code>, <code>db.py</code> with a <code>yield</code> session dependency, a router, and tests that override the session with an in-memory SQLite database.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="40-2" data-manual><p class="task-text">Port something small that your team already has in TypeScript, such as a script or one endpoint. Note which packages you replaced and every place you caught yourself writing TypeScript in Python.</p>
      <details><summary>Solution</summary><p>There’s no single answer. Data shaping, file handling and scripts usually get shorter. Code that leans on advanced TypeScript types usually gets simpler types. Check your port for index loops, <code>== None</code>, mutable defaults and one-method classes, then run ruff and mypy on it.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="40-3" data-manual><p class="task-text">Open the installed libraries (<code>.venv/lib/python3.15/site-packages/</code> on macOS and Linux, <code>.venv\Lib\site-packages\</code> on Windows), pick a library the course used, and find three things from the course in its source.</p>
      <details><summary>Solution</summary><p>For example, <code>fastapi/routing.py</code> shows that <code>router.get(...)</code> returns a decorator (lesson 7.3), <code>typer/main.py</code> builds commands by inspecting function signatures, and SQLAlchemy’s <code>Session</code> defines <code>__enter__</code> and <code>__exit__</code> (lesson 7.4), which is why <code>with Session(engine) as session:</code> works.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="architecture" data-section="13" data-title="Structuring a large codebase" data-summary="src layout, uv workspaces, import cycles and enforceable dependency layers.">
  <p class="lead">A Python project can start as a few files, like a TypeScript project. As it grows, package boundaries and import direction matter more than the number of folders.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">function checkout(prices: number[], save: (n: number) =&gt; void) {
  const total = prices.reduce((a, b) =&gt; a + b, 0);
  save(total);
  return total;
}

const saved: number[] = [];
console.log(checkout([10, 20], n =&gt; { saved.push(n); }), saved);
// 30 [30]</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from collections.abc import Callable

def checkout(prices: list[int], save: Callable[[int], None]) -&gt; int:
    total = sum(prices)
    save(total)
    return total

saved: list[int] = []
print(checkout([10, 20], saved.append), saved)  # 30 [30]</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>A <code>src/</code> layout puts importable code under <code>src/shop/</code>, separate from tests and configuration. Install the project in its environment so imports use the package rather than a convenient working directory.</li>
    <li>A uv workspace is like a pnpm workspace: each member has a <code>pyproject.toml</code>, while the workspace shares a lockfile. Declare a member as a dependency and set its source to <code>{ workspace = true }</code>.</li>
    <li>Python executes module bodies on import. Two modules importing each other can see a partially initialized module. Move a shared type to a lower-level module instead of hiding the cycle with scattered imports.</li>
    <li>Keep business rules independent of HTTP and storage. Pass a callable or protocol into the core; the outer layer supplies the database implementation.</li>
    <li><code>import-linter</code> checks dependency contracts, including indirect imports. A layers contract lists the highest layer first and the domain last.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Layer</th><th>May depend on</th><th>Example</th></tr></thead>
      <tbody>
        <tr><td>API</td><td>Application, domain</td><td>HTTP routes</td></tr>
        <tr><td>Application</td><td>Domain</td><td>Use cases</td></tr>
        <tr><td>Domain</td><td>Neither outer layer</td><td>Rules and shared types</td></tr>
      </tbody>
    </table></div>
    <figcaption>Dependencies point inward. An adapter can implement a domain protocol without making the domain import the adapter.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>An import is executable work in Python. If <code>pricing</code> imports <code>inventory</code> while <code>inventory</code> imports a name from <code>pricing</code>, that name may not exist yet. Put the shared model in a third module both can import.</p></aside>
  <h2>Keep imports pointing toward the domain</h2>
  <p>The core below depends only on a protocol. The in-memory adapter stands in for a database, so the same rule can be tested without opening a connection. This is the same dependency-inversion idea used with interfaces in TypeScript.</p>
  <pre><code class="language-python">from typing import Protocol

class Store(Protocol):
    def save(self, total: int) -&gt; None: ...

def checkout(prices: list[int], store: Store) -&gt; int:
    total = sum(prices)
    store.save(total)
    return total

class MemoryStore:
    def __init__(self) -&gt; None:
        self.saved: list[int] = []

    def save(self, total: int) -&gt; None:
        self.saved.append(total)

store = MemoryStore()
print(checkout([10, 20], store), store.saved)  # 30 [30]</code></pre>
  <p>For a workspace, the root project might depend on a member in <code>packages/shop-domain</code>. Each member needs its own project metadata and importable package. Workspace members use one lockfile and compatible Python requirements; they are not isolated environments.</p>
  <pre><code class="language-toml">[project]
name = "shop-api"
version = "0.1.0"
requires-python = "&gt;=3.15"
dependencies = ["shop-domain"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shop-domain = { workspace = true }</code></pre>
  <p>For a single importable <code>shop</code> package, add an import-linter contract like the one in practice, install the tool in your project, and run <code>uv run lint-imports</code>. Check the contract in CI so a future import cannot quietly reverse the dependency direction.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="architecture-1"><p class="task-text">Break the cycle between <code>pricing</code> and <code>inventory</code> by moving their shared <code>Product</code> to <code>models</code>. Both modules must import in either order.</p>
      <details><summary>Hint</summary><p>Let <code>pricing</code> import the model, and let <code>inventory</code> import the model and <code>total</code>.</p></details>
      <details><summary>Solution</summary><p>Move the frozen <code>Product(name, price)</code> dataclass into <code>models.py</code>. Import it from <code>.models</code> in both modules; only <code>inventory</code> imports <code>total</code> from <code>.pricing</code>. The full files are in the reference solution.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="architecture-2"><p class="task-text">Write <code>checkout</code> with an injected save function. Reject an empty list or negative prices before saving; propagate storage errors.</p>
      <details><summary>Hint</summary><p>Validate first, then calculate, call the supplied function once, and return the total.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Callable

def checkout(prices: list[int], save_total: Callable[[int], None]) -&gt; int:
    if not prices or any(price &lt; 0 for price in prices):
        raise ValueError("prices must be nonempty and nonnegative")
    total = sum(prices)
    save_total(total)
    return total</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="architecture-3" data-manual><p class="task-text">Write an import-linter layers contract for <code>shop.api</code>, <code>shop.application</code> and <code>shop.domain</code>, and explain how a workspace member is declared.</p>
      <details><summary>Hint</summary><p>List layers from highest to lowest; a workspace source does not replace the dependency declaration.</p></details>
      <details><summary>Solution</summary><pre><code class="language-toml">[tool.importlinter]
root_package = "shop"

[[tool.importlinter.contracts]]
name = "Dependencies point toward the domain"
type = "layers"
layers = ["shop.api", "shop.application", "shop.domain"]</code></pre>
      <p>Declare the member in <code>dependencies</code> and map it with <code>workspace = true</code> under <code>tool.uv.sources</code>.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

    } else {
      drawer.removeAttribute("role");
      drawer.removeAttribute("aria-modal");
      drawer.removeAttribute("aria-labelledby");
    }
  }

  function closeDrawer() {
    setDrawer(false);
    menuBtn.focus({ preventScroll: true });
  }

  function focusHeading(heading) {
    var target = heading || view.querySelector("h1");
    target.tabIndex = -1;
    target.focus({ preventScroll: true });
  }

  function doneCount() { return lessons.filter(function (l) { return state.lessons[l.n]; }).length; }
  function resumeLesson() {
    var last = lessons.findIndex(function (l) { return l.n === state.lastLesson; });
    return lessons.slice(Math.max(0, last)).find(function (l) { return !state.lessons[l.n]; }) ||
      lessons.find(function (l) { return !state.lessons[l.n]; });
  }

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (text != null) e.textContent = text;
    return e;
  }

  function updateOutline(current) {
    var d = doneCount(), total = lessons.length;
    var progress = document.getElementById("progBar");
    progress.max = total;
    progress.value = d;
    document.getElementById("progText").textContent = d + " of " + total + " lessons complete";
    lessons.forEach(function (l) {
      var a = l.outlineLink;
      var chk = a.querySelector(".check");
      var done = !!state.lessons[l.n];
      chk.hidden = !done;
      if (l === current) {
        a.setAttribute("aria-current", "page");
        a.closest("details").open = true;
      } else {
        a.removeAttribute("aria-current");
      }
    });
  }

  function lessonLink(l) {
    var a = el("a", { href: "#lesson-" + l.n });
    a.appendChild(el("span", { class: "num" }, l.number));
    a.appendChild(el("span", null, l.title));
    var check = el("span", { class: "check", role: "img", "aria-label": "Completed" }, "✓");
    check.hidden = !state.lessons[l.n];
    a.appendChild(check);
    return a;
  }

  function buildOutline() {
    modules.forEach(function (module) {
      var group = el("details", { class: "nav-section" });
      group.open = module.id === "1";
      var summary = el("summary");
      summary.appendChild(el("span", { class: "num" }, module.id));
      summary.appendChild(document.createTextNode(module.name));
      var list = el("ol", { class: "nav-list" });
      module.lessons.forEach(function (l) {
        var item = el("li");
        l.outlineLink = lessonLink(l);
        item.appendChild(l.outlineLink);
        list.appendChild(item);
      });
      group.appendChild(summary);
      group.appendChild(list);
      module.outline = group;
      navList.appendChild(group);
    });
  }

  function filterOutline() {
    var query = search.value.trim().toLowerCase();
    var terms = query ? query.split(/\s+/) : [];
    var count = 0;
    if (query && !expandedBeforeSearch) {
      expandedBeforeSearch = modules.map(function (module) { return module.outline.open; });
    }
    modules.forEach(function (module, i) {
      var any = false;
      module.lessons.forEach(function (l) {
        var description = (l.title + " " + l.summary + " " + l.topics + " " + module.name).toLowerCase();
        var matches = terms.every(function (term) {
          return /^\d+(?:\.\d+)?$/.test(term)
            ? term === l.number || (/^\d+$/.test(term) && Number(term) === Number(l.n))
            : description.includes(term);
        });
        l.outlineLink.parentElement.hidden = !matches;
        if (matches) { any = true; count++; }
      });
      module.outline.hidden = !any;
      if (query) module.outline.open = any;
      else if (expandedBeforeSearch) module.outline.open = expandedBeforeSearch[i];
    });
    if (!query) expandedBeforeSearch = null;
    clearSearch.hidden = search.value === "";
    searchStatus.textContent = !query ? "" : count ? count + (count === 1 ? " lesson found" : " lessons found") : "No lessons found. Try a topic or lesson number.";
  }

  function resetSearch() {
    if (!search.value && !expandedBeforeSearch) return;
    search.value = "";
    filterOutline();
  }

  function highlight() { if (window.Prism && Prism.highlightAllUnder) { try { Prism.highlightAllUnder(view); } catch (e) {} } }

  function renderHome() {
    document.title = "Python for TypeScript developers";
    view.innerHTML = "";
    view.appendChild(document.getElementById("home-tpl").content.cloneNode(true));
    var d = doneCount(), next = resumeLesson();
    var start = document.getElementById("startBtn");
    if (next && (d || state.lastLesson)) {
      start.textContent = "Resume lesson " + next.number;
      start.href = "#lesson-" + next.n;
    } else if (!next) {
      start.textContent = "Review lesson 1.1";
    }
    var homeProg = document.getElementById("homeProg");
    var tasks = lessons.flatMap(function (l) { return Array.from(l.tpl.content.querySelectorAll(".task")); });
    var manual = tasks.filter(function (task) { return task.hasAttribute("data-manual"); }).length;
    homeProg.textContent = modules.length + " topics · " + lessons.length + " lessons · " + tasks.length + " exercises · " + (tasks.length - manual) + " test-checked · " + manual + " self-checked";
    if (d || state.lastLesson) {
      homeProg.textContent += " · " + d + " lessons complete" + (next ? " · Next: " + next.title : "");
    }
    var map = document.getElementById("courseMap");
    modules.forEach(function (module) {
      var box = el("section", { id: "topic-" + module.id });
      var completed = module.lessons.filter(function (l) { return state.lessons[l.n]; }).length;
      var count = completed ? completed + "/" + module.lessons.length + " complete" : module.lessons.length + " lessons";
      box.appendChild(el("p", { class: "module-meta" }, "Topic " + module.id + " · " + count));
      box.appendChild(el("h3", null, module.name));
      box.appendChild(el("p", null, module.blurb));
      var ol = el("ol");
      module.lessons.forEach(function (l) {
        var li = el("li"), a = lessonLink(l);
        if (l === next && (d || state.lastLesson)) a.appendChild(el("span", { class: "next-up" }, "Up next"));
        li.appendChild(a); ol.appendChild(li);
      });
      box.appendChild(ol);
      map.appendChild(box);
    });
  }

  function renderLesson(l) {
    var idx = lessons.indexOf(l);
    document.title = l.title + " · Python for TypeScript developers";
    view.innerHTML = "";
    var head = el("header", { class: "lesson-head" });
    var breadcrumb = el("nav", { class: "breadcrumb", "aria-label": "Breadcrumb" });
    breadcrumb.appendChild(el("a", { href: "#curriculum" }, "Curriculum"));
    breadcrumb.appendChild(el("span", { "aria-hidden": "true" }, "/"));
    breadcrumb.appendChild(el("a", { href: "#topic-" + l.section }, SECTIONS[l.section].name));
    head.appendChild(breadcrumb);
    head.appendChild(el("p", { class: "kicker" }, "Topic " + l.section + " · Lesson " + l.number));
    head.appendChild(el("h1", null, l.title));
    view.appendChild(head);
    var body = el("article");
    body.appendChild(l.tpl.content.cloneNode(true));
    view.appendChild(body);

    var lead = body.querySelector(".lead");
    if (lead) head.appendChild(lead);
    var meta = el("div", { class: "lesson-meta" });
    var tasks = body.querySelectorAll(".task");
    var practice = body.querySelector(".tasks").previousElementSibling;
    practice.id = "lesson-" + l.n + "-practice";
    meta.appendChild(el("span", null, "About 20 min + practice"));
    meta.appendChild(el("a", { class: "jump-link", href: "#" + practice.id }, "Jump to practice ↓"));
    head.appendChild(meta);

    tasks.forEach(function (task) {
      var id = task.dataset.task, box = task.querySelector(".done input");
      if (!box) return;
      box.checked = !!state.tasks[id];
      task.classList.toggle("is-done", box.checked);
      box.addEventListener("change", function () {
        if (box.checked) state.tasks[id] = true; else delete state.tasks[id];
        task.classList.toggle("is-done", box.checked);
        save();
        syncFinish();
      });
    });

    var foot = el("footer", { class: "lesson-foot" });
    var finish = el("div", { class: "lesson-finish" });
    var finishCopy = el("div");
    var finishTitle = el("strong");
    var taskCount = el("p", { role: "status" });
    var btn = el("button", { class: "btn btn-complete", type: "button" }, "Mark lesson complete");
    function syncFinish() {
      var done = !!state.lessons[l.n];
      btn.setAttribute("aria-pressed", done ? "true" : "false");
      finishTitle.textContent = done ? "Lesson complete" : "Wrap up this lesson";
      taskCount.textContent = body.querySelectorAll(".task.is-done").length + " of " + tasks.length + " exercises checked off";
    }
    syncFinish();
    btn.addEventListener("click", function () {
      if (state.lessons[l.n]) delete state.lessons[l.n]; else state.lessons[l.n] = true;
      save(); syncFinish(); updateOutline(l);
    });
    finishCopy.appendChild(finishTitle);
    finishCopy.appendChild(taskCount);
    finish.appendChild(finishCopy);
    finish.appendChild(btn);
    foot.appendChild(finish);

    function addPagerLink(href, label, title, next) {
      var link = el("a", { href: href, class: next ? "next" : "previous" });
      link.appendChild(el("small", null, label));
      link.appendChild(document.createTextNode(title));
      pager.appendChild(link);
    }
    var pager = el("nav", { class: "pager", "aria-label": "Lesson navigation" });
    if (idx > 0) addPagerLink("#lesson-" + lessons[idx - 1].n, "← Previous lesson", lessons[idx - 1].title, false);
    if (idx < lessons.length - 1) addPagerLink("#lesson-" + lessons[idx + 1].n, "Next lesson →", lessons[idx + 1].title, true);
    else addPagerLink("#curriculum", "Course overview →", "Back to the curriculum", true);
    foot.appendChild(pager);
    view.appendChild(foot);
  }

  function route(event) {
    var hash = location.hash;
    var m = /^#lesson-([a-z0-9]+(?:\.\d+)?)(-practice)?$/.exec(hash);
    var l = m ? lessons.find(function (x) { return x.n === m[1] || x.number === m[1]; }) : undefined;
    var page = l ? l.n : "home";
    if (renderedPage !== page) {
      resetSearch();
      if (l) {
        if (state.lastLesson !== l.n) { state.lastLesson = l.n; save(); }
        renderLesson(l);
      } else {
        renderHome();
      }
      renderedPage = page;
      updateOutline(l);
      highlight();
      scrollObserver.disconnect();
      view.querySelectorAll(scrollPanels).forEach(function (panel) { scrollObserver.observe(panel); });
    }
    setDrawer(false);
    var legacyModule = /^#module-([1-8])$/.exec(hash);
    var sectionId = legacyModule ? "topic-" + legacyModules[legacyModule[1]] : hash.slice(1);
    var section = l && m[2] ? document.getElementById("lesson-" + l.n + "-practice")
      : !l && /^#(?:curriculum|topic-\d+|module-[1-8])$/.test(hash) ? document.getElementById(sectionId) : null;
    if (section) section.scrollIntoView();
    else window.scrollTo(0, 0);
    if (!mobile.matches) revealCurrentLesson();
    if (event) focusHeading(section && (section.querySelector("h3") || section));
  }

  document.fonts.addEventListener("loadingdone", function () { updateScrollPanels(view.querySelectorAll(scrollPanels)); });
  view.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (!e.target.matches(scrollPanels) || e.target.tabIndex !== 0) return;
    e.preventDefault();
    e.target.scrollLeft += e.key === "ArrowRight" ? 40 : -40;
  });
  skipLink.addEventListener("click", function (e) {
    e.preventDefault();
    main.scrollIntoView({ block: "start" });
    focusHeading();
  });
  menuBtn.addEventListener("click", function () { setDrawer(true); });
  search.addEventListener("input", filterOutline);
  clearSearch.addEventListener("click", function () { resetSearch(); search.focus(); });
  drawerClose.addEventListener("click", closeDrawer);
  drawerBackdrop.addEventListener("click", closeDrawer);
  drawer.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!mobile.matches || !link || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (link.getAttribute("href") === (location.hash || "#")) {
      e.preventDefault();
      resetSearch();
      setDrawer(false);
      window.scrollTo(0, 0);
      focusHeading();
    }
  });
  drawer.addEventListener("keydown", function (e) {
    if (menuBtn.getAttribute("aria-expanded") !== "true") return;
    if (e.key === "Escape") {
      closeDrawer();
    } else if (e.key === "Tab") {
      var last = drawer.querySelector(".side-foot button");
      if (e.shiftKey && document.activeElement === drawerClose) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        drawerClose.focus();
      }
    }
  });
  mobile.addEventListener("change", function () {
    var active = document.activeElement;
    var wasOpen = menuBtn.getAttribute("aria-expanded") === "true";
    setDrawer(false);
    if (mobile.matches && drawer.contains(active)) menuBtn.focus({ preventScroll: true });
    if (!mobile.matches) {
      revealCurrentLesson();
      if (wasOpen || topbar.contains(active)) focusHeading();
    }
  });

  var root = document.documentElement;
  var systemTheme = matchMedia("(prefers-color-scheme: dark)");
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return systemTheme.matches;
  }
  function syncThemeBtns() {
    var dark = isDark();
    document.querySelectorAll(".themeBtn").forEach(function (b) {
      var label = dark ? "Switch to light theme" : "Switch to dark theme";
      if (b.closest(".side-foot")) b.textContent = label;
      else b.toggleAttribute("data-dark", dark);
      b.setAttribute("aria-label", label);
    });
  }
  document.querySelectorAll(".themeBtn").forEach(function (b) {
    b.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("pyts-theme", next); } catch (e) {}
      syncThemeBtns();
    });
  });
  systemTheme.addEventListener("change", syncThemeBtns);
  syncThemeBtns();

  buildOutline();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
