<template class="lesson" data-n="09" data-section="3" data-title="Classes and methods" data-summary="Instance and class attributes, properties, inheritance, overriding and super().">
  <p class="lead">Classes work much like TypeScript classes. The visible differences are an explicit <code>self</code>, no <code>new</code> keyword, and conventions instead of access modifiers.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">class Account {
  private balance = 0;

  constructor(public owner: string) {}

  deposit(amount: number): void {
    this.balance += amount;
  }

  get total(): number {
    return this.balance;
  }
}

const acct = new Account("Ada");
acct.deposit(50);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">class Account:
    def __init__(self, owner: str) -&gt; None:
        self.owner = owner
        self._balance = 0.0

    def deposit(self, amount: float) -&gt; None:
        self._balance += amount

    @property
    def total(self) -&gt; float:
        return self._balance


acct = Account("Ada")
acct.deposit(50)
print(acct.total)  # 50.0</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>__init__</code> initializes a new instance, like TypeScript’s constructor body. You create instances by calling the class: <code>Account("Ada")</code>.</li>
    <li><code>self</code> is <code>this</code>, written explicitly as the first parameter of an instance method.</li>
    <li>There’s no <code>private</code>. A leading underscore, <code>_balance</code>, means “internal, don’t touch from outside” by convention.</li>
    <li><code>@property</code> turns a method into a getter: read <code>acct.total</code>, not <code>acct.total()</code>.</li>
    <li>“Dunder” methods customize behavior: <code>__repr__</code> for debug printing, <code>__eq__</code> for <code>==</code>, <code>__len__</code> for <code>len()</code>. That’s why Python writes <code>len(x)</code> where TypeScript writes <code>x.length</code>: <code>len</code> calls your <code>__len__</code>.</li>
    <li>More dunders: <code>__lt__</code> makes instances sortable with <code>sorted()</code>, <code>__add__</code> defines <code>+</code>, and <code>__iter__</code> makes an object work in a <code>for</code> loop. Defining <code>__eq__</code> makes instances unhashable, so they can’t be dict keys or set members, unless you also define <code>__hash__</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure">
    <div class="anatomy">
      <div class="c">class Account:</div><div class="l">Class name and a colon, no braces</div>
      <div class="c">    def __init__(self, owner):</div><div class="l">Constructor, runs when you call <code>Account(...)</code></div>
      <div class="c">        self.owner = owner</div><div class="l">Instance attribute, like <code>this.owner</code></div>
      <div class="c">        self._balance = 0.0</div><div class="l">Underscore: internal by convention</div>
      <div class="c">    def deposit(self, amount):</div><div class="l">Method: <code>self</code> always comes first</div>
      <div class="c">    @property</div><div class="l">Makes the next method a getter</div>
      <div class="c">acct = Account("Ada")</div><div class="l">No <code>new</code>: just call the class</div>
    </div>
    <figcaption>When you call <code>acct.deposit(50)</code>, Python passes <code>acct</code> as <code>self</code> automatically.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Forget <code>self</code> in a method definition and you’ll get “deposit() takes 1 positional argument but 2 were given”. The missing argument is the instance itself.</p></aside>
  <h2>Instance and class attributes</h2>
  <p><code>self.owner</code> and <code>self._balance</code> belong to one account. An attribute defined directly in the class body, such as <code>currency = "EUR"</code>, belongs to the class (like a TypeScript <code>static</code> field). You can read it as <code>Account.currency</code> or <code>acct.currency</code> if the instance hasn’t set its own value. Put mutable state such as <code>self.transactions = []</code> in <code>__init__</code> if every account needs its own list.</p>
  <h2>Inheritance and overriding</h2>
  <p><code>class AuditedAccount(Account):</code> is Python’s <code>class AuditedAccount extends Account</code>. The subclass below keeps the original deposit behavior and also counts deposits. Add this code below the corresponding <code>Account</code> example above.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">class AuditedAccount extends Account {
  depositCount: number;

  constructor(owner: string) {
    super(owner);
    this.depositCount = 0;
  }

  override deposit(amount: number): void {
    super.deposit(amount);
    this.depositCount += 1;
  }
}

const audited = new AuditedAccount("Ada");
const account: Account = audited;
account.deposit(50);
console.log(account.total, audited.depositCount); // 50 1</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from typing import override


class AuditedAccount(Account):
    def __init__(self, owner: str) -&gt; None:
        super().__init__(owner)
        self.deposit_count = 0

    @override
    def deposit(self, amount: float) -&gt; None:
        super().deposit(amount)
        self.deposit_count += 1


def fund(account: Account, amount: float) -&gt; None:
    account.deposit(amount)


audited = AuditedAccount("Ada")
fund(audited, 50)
print(audited.total, audited.deposit_count)  # 50.0 1
print(isinstance(audited, Account))  # True</code></pre></div>
  </div>
  <ul class="points">
    <li><strong>Inherit:</strong> <code>AuditedAccount</code> doesn’t define <code>total</code>, so it uses the property from <code>Account</code>. A subclass that doesn’t define <code>__init__</code> also inherits it.</li>
    <li><strong>Override:</strong> defining <code>deposit</code> again changes which method runs. Even though <code>fund</code> accepts an <code>Account</code>, Python calls the method on the actual object. <code>@override</code> is optional; it lets a type checker flag a typo or an incompatible override.</li>
    <li><strong>Extend:</strong> <code>super().deposit(amount)</code> calls the next implementation, here <code>Account.deposit</code>. A replacement that doesn’t need the original behavior can leave out the call.</li>
  </ul>
  <aside class="trap"><strong>TS trap</strong><p>If you write a subclass <code>__init__</code>, Python neither calls the base initializer automatically nor requires you to call it. Forget <code>super().__init__(owner)</code> here and <code>owner</code> and <code>_balance</code> won’t be set, so the first deposit will raise <code>AttributeError</code>.</p></aside>
  <p>Unlike TypeScript, Python allows multiple base classes. With more than one, <code>super()</code> follows the method resolution order (MRO), which you can inspect with <code>SomeClass.mro()</code>.</p>
  <p>Inherit when the subclass can stand in for the base class: an <code>AuditedAccount</code> is an <code>Account</code>. If a report merely uses an account, give the report an <code>Account</code> attribute instead (composition). If callers only care that an object provides certain methods or attributes, see <a href="#lesson-13">Lesson 3.5 on protocols</a>.</p>
  <h2>Alternate constructors</h2>
  <p>An instance method receives <code>self</code>; a <code>@classmethod</code> receives the class as <code>cls</code>. Use it for named alternate constructors. Unlike hard-coding a class name, calling <code>cls(...)</code> also works when a subclass inherits the method and accepts the same initializer arguments. A <code>@staticmethod</code> receives neither <code>self</code> nor <code>cls</code>; often a module-level function is simpler.</p>
  <pre><code class="language-python">class Temperature:
    def __init__(self, celsius: float) -&gt; None:
        self.celsius = celsius

    @classmethod
    def from_fahrenheit(cls, fahrenheit: float) -&gt; "Temperature":
        return cls((fahrenheit - 32) * 5 / 9)


print(Temperature.from_fahrenheit(68).celsius)  # 20.0</code></pre>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="09-1"><p class="task-text">Add <code>withdraw(amount)</code> to <code>Account</code>. It raises <code>ValueError</code> when the balance is too low.</p>
      <details><summary>Solution</summary><pre><code class="language-python">    def withdraw(self, amount: float) -&gt; None:
        if amount &gt; self._balance:
            raise ValueError("insufficient funds")
        self._balance -= amount</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="09-2"><p class="task-text">Add a <code>__repr__</code> so that <code>print(acct)</code> shows <code>Account(owner='Ada', balance=50.0)</code>.</p>
      <details><summary>Hint</summary><p>Inside an f-string, <code>{value!r}</code> uses the value’s own repr, which adds quotes around strings.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">    def __repr__(self) -&gt; str:
        return f"Account(owner={self.owner!r}, balance={self._balance})"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="09-3"><p class="task-text">Create <code>SavingsAccount(Account)</code> with an <code>add_interest(rate)</code> method, where 0.05 means 5%.</p>
      <details><summary>Hint</summary><p>There’s no extra state to initialize, so inherit <code>__init__</code> as-is. Reuse <code>self.total</code> and <code>self.deposit(...)</code> rather than changing <code>_balance</code> directly.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">class SavingsAccount(Account):
    def add_interest(self, rate: float) -&gt; None:
        self.deposit(self.total * rate)

savings = SavingsAccount("Ada")
savings.deposit(100)
savings.add_interest(0.05)
print(savings.total)  # 105.0</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="10" data-section="3" data-title="Dataclasses" data-summary="Typed data containers with the boilerplate written for you.">
  <p class="lead">When a class mostly holds data, a dataclass writes the constructor, the debug output and equality for you. It’s the closest thing to a TS interface with a constructor attached.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">interface Point {
  x: number;
  y: number;
}
const p: Point = { x: 1, y: 2 };

interface User {
  readonly name: string;
  readonly tags: string[];
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from dataclasses import dataclass, field

@dataclass
class Point:
    x: float
    y: float

p = Point(1, 2)
print(p)                  # Point(x=1, y=2)
print(p == Point(1, 2))   # True

@dataclass(frozen=True)
class User:
    name: str
    tags: list[str] = field(default_factory=list)</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>The <code>@dataclass</code> decorator reads the annotated fields and generates <code>__init__</code>, <code>__repr__</code> and <code>__eq__</code>.</li>
    <li><code>frozen=True</code> makes instances read-only, like <code>Readonly&lt;T&gt;</code> but enforced at runtime.</li>
    <li>Mutable defaults need <code>field(default_factory=list)</code>. That’s lesson 2.4’s trap, solved properly.</li>
    <li>Instances aren’t dicts: you write <code>p.x</code>, not <code>p["x"]</code>. Convert with <code>dataclasses.asdict(p)</code> when you need a dict, for example for JSON.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 210" role="img" aria-label="Three lines of a dataclass generate __init__, __repr__ and __eq__">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <text class="small muted" x="20" y="24">You write</text>
      <rect class="box-py" x="20" y="34" width="200" height="140" rx="8"/>
      <text class="mono" x="34" y="66">@dataclass</text>
      <text class="mono" x="34" y="92">class Point:</text>
      <text class="mono" x="62" y="118">x: float</text>
      <text class="mono" x="62" y="144">y: float</text>
      <path class="arrow" d="M230,104 L290,104"/>
      <text class="small muted" x="300" y="24">Python generates</text>
      <rect class="box" x="300" y="34" width="280" height="40" rx="8"/><text class="mono-s" x="314" y="59">__init__(self, x, y)</text>
      <rect class="box" x="300" y="84" width="280" height="40" rx="8"/><text class="mono-s" x="314" y="109">__repr__  → "Point(x=1, y=2)"</text>
      <rect class="box" x="300" y="134" width="280" height="40" rx="8"/><text class="mono-s" x="314" y="159">__eq__    compares x and y</text>
    </svg></div>
    <figcaption>Add <code>order=True</code> to also get <code>&lt;</code> and <code>&gt;</code>, compared field by field.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Two dataclass instances with the same fields are <code>==</code>, unlike two TS objects with the same shape. Use <code>is</code> if you need “same instance”.</p></aside>
  <h2>Give each instance its own values</h2>
  <p>A default factory is a callable, not a value. Pass <code>list</code> rather than <code>list()</code>: the generated initializer calls it each time a caller leaves out the field.</p>
  <pre><code class="language-python">from dataclasses import asdict, dataclass, field


@dataclass
class Project:
    name: str
    tags: list[str] = field(default_factory=list)


course = Project("Course")
notes = Project("Notes")
course.tags.append("python")
print(asdict(course))  # {'name': 'Course', 'tags': ['python']}
print(notes.tags)      # []</code></pre>
  <p><code>frozen=True</code> blocks reassigning fields, but it doesn’t freeze a list inside the instance. Use an immutable field type such as <code>tuple[str, ...]</code> when the contents should be fixed too. Dataclasses generate code from annotations; they don’t validate incoming values. Use <a href="#lesson-13">Pydantic</a> for that boundary.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="10-1"><p class="task-text">Create a <code>Book</code> dataclass with <code>title</code>, <code>author</code>, <code>year</code> and a <code>tags</code> list that defaults to empty.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from dataclasses import dataclass, field

@dataclass
class Book:
    title: str
    author: str
    year: int
    tags: list[str] = field(default_factory=list)

print(Book("Dune", "Frank Herbert", 1965))</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="10-2"><p class="task-text">Create <code>Version(major, minor, patch)</code> with <code>order=True</code> and sort <code>[Version(1, 10, 0), Version(1, 2, 3), Version(0, 9, 9)]</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@dataclass(order=True)
class Version:
    major: int
    minor: int
    patch: int

versions = [Version(1, 10, 0), Version(1, 2, 3), Version(0, 9, 9)]
print(sorted(versions))  # 0.9.9, then 1.2.3, then 1.10.0</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="10-3"><p class="task-text">Make <code>Point</code> frozen, then try <code>p.x = 5</code> and read the error.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@dataclass(frozen=True)
class Point:
    x: float
    y: float

p = Point(1, 2)
p.x = 5  # dataclasses.FrozenInstanceError: cannot assign to field 'x'</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="11" data-section="3" data-title="Enums and match" data-summary="Named constants and structural pattern matching, Python’s take on discriminated unions.">
  <p class="lead"><code>Enum</code> gives you named constants, and <code>match</code> is a switch that looks at the shape of a value, not just its value. Together they cover what you’d do with discriminated unions in TS.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">type Shape =
  | { kind: "circle"; radius: number }
  | { kind: "rect"; w: number; h: number };

function area(s: Shape): number {
  switch (s.kind) {
    case "circle":
      return Math.PI * s.radius ** 2;
    case "rect":
      return s.w * s.h;
  }
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">import math
from dataclasses import dataclass

@dataclass
class Circle:
    radius: float

@dataclass
class Rect:
    w: float
    h: float

def area(shape: Circle | Rect) -&gt; float:
    match shape:
        case Circle(radius=r):
            return math.pi * r ** 2
        case Rect(w=w, h=h):
            return w * h
        case _:
            raise TypeError(f"unknown shape: {shape}")</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>The class is the discriminator: no <code>kind</code> field needed. <code>Circle(radius=r)</code> checks the type and pulls out the field in one step.</li>
    <li><code>match</code> also matches lists, <code>case ["go", direction]:</code>, dicts, <code>case {"type": "click"}:</code>, and guards, <code>case n if n &gt; 0:</code>.</li>
    <li><code>case _:</code> is <code>default</code>. There’s no fall-through and no <code>break</code>.</li>
    <li>Enums: <code>class Status(Enum): DRAFT = "draft"</code>. Use <code>Status.DRAFT</code>, <code>Status("draft")</code> and <code>.value</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 260" role="img" aria-label="match tries each case from top to bottom; the first one that fits runs">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-ts" x="20" y="16" width="270" height="42" rx="8"/><text class="mono" x="34" y="43">shape = Rect(w=2, h=3)</text>
      <path class="arrow" d="M155,58 L155,86"/>
      <rect class="box" x="20" y="90" width="270" height="42" rx="8"/><text class="mono" x="34" y="117">case Circle(radius=r):</text>
      <text class="small muted" x="310" y="117">doesn’t fit, try the next case</text>
      <path class="arrow" d="M155,132 L155,160"/>
      <rect class="box-ok" x="20" y="164" width="270" height="42" rx="8"/><text class="mono" x="34" y="191">case Rect(w=w, h=h):</text>
      <path class="arrow" d="M290,185 L336,185"/>
      <rect class="box-py" x="340" y="164" width="240" height="42" rx="8"/><text class="mono" x="354" y="191">return w * h   # 6</text>
      <rect class="box" x="20" y="216" width="270" height="36" rx="8" opacity=".5"/><text class="mono muted" x="34" y="240">case _:</text>
      <text class="small muted" x="310" y="240">never reached</text>
    </svg></div>
    <figcaption>Cases are tried in order. The first one whose pattern fits runs, and its pattern variables (<code>w</code>, <code>h</code>) are filled in.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Nothing forces a <code>match</code> to be exhaustive at runtime. If no case fits, execution continues after the <code>match</code>. In <code>area()</code> above, the final <code>case _:</code> raises instead of letting the function fall through and return <code>None</code>.</p></aside>
  <h2>Enum members, names and values</h2>
  <p>Use an enum when you want a closed set of named choices at runtime. The member is <code>Status.DRAFT</code>, its name is <code>"DRAFT"</code>, and its value is <code>"draft"</code>. Look up by value with parentheses or by name with brackets.</p>
  <pre><code class="language-python">from enum import Enum


class Status(Enum):
    DRAFT = "draft"
    PUBLISHED = "published"


def can_edit(status: Status) -&gt; bool:
    match status:
        case Status.DRAFT:
            return True
        case Status.PUBLISHED:
            return False


status = Status("draft")
print(status.name, status.value)      # DRAFT draft
print(Status["DRAFT"] is status)      # True
print(can_edit(status))               # True</code></pre>
  <p><code>Status("archived")</code> raises <code>ValueError</code>; <code>Status["ARCHIVED"]</code> raises <code>KeyError</code>. At a JSON boundary, read the string into an enum member and write <code>status.value</code> back out. For a choice that only needs static checking, compare <code>Literal</code> in <a href="#lesson-14">Lesson 3.6</a>.</p>
  <h2>Capture values and guard a case</h2>
  <p>A bare name in a pattern captures a value: <code>case draft:</code> binds <code>draft</code>, it doesn’t compare with a variable of that name. Use a literal or a qualified member such as <code>case Status.DRAFT:</code> when you mean a specific value. A guard checks an extra condition <em>after</em> the pattern matches.</p>
  <pre><code class="language-python">def describe(event: dict[str, object]) -&gt; str:
    match event:
        case {"type": "click", "count": int(n)} if n &gt; 1:
            return f"{n} clicks"
        case {"type": "click"}:
            return "Click event"
        case _:
            return "Unknown event"


print(describe({"type": "click", "count": 3, "source": "menu"}))  # 3 clicks
print(describe({"type": "click", "count": 1}))  # Click event</code></pre>
  <p>A mapping pattern requires the listed keys but allows extras. A sequence pattern such as <code>["go", direction]</code> requires exactly two elements unless you add a starred pattern. Put more specific cases first.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="11-1"><p class="task-text">Add a <code>Triangle(base, height)</code> dataclass and support it in <code>area()</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">@dataclass
class Triangle:
    base: float
    height: float

# inside match:
        case Triangle(base=b, height=h):
            return b * h / 2</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="11-2"><p class="task-text">Write <code>handle(command: list[str])</code> that returns “Going north” for <code>["go", "north"]</code>, “Bye” for <code>["quit"]</code>, and “Unknown command” for anything else.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def handle(command: list[str]) -&gt; str:
    match command:
        case ["go", direction]:
            return f"Going {direction}"
        case ["quit"]:
            return "Bye"
        case _:
            return "Unknown command"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="11-3"><p class="task-text">Create a <code>Priority</code> enum with LOW, MEDIUM and HIGH, and a function that returns how many days you have to respond: 5, 2 and 0.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from enum import Enum

class Priority(Enum):
    LOW = "low"
    MEDIUM = "medium"
    HIGH = "high"

def days_to_respond(priority: Priority) -&gt; int:
    match priority:
        case Priority.LOW:
            return 5
        case Priority.MEDIUM:
            return 2
        case Priority.HIGH:
            return 0

print(days_to_respond(Priority("medium")))  # 2</code></pre></details>

</template>

<template class="lesson" data-n="12" data-section="3" data-title="Optional values" data-summary="X | None, narrowing, and living without ?. and ??.">
  <p class="lead">Nullable types work like TypeScript with <code>strictNullChecks</code>: <code>str | None</code> means “a string or nothing”, and the type checker narrows it after a check.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">function findUser(id: number): User | null {
  /* ... */
}

const user = findUser(1);
console.log(user?.name ?? "anonymous");

if (!user) throw new Error("not found");
console.log(user.name);  // narrowed to User</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">def find_user(user_id: int) -&gt; User | None:
    ...

user = find_user(1)
name = user.name if user is not None else "anonymous"
print(name)

if user is None:
    raise LookupError("not found")
print(user.name)  # narrowed to User</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>X | None</code> is the modern spelling; older code writes <code>Optional[X]</code>. Same meaning.</li>
    <li>No <code>?.</code> or <code>??</code>. Use a conditional expression, an early return, <code>dict.get(key, default)</code> for dicts, or <code>getattr(obj, "name", default)</code> for attributes.</li>
    <li>Narrowing works like TS: after <code>if x is None: return</code>, the checker knows <code>x</code> isn’t <code>None</code>. <code>isinstance(x, str)</code> narrows like <code>typeof</code>.</li>
    <li>Early returns keep code flat, which matters more in Python because every nesting level is visible indentation.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 200" role="img" aria-label="Checking for None splits User | None into an early exit and a narrowed User">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-ts" x="10" y="80" width="170" height="42" rx="8"/><text class="mono" x="24" y="107">User | None</text>
      <path class="arrow" d="M180,101 L224,101"/>
      <rect class="box-py" x="228" y="80" width="150" height="42" rx="8"/><text class="mono" x="242" y="107">is None?</text>
      <path class="arrow" d="M378,90 L428,46"/><text class="small" x="384" y="58">yes</text>
      <path class="arrow" d="M378,112 L428,156"/><text class="small" x="384" y="156">no</text>
      <rect class="box-warn" x="432" y="22" width="160" height="42" rx="8"/><text class="small" x="446" y="48">return or raise early</text>
      <rect class="box-ok" x="432" y="136" width="160" height="42" rx="8"/><text class="mono" x="446" y="163">User</text>
    </svg></div>
    <figcaption>Everything after the check sees only <code>User</code>, so you can use <code>user.name</code> without extra guards.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>if not user:</code> also rejects valid falsy values like 0, <code>""</code> and empty lists. When you mean “missing”, write <code>if user is None:</code>.</p></aside>
  <h2>Nullable is not the same as omittable</h2>
  <p><code>str | None</code> allows a value of <code>None</code>. It doesn’t let the caller omit an argument. A default makes the argument omittable. The same distinction matters in dictionaries: <code>dict.get()</code> treats an absent key like a stored <code>None</code> unless you supply a different default.</p>
  <pre><code class="language-python">def label(name: str | None = None) -&gt; str:
    if name is None:
        return "(unnamed)"
    return f"[{name}]"


print(label())      # (unnamed)
print(label(None))  # (unnamed)
print(label(""))    # []

record = {"name": None}
print("name" in record, "email" in record)  # True False</code></pre>
  <p>Remove <code>= None</code> and <code>label(None)</code> still works, but <code>label()</code> raises <code>TypeError</code>. Test membership when an absent key and an explicitly null value mean different things.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="12-1"><p class="task-text">Write <code>first_word(text: str) -&gt; str | None</code> that returns <code>None</code> for blank text.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def first_word(text: str) -&gt; str | None:
    words = text.split()
    return words[0] if words else None</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="12-2"><p class="task-text">Write <code>parse_int(s: str) -&gt; int | None</code> that returns <code>None</code> instead of raising when the text isn’t a number.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def parse_int(s: str) -&gt; int | None:
    try:
        return int(s)
    except ValueError:
        return None</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="12-3"><p class="task-text">Write <code>display_name(user: dict) -&gt; str</code> that returns the nickname, else the name, else “anonymous”.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def display_name(user: dict) -&gt; str:
    nickname = user.get("nickname")
    if nickname is not None:
        return nickname
    name = user.get("name")
    return name if name is not None else "anonymous"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="13" data-section="3" data-title="Protocols and Pydantic" data-summary="Structural typing like TS interfaces, and runtime validation like Zod.">
  <p class="lead">Two tools close the gap with TypeScript: <code>Protocol</code> gives you structural typing, and Pydantic validates untrusted data at runtime the way Zod does.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">interface HasName { name: string }

function hello(x: HasName) {
  return `Hi ${x.name}`;
}

const UserSchema = z.object({
  name: z.string(),
  age: z.number().int(),
});
const user = UserSchema.parse(json);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from typing import Protocol
from pydantic import BaseModel

class HasName(Protocol):
    name: str

def hello(x: HasName) -&gt; str:
    return f"Hi {x.name}"

class User(BaseModel):
    name: str
    age: int

user = User.model_validate({"name": "Ada", "age": "36"})
print(user.age)  # 36, converted to int</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Python’s types are nominal by default. A <code>Protocol</code> makes them structural: any object with a <code>name: str</code> fits <code>HasName</code>, no inheritance needed.</li>
    <li>Type hints never validate at runtime. Pydantic does: it parses dicts (for example, JSON) into typed objects and raises a <code>ValidationError</code> listing every problem.</li>
    <li>By default Pydantic converts compatible values, like <code>"36"</code> to <code>36</code>. Use strict mode to refuse that.</li>
    <li>Install it with <code>uv add pydantic</code>. FastAPI (lesson 10.1) uses it for every request.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 200" role="img" aria-label="Untrusted data goes through model_validate and becomes either a typed User or a ValidationError">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <text class="small muted" x="20" y="54">untrusted data</text>
      <rect class="box" x="20" y="64" width="180" height="70" rx="8"/><text class="mono-s" x="32" y="94">{"name": "Ada",</text><text class="mono-s" x="40" y="116">"age": "36"}</text>
      <path class="arrow" d="M200,99 L236,99"/>
      <rect class="box-py" x="240" y="76" width="150" height="46" rx="8"/><text class="mono-s" x="252" y="104">model_validate</text>
      <path class="arrow" d="M390,90 L426,56"/>
      <path class="arrow" d="M390,108 L426,142"/>
      <rect class="box-ok" x="430" y="20" width="160" height="64" rx="8"/><text class="mono-s" x="442" y="46">User(name='Ada',</text><text class="mono-s" x="450" y="68">age=36)</text>
      <rect class="box-warn" x="430" y="116" width="160" height="64" rx="8"/><text class="mono-s" x="442" y="142">ValidationError</text><text class="small" x="442" y="164">if age were "abc"</text>
    </svg></div>
    <figcaption>Validate once at the edge of your program (API input, files, config), then work with typed objects everywhere else.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>On a plain class or dataclass, <code>age: int</code> won’t stop <code>age="abc"</code> at runtime. Only a validation library like Pydantic enforces types on incoming data.</p></aside>
  <h2>Validate at the boundary</h2>
  <p>A protocol describes what your own code needs, like a TypeScript interface. Pydantic checks input values at runtime, like Zod. Choose strictness at the point you validate: an environment variable may legitimately be text, while an API field might need an actual JSON number.</p>
  <pre><code class="language-python">from pydantic import BaseModel, ValidationError


class Settings(BaseModel):
    retries: int


raw = {"retries": "3"}
print(Settings.model_validate(raw).model_dump())  # {'retries': 3}

try:
    Settings.model_validate(raw, strict=True)
except ValidationError as exc:
    print(exc.errors()[0]["loc"])  # ('retries',)</code></pre>
  <p>Here the first call parses the value and the second rejects it. <code>model_dump()</code> converts validated data back to a dict; <code>model_dump_json()</code> produces JSON text. Neither a protocol nor an annotation alone will perform that initial validation.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="13-1"><p class="task-text">Define a <code>Protocol</code> called <code>Sized</code> with a <code>size(self) -&gt; int</code> method, and two unrelated classes that satisfy it without inheriting from it.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from typing import Protocol

class Sized(Protocol):
    def size(self) -&gt; int: ...

class Folder:
    def size(self) -&gt; int:
        return 3

class Photo:
    def size(self) -&gt; int:
        return 2048

def total_size(items: list[Sized]) -&gt; int:
    return sum(item.size() for item in items)

print(total_size([Folder(), Photo()]))</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="13-2"><p class="task-text">Create a Pydantic <code>Product</code> with <code>name</code>, <code>price</code> and <code>tags</code> (default empty). Validate one good dict and one with <code>"price": "cheap"</code>, and print the error.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from pydantic import BaseModel, ValidationError

class Product(BaseModel):
    name: str
    price: float
    tags: list[str] = []   # safe in Pydantic: each instance gets its own copy

print(Product.model_validate({"name": "Lamp", "price": "19.9"}))
try:
    Product.model_validate({"name": "Lamp", "price": "cheap"})
except ValidationError as err:
    print(err)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="13-3"><p class="task-text">Add a validator to <code>Product</code> that rejects negative prices.</p>
      <details><summary>Hint</summary><p>Use <code>@field_validator("price")</code> on a classmethod that returns the value or raises <code>ValueError</code>.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from pydantic import BaseModel, field_validator

class Product(BaseModel):
    name: str
    price: float

    @field_validator("price")
    @classmethod
    def price_not_negative(cls, value: float) -&gt; float:
        if value &lt; 0:
            raise ValueError("price must be 0 or more")
        return value</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="14" data-section="3" data-title="Typing in depth" data-summary="Generics, literal unions, typed dicts, function types and strict checking: the TypeScript type system, in Python.">
  <p class="lead">So far you’ve used basic hints, <code>X | None</code> and Protocols. Python’s type system goes much further, and almost everything you use in TypeScript has a direct equivalent: generics, string literal unions, typed objects and function types. The big difference is that nothing checks them unless you run a type checker.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">type Order = "asc" | "desc";

interface User {
  name: string;
  age: number;
  email?: string;
}

function first&lt;T&gt;(items: T[]): T | undefined {
  return items[0];
}

type Handler = (user: User) =&gt; string;

class Box&lt;T&gt; {
  constructor(public value: T) {}
}</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from collections.abc import Callable
from typing import Literal, NotRequired, TypedDict

type Order = Literal["asc", "desc"]

class User(TypedDict):
    name: str
    age: int
    email: NotRequired[str]

def first[T](items: list[T]) -&gt; T | None:
    return items[0] if items else None

type Handler = Callable[[User], str]

class Box[T]:
    def __init__(self, value: T) -&gt; None:
        self.value = value</code></pre></div>
  </div>
  <p class="run">Check it with <code>uv run mypy --strict types_demo.py</code>. In VS Code, Pylance shows the same kind of errors as you type.</p>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Generics use square brackets: <code>def first[T](...)</code> and <code>class Box[T]</code> (Python 3.12 and later). Older code declares <code>T = TypeVar("T")</code> and writes <code>class Box(Generic[T])</code>. It means the same thing, and you’ll see it a lot.</li>
    <li><code>Literal["asc", "desc"]</code> is a string literal union, and the <code>type</code> statement creates an alias, like <code>type</code> in TypeScript.</li>
    <li><code>TypedDict</code> types a plain dict with known keys, the closest thing to an <code>interface</code> for JSON-shaped data. <code>NotRequired[str]</code> is <code>email?: string</code>. It doesn’t validate anything at runtime, so untrusted input still goes through Pydantic (lesson 3.5).</li>
    <li><code>Callable[[User], str]</code> is <code>(user: User) =&gt; string</code>, and <code>Callable[..., str]</code> accepts any arguments.</li>
    <li><code>Any</code> is <code>any</code>: it switches checking off. <code>object</code> is <code>unknown</code>: anything fits, but you must narrow it with <code>isinstance</code> before using it. <code>cast(User, data)</code> is <code>data as User</code>, with no runtime check.</li>
    <li><code>@overload</code> declares several signatures for one function, <code>Final</code> marks a name that must not be reassigned, and <code>Self</code> is the return type of a method that returns its own instance, for chaining.</li>
    <li><code>mypy --strict</code> (or pyright’s strict mode) is <code>"strict": true</code>. It requires every function to be annotated and reports hidden <code>Any</code>s. Set <code>strict = true</code> under <code>[tool.mypy]</code> in <code>pyproject.toml</code> (lesson 5.3).</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>TypeScript</th><th>Python</th></tr></thead>
      <tbody>
        <tr><td>T[], Array&lt;T&gt;</td><td><code>list[T]</code></td></tr>
        <tr><td>function f&lt;T&gt;(x: T): T</td><td><code>def f[T](x: T) -&gt; T</code></td></tr>
        <tr><td>class Box&lt;T&gt;</td><td><code>class Box[T]</code></td></tr>
        <tr><td>"asc" | "desc"</td><td><code>Literal["asc", "desc"]</code></td></tr>
        <tr><td>type Id = string</td><td><code>type Id = str</code></td></tr>
        <tr><td>interface User { email?: string }</td><td><code>class User(TypedDict)</code> with <code>NotRequired[str]</code></td></tr>
        <tr><td>(x: number) =&gt; string</td><td><code>Callable[[int], str]</code></td></tr>
        <tr class="diff"><td>any</td><td><code>Any</code></td></tr>
        <tr class="diff"><td>unknown</td><td><code>object</code></td></tr>
        <tr><td>value as User</td><td><code>cast(User, value)</code></td></tr>
        <tr><td>const, readonly</td><td><code>Final</code></td></tr>
        <tr><td>this as a return type</td><td><code>Self</code></td></tr>
        <tr><td>never</td><td><code>Never</code>, <code>assert_never(x)</code></td></tr>
      </tbody>
    </table></div>
    <figcaption>Almost every TypeScript type has a Python spelling. The highlighted rows look alike but differ: <code>object</code>, not <code>Any</code>, is the safe “I don’t know yet” type.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>In TypeScript a type error stops the build. In Python, type hints are never checked when the code runs: a function typed <code>order: Literal["asc", "desc"]</code> happily accepts <code>"up"</code>, and <code>python app.py</code> runs no matter what mypy says. Run mypy in CI so errors can’t be merged, validate data at the edges of your program, and end a <code>match</code> over a union with <code>case _: assert_never(order)</code>, so mypy tells you when a new case isn’t handled.</p></aside>
  <h2>Check that every case is handled</h2>
  <p><code>assert_never()</code> plays the role of a TypeScript <code>never</code> check. The type checker accepts the call only if narrowing has ruled out every possible value. If execution reaches it anyway, it raises <code>AssertionError</code>.</p>
  <pre><code class="language-python">from typing import Literal, assert_never

type Order = Literal["asc", "desc"]


def arrow(order: Order) -&gt; str:
    match order:
        case "asc":
            return "up"
        case "desc":
            return "down"
        case _:
            assert_never(order)


print(arrow("desc"))  # down</code></pre>
  <p>Save this as <code>order.py</code> and run <code>uv run mypy --strict order.py</code>. Then add <code>"none"</code> to the alias without adding a case: mypy flags the call to <code>assert_never()</code>. Parse or validate external input before calling this function; the alias itself doesn’t reject bad input.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="14-1"><p class="task-text">Write a generic <code>group_by(items, key)</code>, like lodash’s <code>groupBy</code>, typed so that mypy knows <code>group_by(["a", "bb"], len)</code> is a <code>dict[int, list[str]]</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Callable, Iterable

def group_by[T, K](
    items: Iterable[T], key: Callable[[T], K]
) -&gt; dict[K, list[T]]:
    groups: dict[K, list[T]] = {}
    for item in items:
        groups.setdefault(key(item), []).append(item)
    return groups</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="14-2"><p class="task-text">Type a <code>sort_users(users, order)</code> function with a <code>Literal</code> alias for the order and a <code>TypedDict</code> for users with an optional <code>email</code>. Because hints aren’t checked at runtime, it must still reject <code>"up"</code> with a <code>ValueError</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from typing import Literal, NotRequired, TypedDict

type Order = Literal["asc", "desc"]

class User(TypedDict):
    name: str
    age: int
    email: NotRequired[str]

def sort_users(users: list[User], order: Order) -&gt; list[User]:
    if order not in ("asc", "desc"):
        raise ValueError(f"order must be 'asc' or 'desc', not {order!r}")
    return sorted(users, key=lambda user: user["age"],
                  reverse=order == "desc")</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="14-3"><p class="task-text">Make a generic <code>Stack[T]</code> class whose <code>push</code> returns <code>Self</code> so calls chain, with <code>pop</code>, <code>peek</code> and <code>len()</code>.</p>
      <details><summary>Solution</summary><pre><code class="language-python">from typing import Self

class Stack[T]:
    def __init__(self) -&gt; None:
        self._items: list[T] = []

    def push(self, item: T) -&gt; Self:
        self._items.append(item)
        return self

    def pop(self) -&gt; T:
        if not self._items:
            raise IndexError("pop from an empty stack")
        return self._items.pop()

    def peek(self) -&gt; T | None:
        return self._items[-1] if self._items else None

    def __len__(self) -&gt; int:
        return len(self._items)</code></pre></details>

  </ol>
</template>

<template class="lesson" data-n="datamodel" data-section="3" data-title="The data model: dunder methods" data-summary="Make your objects work with len, iteration, indexing, equality, hashing and operators.">
  <p class="lead">TypeScript uses protocols such as <code>Symbol.iterator</code> and methods such as <code>toString</code>. Python connects built-in operations to special “dunder” methods, named for their double underscores.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">class Team {
  constructor(private names: string[]) {}
  get length() { return this.names.length; }
  [Symbol.iterator]() { return this.names[Symbol.iterator](); }
  toString() { return `Team(${this.names.join(", ")})`; }
}

const team = new Team(["Ada", "Lin"]);
console.log(team.length, [...team], team.toString());</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">from collections.abc import Iterator

class Team:
    def __init__(self, names: list[str]) -&gt; None:
        self.names = names

    def __len__(self) -&gt; int:
        return len(self.names)

    def __iter__(self) -&gt; Iterator[str]:
        return iter(self.names)

    def __repr__(self) -&gt; str:
        return f"Team({', '.join(self.names)})"

team = Team(["Ada", "Lin"])
print(len(team), list(team), repr(team))</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>len(x)</code> calls <code>__len__</code>; <code>for</code> and <code>iter(x)</code> use <code>__iter__</code>. Indexing calls <code>__getitem__</code>, and <code>item in x</code> uses <code>__contains__</code>.</li>
    <li><code>__repr__</code> is a useful developer-facing representation; <code>__str__</code> is for a human-facing string. They need not be identical.</li>
    <li><code>a + b</code> calls <code>__add__</code>. Return <code>NotImplemented</code> for an unsupported operand so Python can try the reflected operation or raise <code>TypeError</code>.</li>
    <li><code>__eq__</code> defines value equality. If equal objects are used in a set or as dict keys, their hashes must be equal and stay stable while stored.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Operation</th><th>Method Python looks for</th></tr></thead>
      <tbody>
        <tr><td><code>len(items)</code>, <code>for x in items</code></td><td><code>__len__</code>, <code>__iter__</code></td></tr>
        <tr><td><code>items[0]</code>, <code>x in items</code></td><td><code>__getitem__</code>, <code>__contains__</code></td></tr>
        <tr><td><code>a == b</code>, <code>{a}</code></td><td><code>__eq__</code>, <code>__hash__</code></td></tr>
        <tr><td><code>repr(a)</code>, <code>a + b</code></td><td><code>__repr__</code>, <code>__add__</code></td></tr>
      </tbody>
    </table></div>
    <figcaption>Use the ordinary operation at the call site; Python invokes the matching special method.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p>Defining <code>__eq__</code> without defining <code>__hash__</code> makes the class unhashable: Python sets <code>__hash__ = None</code>. Set membership then raises <code>TypeError</code>, even if the object looks immutable.</p></aside>
  <h2>Make equality and hashing agree</h2>
  <p>Choose the same immutable data for both methods. This key compares names without case, so its hash must use that same normalized name. A frozen dataclass prevents changing the field after the object is added to a set.</p>
  <pre><code class="language-python">from dataclasses import dataclass

@dataclass(frozen=True, eq=False)
class CaseKey:
    name: str

    def __eq__(self, other: object) -&gt; bool:
        if not isinstance(other, CaseKey):
            return NotImplemented
        return self.name.casefold() == other.name.casefold()

    def __hash__(self) -&gt; int:
        return hash(self.name.casefold())

print(CaseKey("ADA") in {CaseKey("Ada")})  # True</code></pre>
  <p>Do not hash mutable fields whose value can change. If equality is not a useful stable value comparison, leaving the object unhashable is safer than inventing a hash that violates the contract.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="datamodel-1"><p class="task-text">Make a <code>Playlist</code> support length, iteration, integer indexing, membership, addition and a useful <code>repr</code>. Addition must leave its inputs unchanged.</p>
      <details><summary>Hint</summary><p>Store song names as a tuple and delegate the sequence operations to it.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Iterator

class Playlist:
    def __init__(self, songs: list[str]) -&gt; None:
        self._songs = tuple(songs)
    def __len__(self) -&gt; int:
        return len(self._songs)
    def __iter__(self) -&gt; Iterator[str]:
        return iter(self._songs)
    def __getitem__(self, index: int) -&gt; str:
        return self._songs[index]
    def __contains__(self, song: object) -&gt; bool:
        return song in self._songs
    def __add__(self, other: "Playlist") -&gt; "Playlist":
        if not isinstance(other, Playlist):
            return NotImplemented
        return Playlist(list(self._songs + other._songs))
    def __repr__(self) -&gt; str:
        return f"Playlist({list(self._songs)!r})"</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="datamodel-2"><p class="task-text">Implement case-insensitive equality and hashing for the frozen <code>CaseKey</code>.</p>
      <details><summary>Hint</summary><p>Use <code>casefold()</code> in both methods and <code>NotImplemented</code> for other types.</p></details>
      <details><summary>Solution</summary><p>Use the <code>CaseKey</code> implementation above: compare and hash <code>name.casefold()</code>.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="datamodel-3" data-manual><p class="task-text">Predict what happens when an object defines <code>__eq__</code> but no <code>__hash__</code> and is added to a set. How could an immutable value safely support hashing?</p>
      <details><summary>Hint</summary><p>Equal values need equal, stable hashes.</p></details>
      <details><summary>Solution</summary><p>Python makes it unhashable and the set raises <code>TypeError</code>. Implement compatible methods using immutable fields, or use a suitable frozen dataclass.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="generics" data-section="3" data-title="Generics the modern way" data-summary="Generic functions, classes and aliases, bounds, ParamSpec and TypeIs.">
  <p class="lead">Python’s modern generics look familiar if you know TypeScript, but their type parameters use square brackets. Like TypeScript types, they guide a checker rather than validate values at runtime.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">type Batch&lt;T&gt; = T[];

class Box&lt;T&gt; {
  constructor(public value: T) {}
}

function first&lt;T&gt;(items: Batch&lt;T&gt;): T | undefined {
  return items[0];
}

const box = new Box(3);
console.log(first([box.value, 4]));  // 3</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">type Batch[T] = list[T]

class Box[T]:
    def __init__(self, value: T) -&gt; None:
        self.value = value

def first[T](items: Batch[T]) -&gt; T | None:
    return items[0] if items else None

box = Box(3)
print(first([box.value, 4]))  # 3</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>def first[T]</code>, <code>class Box[T]</code> and <code>type Batch[T]</code> declare their parameters where they are used. You may still see older <code>TypeVar</code> and <code>Generic</code> declarations.</li>
    <li>A bound such as <code>T: Sized</code> says the checker may assume <code>len(value)</code> works, much like <code>T extends</code> in TypeScript. It does not check the bound at runtime.</li>
    <li>A <code>type</code> alias describes another type; it is not a class to pass to <code>isinstance</code>. Use the concrete runtime type for a runtime check.</li>
    <li><code>**P</code> declares a <code>ParamSpec</code>: <code>P.args</code> and <code>P.kwargs</code> carry a callable’s parameters through a decorator.</li>
    <li><code>TypeIs</code> from <code>typing</code> lets a predicate narrow both branches. Its target must be compatible with its input, and the predicate must tell the truth.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <table class="truth">
      <thead><tr><th>Need</th><th>TypeScript</th><th>Python</th></tr></thead>
      <tbody>
        <tr><td>Keep a value’s type</td><td><code>f&lt;T&gt;(x: T): T</code></td><td><code>def f[T](x: T) -&gt; T</code></td></tr>
        <tr><td>Require a capability</td><td><code>T extends HasLength</code></td><td><code>T: Sized</code></td></tr>
        <tr><td>Preserve parameters</td><td><code>Parameters&lt;F&gt;</code></td><td><code>Callable[P, R]</code></td></tr>
        <tr><td>Custom narrowing</td><td><code>x is string</code></td><td><code>TypeIs[str]</code></td></tr>
      </tbody>
    </table></div>
    <figcaption>A type checker follows these relationships; the runtime executes the function bodies.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>Box[int]("wrong")</code> still constructs a box at runtime even though a checker rejects it. A generic annotation is not a validator; use an actual check or Pydantic at an untrusted boundary.</p></aside>
  <h2>Preserve a callable’s signature</h2>
  <p>A decorator that accepts <code>Callable[..., R]</code> loses the relationship between the original arguments and the wrapper. A parameter specification carries positional and keyword parameters together, while <code>wraps</code> keeps useful runtime metadata.</p>
  <pre><code class="language-python">from collections.abc import Callable
from functools import wraps

def traced[**P, R](function: Callable[P, R]) -&gt; Callable[P, R]:
    @wraps(function)
    def wrapper(*args: P.args, **kwargs: P.kwargs) -&gt; R:
        print("calling", function.__name__)
        return function(*args, **kwargs)
    return wrapper

@traced
def label(name: str, *, times: int) -&gt; str:
    return name * times

print(label("Ada", times=2))</code></pre>
  <p>The checker still rejects <code>label(3)</code> or a missing <code>times</code>. For a runtime predicate, write the check itself and annotate its result; here the false branch is also narrowed:</p>
  <pre><code class="language-python">from typing import TypeIs, assert_type

def is_text(value: str | int) -&gt; TypeIs[str]:
    return isinstance(value, str)

def show(value: str | int) -&gt; None:
    if is_text(value):
        assert_type(value, str)
        print(value.upper())
    else:
        assert_type(value, int)
        print(value + 1)

show("ada")
show(2)</code></pre>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="generics-1"><p class="task-text">Write <code>longest</code> for a sequence of sized values. Return the first longest value with its original type; reject an empty sequence.</p>
      <details><summary>Hint</summary><p>Use <code>T: Sized</code> and <code>max(items, key=len)</code>.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Sequence, Sized

def longest[T: Sized](items: Sequence[T]) -&gt; T:
    return max(items, key=len)</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="generics-2"><p class="task-text">Write a typed <code>twice</code> decorator that calls its function twice and returns both results, without losing its parameters or metadata.</p>
      <details><summary>Hint</summary><p>Use <code>**P</code>, <code>P.args</code>, <code>P.kwargs</code> and <code>@wraps</code>.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">from collections.abc import Callable
from functools import wraps

def twice[**P, R](function: Callable[P, R]) -&gt; Callable[P, tuple[R, R]]:
    @wraps(function)
    def wrapper(*args: P.args, **kwargs: P.kwargs) -&gt; tuple[R, R]:
        return function(*args, **kwargs), function(*args, **kwargs)
    return wrapper</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="generics-3" data-manual><p class="task-text">Write an <code>is_text</code> predicate for <code>str | int</code>. What does a checker infer in each branch, and what performs the runtime check?</p>
      <details><summary>Hint</summary><p>Return <code>isinstance(value, str)</code> and annotate the result as <code>TypeIs[str]</code>.</p></details>
      <details><summary>Solution</summary><p>The true branch is <code>str</code>, the false branch is <code>int</code>, and <code>isinstance</code> performs the check. The annotation tells the type checker how to narrow.</p></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="15" data-section="4" data-title="Lists and tuples" data-summary="Negative indexes, slicing, unpacking and in-place vs new-list methods.">
  <p class="lead">Lists are your arrays, with two superpowers: negative indexes and slicing. Tuples are fixed-size, read-only sequences, perfect for returning several values.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const nums = [3, 1, 2];
nums.push(4);
const last = nums[nums.length - 1];
const firstTwo = nums.slice(0, 2);
const [first, ...rest] = nums;
const sorted = [...nums].sort((a, b) =&gt; a - b);
nums.includes(2);</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">nums = [3, 1, 2]
nums.append(4)
last = nums[-1]
first_two = nums[:2]
first, *rest = nums
ordered = sorted(nums)
2 in nums

point = (10, 20)     # tuple
x, y = point</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li>Negative indexes count from the end: <code>nums[-1]</code> is the last item.</li>
    <li>Slicing <code>[start:stop:step]</code> returns a new list. <code>nums[::-1]</code> is a reversed copy.</li>
    <li><code>len(nums)</code>, not <code>nums.length</code>. Membership is <code>in</code>.</li>
    <li><code>append</code> adds one item, <code>extend</code> adds many, <code>pop()</code> removes the last, <code>insert(i, x)</code> inserts.</li>
    <li><code>nums.sort()</code> sorts in place; <code>sorted(nums)</code> returns a new list. Both take <code>key=</code> and <code>reverse=True</code>, and numbers sort numerically by default.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 560 170" role="img" aria-label="Indexes of the string PYTHON, with the slice 1 to 4 highlighted">
      <text class="mono" x="20" y="24">s = "PYTHON"     s[1:4] == "YTH"</text>
      <g class="mono-s muted">
        <text x="105" y="52" text-anchor="middle">0</text><text x="175" y="52" text-anchor="middle">1</text><text x="245" y="52" text-anchor="middle">2</text><text x="315" y="52" text-anchor="middle">3</text><text x="385" y="52" text-anchor="middle">4</text><text x="455" y="52" text-anchor="middle">5</text>
        <text x="105" y="140" text-anchor="middle">-6</text><text x="175" y="140" text-anchor="middle">-5</text><text x="245" y="140" text-anchor="middle">-4</text><text x="315" y="140" text-anchor="middle">-3</text><text x="385" y="140" text-anchor="middle">-2</text><text x="455" y="140" text-anchor="middle">-1</text>
      </g>
      <rect class="box" x="70" y="62" width="70" height="50"/>
      <rect class="box-py" x="140" y="62" width="70" height="50"/>
      <rect class="box-py" x="210" y="62" width="70" height="50"/>
      <rect class="box-py" x="280" y="62" width="70" height="50"/>
      <rect class="box" x="350" y="62" width="70" height="50"/>
      <rect class="box" x="420" y="62" width="70" height="50"/>
      <g class="mono-l"><text x="105" y="94" text-anchor="middle">P</text><text x="175" y="94" text-anchor="middle">Y</text><text x="245" y="94" text-anchor="middle">T</text><text x="315" y="94" text-anchor="middle">H</text><text x="385" y="94" text-anchor="middle">O</text><text x="455" y="94" text-anchor="middle">N</text></g>
      <text class="small" x="20" y="52">index</text>
      <text class="small" x="20" y="140">from end</text>
      <text class="small muted" x="140" y="162">slice starts at index 1 and stops before index 4</text>
    </svg></div>
    <figcaption>Slices work the same on lists, tuples and strings. Out-of-range slices don’t raise, they just return fewer items.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>nums.sort()</code> returns <code>None</code>, so <code>result = nums.sort()</code> leaves you with <code>None</code>. In JS, <code>sort()</code> returns the array.</p></aside>
  <h2>Sort by a key, not a comparator</h2>
  <p>TypeScript’s <code>sort((a, b) =&gt; a.score - b.score)</code> compares pairs. Python’s <code>key=</code> extracts a value from each item once and sorts by that value. Equal keys retain their original order.</p>
  <pre><code class="language-python">scores = [("Ada", 8), ("Grace", 10), ("Lin", 8)]
ranked = sorted(scores, key=lambda entry: entry[1], reverse=True)
print(ranked[:2])  # [('Grace', 10), ('Ada', 8)]
print(scores[0])   # ('Ada', 8)</code></pre>
  <p>Use <code>sorted()</code> to keep the original order available. Here the slice excludes index 2 and copies the selected slots, not the objects inside them.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="15-1"><p class="task-text">Write <code>swap_ends(items)</code> that returns a new list with the first and last items swapped. The input must not change.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def swap_ends(items: list) -&gt; list:
    if len(items) &lt; 2:
        return items[:]
    return [items[-1], *items[1:-1], items[0]]</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="15-2"><p class="task-text">Sort <code>["kiwi", "banana", "fig", "apple"]</code> by length, then by length from longest to shortest.</p>
      <details><summary>Solution</summary><pre><code class="language-python">words = ["kiwi", "banana", "fig", "apple"]
print(sorted(words, key=len))                # ['fig', 'kiwi', 'apple', 'banana']
print(sorted(words, key=len, reverse=True))  # ['banana', 'apple', 'kiwi', 'fig']</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="15-3"><p class="task-text">Write <code>stats(nums)</code> that returns a tuple <code>(minimum, maximum, average)</code>, and unpack the result into three variables.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def stats(nums: list[float]) -&gt; tuple[float, float, float]:
    return min(nums), max(nums), sum(nums) / len(nums)

low, high, avg = stats([4, 8, 15, 16, 23, 42])
print(low, high, avg)  # 4 42 18.0</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
  </ol>
</template>

<template class="lesson" data-n="16" data-section="4" data-title="Strings in depth" data-summary="String methods, formatting tricks, and the difference between str and bytes.">
  <p class="lead">Most string methods have a direct twin in TypeScript. The ones that surprise people are <code>join</code>, the formatting mini-language, and the split between text (<code>str</code>) and raw bytes.</p>
  <div class="compare">
    <div class="pane ts"><div class="pane-head">TypeScript</div><pre><code class="language-typescript">const s = "  Hello, World  ";
s.trim().toLowerCase();
s.includes("World");
s.startsWith("  He");
"a,b,c".split(",");
["a", "b"].join("-");
s.replace("World", "Python");
`Total: ${price.toFixed(2)}`;</code></pre></div>
    <div class="pane py"><div class="pane-head">Python</div><pre><code class="language-python">s = "  Hello, World  "
s.strip().lower()
"World" in s
s.startswith("  He")
"a,b,c".split(",")
"-".join(["a", "b"])
s.replace("World", "Python")
f"Total: {price:.2f}"</code></pre></div>
  </div>
  <h2>What’s different</h2>
  <ul class="points">
    <li><code>join</code> is called on the separator: <code>", ".join(names)</code>. The items must already be strings.</li>
    <li>f-string formats: <code>{n:,}</code> adds thousands separators, <code>{name:&gt;10}</code> right-aligns in 10 characters, and <code>{value=}</code> prints <code>value=…</code> for quick debugging.</li>
    <li>Triple quotes, <code>"""…"""</code>, make multi-line strings. Raw strings, <code>r"C:\temp"</code>, skip escape sequences, which is handy for regular expressions.</li>
    <li>Regular expressions live in the <code>re</code> module, since there are no <code>/…/</code> literals. <code>re.search(r"\d+", text)</code> finds the first match anywhere, <code>re.findall</code> returns them all and <code>re.sub</code> replaces. Careful: <code>re.match</code> only matches at the start of the string. Use <code>re.fullmatch</code> to validate a whole string.</li>
    <li><code>str</code> is Unicode text; <code>bytes</code> is raw data from files and networks. Convert with <code>.encode("utf-8")</code> and <code>.decode("utf-8")</code>.</li>
  </ul>
  <h2>See it</h2>
  <figure class="figure"><div class="figure-scroll">
    <svg class="svg" viewBox="0 0 600 170" role="img" aria-label="encode turns the str café into 5 bytes; decode turns them back into text">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
      <rect class="box-py" x="20" y="36" width="200" height="96" rx="8"/>
      <text class="small muted" x="34" y="58">str (text)</text>
      <text class="mono-l" x="34" y="92">'café'</text>
      <text class="small" x="34" y="118">4 characters</text>
      <rect class="box-ts" x="380" y="36" width="200" height="96" rx="8"/>
      <text class="small muted" x="394" y="58">bytes (raw data)</text>
      <text class="mono" x="394" y="92">b'caf\xc3\xa9'</text>
      <text class="small" x="394" y="118">5 bytes</text>
      <path class="arrow" d="M224,64 L374,64"/><text class="mono-s" x="300" y="56" text-anchor="middle">.encode("utf-8")</text>
      <path class="arrow" d="M376,106 L226,106"/><text class="mono-s" x="300" y="126" text-anchor="middle">.decode("utf-8")</text>
    </svg></div>
    <figcaption>The “é” takes two bytes in UTF-8. Files opened in text mode do this conversion for you.</figcaption>
  </figure>
  <aside class="trap"><strong>TS trap</strong><p><code>", ".join([1, 2, 3])</code> raises <code>TypeError</code>, because Python won’t turn numbers into strings for you. Write <code>", ".join(str(n) for n in nums)</code>.</p></aside>
  <h2>Decode bytes before working with text</h2>
  <p>A Python <code>str</code> holds Unicode text. UTF-8 represents that text as bytes for storage or transfer, so the length can change. This is like using <code>TextEncoder</code> and <code>TextDecoder</code> in TypeScript.</p>
  <pre><code class="language-python">text = "café"
payload = text.encode("utf-8")
print(len(text), len(payload))  # 4 5
print(payload.decode("utf-8"))  # café</code></pre>
  <p>Use the encoding specified by the source. Invalid UTF-8 raises <code>UnicodeDecodeError</code> by default; don’t silently discard bytes to make a decode succeed.</p>
  <h2>Practice</h2>
  <ol class="tasks">
    <li class="task" data-task="16-1"><p class="task-text">Write <code>slugify(text)</code> so that <code>slugify("Hello World, Python!")</code> returns <code>"hello-world-python"</code>.</p>
      <details><summary>Hint</summary><p>Keep characters where <code>ch.isalnum()</code> or <code>ch.isspace()</code>, then <code>split()</code> and join with hyphens.</p></details>
      <details><summary>Solution</summary><pre><code class="language-python">def slugify(text: str) -&gt; str:
    cleaned = "".join(ch for ch in text.lower() if ch.isalnum() or ch.isspace())
    return "-".join(cleaned.split())</code></pre></details>
      <label class="done"><input type="checkbox"> Done</label></li>
    <li class="task" data-task="16-2"><p class="task-text">Count the vowels in a sentence, ignoring case.</p>
      <details><summary>Solution</summary><pre><code class="language-python">def count_vowels(text: str) -&gt; int:
    return sum(1 for ch in text.lower() if ch in "aeiou")

print(count_vowels("Python for TypeScript developers"))  # 8</code></pre></details>

for name, price in items:
    print(f"{name:&lt;10}{price:&gt;8.2f}")</code></pre></details>
